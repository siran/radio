<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wild n Loyal Radio - Host</title>
<style>
  :root {
    --bg:#0e0e10; --panel:#17171a; --line:#2a2a30;
    --fg:#e8e8ea; --dim:#8a8a93; --on:#4ade80; --rec:#f87171;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:920px; margin:0 auto; }
  h1 { font-size:17px; font-weight:600; margin:0 0 18px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--dim);
          text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  input, select { width:100%; padding:11px 12px; margin-bottom:12px; background:#101013;
          border:1px solid var(--line); border-radius:8px; color:var(--fg);
          font:inherit; font-size:16px; }
  input:focus, select:focus { outline:none; border-color:#4a4a55; }
  /* the picker is locked while the mic is open, and the colour set above
     would otherwise hide the browser's own disabled styling */
  select:disabled { opacity:.5; }
  #setup > select { margin:10px 0 0; }
  /* the text-input padding above makes a slider look sunken and cramped */
  input[type=range] { padding:0; margin-bottom:4px; accent-color:var(--on); }
  input[type=range]:disabled { opacity:.45; }
  /* A slider here is on the air, and on a phone one moves if a thumb so much
     as brushes the page. So each one sits beside its own lock and is dead
     until that lock is tapped. */
  .ctl { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .ctl input[type=range] { flex:1; margin-bottom:0; }
  .lock { flex:0 0 auto; width:44px; height:36px; padding:0; line-height:1;
          border:1px solid var(--line); border-radius:8px; background:#101013;
          color:var(--fg); font-size:16px; cursor:pointer; }
  .lock[aria-pressed="false"] { border-color:var(--on); }

  /* One big button. This is a walkie-talkie, not a console. */
  #rec { width:100%; padding:26px; border:0; border-radius:14px; font:inherit;
         font-weight:700; font-size:19px; cursor:pointer; background:var(--fg); color:#000;
         transition:background .15s; }
  #rec.recording { background:var(--rec); color:#fff; }
  #rec:disabled { opacity:.4; cursor:not-allowed; }

  .meter { height:8px; background:#101013; border-radius:99px; overflow:hidden;
           border:1px solid var(--line); margin-top:12px; }
  .meter i { display:block; height:100%; width:0%;
             background:linear-gradient(90deg, var(--on), #fbbf24 75%, var(--rec));
             transition:width .06s linear; }
  .status { font-size:13px; color:var(--dim); margin-top:10px; text-align:center; }
  .err { color:var(--rec); font-size:13px; margin-top:10px; white-space:pre-wrap; }

  /* the music: what is on air, and the few things a host does to it */
  .np { font-size:15px; }
  .path { font-size:11px; color:var(--dim); margin-top:4px; word-break:break-all;
          font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          -webkit-user-select:all; user-select:all; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btns .tbtn { flex:1 1 auto; }
  .tbtn { padding:11px 12px; border:1px solid var(--line); border-radius:8px;
          background:#101013; color:var(--fg); font:inherit; font-size:14px;
          cursor:pointer; }
  .tbtn.on { border-color:var(--on); color:var(--on); }
  .duckrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }

  ul { list-style:none; padding:0; margin:10px 0 0; }
  li { display:flex; justify-content:space-between; gap:10px; font-size:13px;
       color:var(--dim); padding:7px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .ok { color:var(--on); }
  li .bad { color:var(--rec); }
  .foot { text-align:center; font-size:12px; color:var(--dim); margin-top:18px; }
  a { color:var(--dim); }

  summary { cursor:pointer; font-size:12px; color:var(--dim);
            text-transform:uppercase; letter-spacing:.06em; }
  summary::marker { color:var(--line); }
  code { background:#101013; border:1px solid var(--line); border-radius:4px;
         padding:1px 5px; font-size:11px; color:var(--fg); }
  /* the narrator's own page, framed rather than copied so there is only one
     of it to keep working. The height below is only where it starts:
     fitFrame() grows the frame to whatever is inside it, so nothing scrolls
     in a frame of its own. */
  #narrator { display:block; width:100%; height:420px;
              border:1px solid var(--line); border-radius:8px;
              background:var(--bg); margin-top:6px; }

  /* seven bands is a lot of page for something that is set once and then
     forgotten, so it folds away and stays folded. The mixing desk is a stack
     of the same thing - a named slider with a lock - so it shares these two
     rules rather than restating them. */
  #eqwrap { margin:0 0 12px; }
  #eqwrap > label, #deskwrap > label { margin-top:12px; }
  #eqwrap .band, #deskwrap .band { color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">

  <h1>wild n loyal &middot; host</h1>

  <div class="panel">
    <button id="rec">Start talking</button>
    <div class="meter"><i id="vu"></i></div>
    <div class="status" id="status">ready</div>
    <div class="err" id="err"></div>
  </div>

  <div class="panel" id="gainpanel">
    <label for="gain">Your voice volume &mdash; <span id="gainval">1</span>&times;</label>
    <div class="ctl">
      <button class="lock" type="button" id="lockgain" aria-pressed="true">&#128274;</button>
      <input id="gain" type="range" min="0" max="12" step="0.5" value="1" disabled>
    </div>
    <details id="eqwrap">
      <summary title="Seven bands in dB. 0 is flat.">Your voice EQ</summary>
      <label for="eqf100"><span class="band">100 Hz</span> &mdash; rumble &mdash; <span id="eqf100val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf100" aria-pressed="true">&#128274;</button>
        <input id="eqf100" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf200"><span class="band">200 Hz</span> &mdash; body &mdash; <span id="eqf200val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf200" aria-pressed="true">&#128274;</button>
        <input id="eqf200" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf400"><span class="band">400 Hz</span> &mdash; boxiness &mdash; <span id="eqf400val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf400" aria-pressed="true">&#128274;</button>
        <input id="eqf400" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf800"><span class="band">800 Hz</span> &mdash; honk &mdash; <span id="eqf800val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf800" aria-pressed="true">&#128274;</button>
        <input id="eqf800" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf1600"><span class="band">1.6 kHz</span> &mdash; presence &mdash; <span id="eqf1600val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf1600" aria-pressed="true">&#128274;</button>
        <input id="eqf1600" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf3150"><span class="band">3.15 kHz</span> &mdash; consonants &mdash; <span id="eqf3150val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf3150" aria-pressed="true">&#128274;</button>
        <input id="eqf3150" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
      <label for="eqf6300"><span class="band">6.3 kHz</span> &mdash; air &mdash; <span id="eqf6300val">0</span> dB</label>
      <div class="ctl">
        <button class="lock" type="button" id="lockeqf6300" aria-pressed="true">&#128274;</button>
        <input id="eqf6300" type="range" min="-9" max="9" step="0.5" value="0" disabled>
      </div>
    </details>
    <div class="duckrow">
      <button class="tbtn" id="duck" title="whether the music dips under your notes">Music dips</button>
    </div>
  </div>

  <details class="panel" id="setup" hidden>
    <summary id="devlabel">Microphone</summary>
    <select id="dev" aria-label="Microphone"><option value="">default</option></select>
  </details>

  <details class="panel" id="musicpanel" open>
    <summary>Now playing</summary>
    <div class="np" id="npTitle">&mdash;</div>
    <div class="path" id="npPath"></div>
    <div class="btns">
      <button class="tbtn" id="bPrev" title="play what finished last; press again to keep going back">Previous</button>
      <button class="tbtn" id="bSkip">Skip</button>
      <button class="tbtn" id="bAgain" title="play this track once more">Play again</button>
      <button class="tbtn" id="bRepeat">Repeat</button>
      <button class="tbtn" id="bMusic" title="off is silence">Music</button>
      <button class="tbtn" id="bPause" title="on freezes the stream">Pause</button>
    </div>
    <div class="err" id="cerr"></div>
  </details>

  <details class="panel" id="deskwrap">
    <summary title="Liquidsoap's live knobs. Read when this fold is opened.">Mixing desk</summary>
    <label for="mic_gain"><span class="band">Live mic</span> &mdash; <span id="mic_gainval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockmic_gain" aria-pressed="true">&#128274;</button>
      <input id="mic_gain" type="range" disabled>
    </div>
    <label for="voice_gain" title="Only reaches the air for a speaker with no settings of their own. Your voice volume, above, overrides it for your own notes."><span class="band">Voice notes</span> &mdash; default for speakers with no volume of their own &mdash; <span id="voice_gainval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockvoice_gain" aria-pressed="true">&#128274;</button>
      <input id="voice_gain" type="range" disabled>
    </div>
    <label for="hp_freq"><span class="band">Mic low cut</span> &mdash; <span id="hp_freqval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockhp_freq" aria-pressed="true">&#128274;</button>
      <input id="hp_freq" type="range" disabled>
    </div>
    <label for="comp_thr"><span class="band">Compressor threshold</span> &mdash; <span id="comp_thrval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockcomp_thr" aria-pressed="true">&#128274;</button>
      <input id="comp_thr" type="range" disabled>
    </div>
    <label for="comp_ratio"><span class="band">Compressor ratio</span> &mdash; <span id="comp_ratioval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockcomp_ratio" aria-pressed="true">&#128274;</button>
      <input id="comp_ratio" type="range" disabled>
    </div>
    <label for="comp_gain"><span class="band">Make-up volume</span> &mdash; <span id="comp_gainval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockcomp_gain" aria-pressed="true">&#128274;</button>
      <input id="comp_gain" type="range" disabled>
    </div>
    <label for="duck_to"><span class="band">Music under a voice</span> &mdash; <span id="duck_toval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockduck_to" aria-pressed="true">&#128274;</button>
      <input id="duck_to" type="range" disabled>
    </div>
    <label for="hold"><span class="band">Music hold</span> &mdash; <span id="holdval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockhold" aria-pressed="true">&#128274;</button>
      <input id="hold" type="range" disabled>
    </div>
    <label for="glide"><span class="band">Fader speed</span> &mdash; <span id="glideval"></span></label>
    <div class="ctl">
      <button class="lock" type="button" id="lockglide" aria-pressed="true">&#128274;</button>
      <input id="glide" type="range" disabled>
    </div>
    <div class="err" id="derr"></div>
  </details>

  <details class="panel" id="narwrap">
    <summary title="Which voice speaks, how fast, how often, and how it says a name it keeps getting wrong. One setting for the whole station.">The narrator</summary>
    <iframe id="narrator" title="narrator"></iframe>
  </details>

</div>

<div class="foot">
  <a href="/" target="_blank" title="opens in a new tab, so the station sits beside this page">the station &#8599;</a>
    <span class="sep" id="whoamiwrap" hidden>&middot; <span id="whoami"></span> &middot; <a href="/host/logout">log out</a></span>
  &middot; <a href="/host/logout">sign out</a>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  let stream = null, rec = null, ac = null, analyser = null, raf = 0;
  let parts = [], recording = false, startedAt = 0;
  let seq = 0, segTimer = 0;

  // Seconds per slice. This is the largest single piece of the delay you hear:
  // nothing can be sent until the slice finishes. 1.5s roughly halves it, at
  // the cost of twice as many seams - which the ducking tail covers anyway.
  const SEG = 1.5;


  const setStatus = t => { $('status').textContent = t; };

  // The page is behind basic auth, so the browser already holds the credential
  // and normally sends it. Only if an upload comes back 401 do we ask.
  // No credentials in this page at all. The browser was challenged for /host/
  // and uploads go to /host/upload/, which is below it - so it sends the same
  // credential without being asked again, and the server decides who you are.
  const fail = m => { $('err').textContent = m; };

  // A device only has a name once the browser has granted the microphone:
  // before that enumerateDevices() reports every input with an empty label,
  // which is why this list used to read "microphone 1". So the panel appears
  // only once the names are real AND there is more than one to choose between
  // - on a phone there is one mic and nothing to decide, so it stays out of
  // the way. The first press of Start talking grants the permission and the
  // picker arrives with it.
  const MIC_KEY = 'talk.mic';

  async function listDevices() {
    let mics = [];
    try {
      mics = (await navigator.mediaDevices.enumerateDevices())
        .filter(d => d.kind === 'audioinput');
    } catch {}
    const worth = mics.length > 1 && mics.every(d => d.label);
    $('setup').hidden = !worth;
    if (!worth) return;

    const sel = $('dev');
    let want = '';
    try { want = localStorage.getItem(MIC_KEY) || ''; } catch {}
    sel.innerHTML = '<option value="">default</option>';
    for (const d of mics) {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label;
      sel.appendChild(o);
    }
    // An unplugged headset is simply no longer in the list. Falling back to
    // default beats holding a deviceId that getUserMedia would refuse.
    sel.value = mics.some(d => d.deviceId === want) ? want : '';
  }
  listDevices();

  // Which mic this browser uses is a property of this laptop, not of the
  // person talking, so it is remembered here and not in settings.json.
  $('dev').addEventListener('change', () => {
    try { localStorage.setItem(MIC_KEY, $('dev').value); } catch {}
  });
  // Plugging the headset in, or pulling it out, changes what is on offer.
  if (navigator.mediaDevices) navigator.mediaDevices.ondevicechange = listDevices;

  function meter() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    $('vu').style.width = Math.min(100, Math.sqrt(sum / buf.length) * 300) + '%';
    raf = requestAnimationFrame(meter);
  }

  function pickMime() {
    for (const m of ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4']) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }
  const extFor = m => m.includes('ogg') ? 'ogg' : m.includes('mp4') ? 'm4a' : 'webm';

  async function begin() {
    $('err').textContent = '';
    if (!window.isSecureContext) return fail('Needs https to use the microphone.');
    if (!navigator.mediaDevices || !window.MediaRecorder) return fail('This browser cannot record audio.');
    const mime = pickMime();
    if (!mime) return fail('This browser cannot encode audio.');
    const devId = $('dev').value;
    // This page is voice only, so let the phone do what it is good at:
    // noise suppression before anything is uploaded. (The DJ page kept these
    // off because music could pass through it and they mangle music - here
    // there is nothing but speech.) AGC stays off so it does not fight the
    // compressor on the server.
    const constraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: false };
    if (devId) constraints.deviceId = { exact: devId };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
    } catch (e) { return fail('Microphone refused: ' + e.name); }
    listDevices();   // permission now exists, so the names are real
    // Swapping the mic mid-slice would mean tearing down the stream, the
    // recorder and the meter with a slice in flight - a dropped or doubled
    // slice on air. Cheaper to say no, out loud, and let him stop first.
    $('dev').disabled = true;
    $('devlabel').textContent = 'Microphone \u2014 locked while you are on air';

    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(analyser);
    meter();

    recording = true;
    seq = 0;
    $('rec').textContent = 'Stop talking';
    $('rec').classList.add('recording');
    setStatus('on air');
    segment(mime);          // start the first slice
  }

  // A slice is a whole self-contained recording: start, run for SEG seconds,
  // stop. Stopping is what produces a complete file with its own header, so
  // each one plays on its own. Then immediately begin the next.
  // Liquidsoap's 10s ducking tail spans the seams, so the music stays down
  // between slices instead of jumping back in.
  function segment(mime) {
    if (!recording) return;
    parts = [];
    startedAt = Date.now();
    rec = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 96000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    rec.onstop = () => {
      const secs = (Date.now() - startedAt) / 1000;
      send(new Blob(parts, { type: mime.split(';')[0] }), mime, secs);
      if (recording) segment(mime);   // seamless-ish: next slice starts at once
      else teardown();
    };
    rec.start();
    clearTimeout(segTimer);
    segTimer = setTimeout(() => {
      try { rec && rec.state === 'recording' && rec.stop(); } catch {}
    }, SEG * 1000);
  }

  function end() {
    if (!recording) return;
    recording = false;
    clearTimeout(segTimer);
    $('rec').textContent = 'Start talking';
    $('rec').classList.remove('recording');
    setStatus('sending the last slice');
    try { rec && rec.state !== 'inactive' && rec.stop(); } catch {}
  }

  function teardown() {
    try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
    try { ac && ac.close(); } catch {}
    cancelAnimationFrame(raf); analyser = null; $('vu').style.width = '0%';
    $('dev').disabled = false;
    $('devlabel').textContent = 'Microphone';
    setStatus('ready');
  }

  // The whole point: an ordinary upload with a length, not a live stream.
  async function send(blob, mime, secs) {
    if (blob.size < 1500 || secs < 0.4) return;   // silence between slices

    // Name carries the order: liquidsoap lists the folder sorted, so slices
    // play in the order they were spoken even if one arrives late.
    const n = String(++seq).padStart(4, '0');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    // No speaker name here on purpose: caddy files the upload under whoever
    // logged in, so identity is enforced by the server rather than claimed.
    const name = stamp + '-' + n + '-' +
                 Math.random().toString(36).slice(2, 6) + '.' + extFor(mime);
    const li = { lastChild: {} };   // nothing to display; kept so send() reads plainly

    try {
      const res = await fetch('/host/upload/' + name, {
        method: 'PUT',
        headers: { 'Content-Type': blob.type || 'application/octet-stream' },
        credentials: 'same-origin',      // let the browser send what it already holds
        body: blob                       // a Blob: the browser sets Content-Length
      });
      if (res.ok || res.status === 201 || res.status === 204) {
        li.lastChild.className = 'ok';
        li.lastChild.textContent = 'on air';
        if (!recording) setStatus('sent');
      } else {
        li.lastChild.className = 'bad';
        li.lastChild.textContent = 'HTTP ' + res.status;
        setStatus('rejected');
        if (res.status === 401) fail('Your sign-in expired. Reload the page and sign in again.');
        else if (res.status === 403) fail('That file type is not accepted.');
        else if (res.status === 429) fail('Too many notes too quickly - wait a moment.');
      }
    } catch (e) {
      li.lastChild.className = 'bad';
      li.lastChild.textContent = 'failed';
      fail('Upload failed: ' + e.message);
      setStatus('not sent');
    }
  }

  // The mixing desk. These are liquidsoap's own interactive values, drawn as
  // our own sliders instead of framing liquidsoap's page: that is what lets
  // each one have a plain-language label and the same lock as every other
  // slider here. The range is liquidsoap's own, unchanged - see the table
  // below. Reading is GET /control/knobs, which
  // answers [[name, value], ...]; writing is liquidsoap's own POST /interactive
  // with a body of name=value - the very request its page makes - so there is
  // one way to set these and it is liquidsoap's, not a second one of ours.
  //
  // The element id IS the variable's name, exactly as the EQ's ids are its
  // centre frequencies, so this list is the only place the names appear and
  // nothing can drift out of step with liquidsoap.
  //
  // ONE table, and the sliders below are built from it - min, max and step are
  // not repeated on the markup. Every number here is transcribed from the
  // interactive.float declarations in radio.liq and is liquidsoap's own, not a
  // range of ours: nothing is narrowed, and `val` is only what the slider shows
  // before the first read. GET /control/knobs answers [[name, value], ...] and
  // carries no bounds, so until it does, this is where they live. If it ever
  // carries min/max/step, delete these four fields and read them instead.
  const KNOBS = {
    mic_gain:   { unit: '\u00d7', min: 0,    max: 4,   step: 0.1,  val: 3.5  },
    voice_gain: { unit: '\u00d7', min: 0,    max: 12,  step: 0.25, val: 12   },
    hp_freq:    { unit: ' Hz',    min: 40,   max: 300, step: 5,    val: 295  },
    comp_thr:   { unit: ' dB',    min: -40,  max: 0,   step: 1,    val: -29  },
    comp_ratio: { unit: ':1',     min: 1,    max: 20,  step: 0.5,  val: 3.5  },
    comp_gain:  { unit: ' dB',    min: 0,    max: 24,  step: 0.5,  val: 17.5 },
    duck_to:    { unit: '\u00d7', min: 0,    max: 1,   step: 0.05, val: 0.45 },
    hold:       { unit: ' s',     min: 0,    max: 30,  step: 0.5,  val: 3    },
    glide:      { unit: '',       min: 0.01, max: 0.5, step: 0.01, val: 0.01 }
  };
  const showKnob = k => { $(k + 'val').textContent = $(k).value + KNOBS[k].unit; };

  async function loadKnobs() {
    try {
      const res = await fetch('/control/knobs',
        { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      for (const [k, v] of await res.json()) {
        if (!(k in KNOBS)) continue;   // liquidsoap may know knobs we do not draw
        $(k).value = v;
        showKnob(k);
      }
      $('derr').textContent = '';
    } catch (e) { $('derr').textContent = 'Mixing desk: ' + e.message; }
  }

  // Same two-step as the volume and the EQ: dragging only redraws the number,
  // and the value is sent on release. These reach the air the instant they
  // arrive, so one POST per pixel would be one audible change per pixel.
  async function setKnob(k) {
    const v = $(k).value;
    try {
      const res = await fetch('/interactive', {
        method: 'POST',
        credentials: 'same-origin',
        body: k + '=' + encodeURIComponent(v)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      $('derr').textContent = '';
      setStatus(recording ? 'on air' : k + ' set to ' + v);
    } catch (e) { $('derr').textContent = 'Mixing desk: ' + e.message; }
  }

  for (const k in KNOBS) {
    const s = $(k), d = KNOBS[k];
    // Order matters: a range input clamps and rounds its value against
    // whatever min/max/step it holds at the time, so set those before the
    // value or a default such as 3.5 arrives rounded to 4.
    s.min = d.min; s.max = d.max; s.step = d.step; s.value = d.val;
    showKnob(k);
    s.addEventListener('input', () => showKnob(k));
    s.addEventListener('change', () => setKnob(k));
  }

  // Read them when the fold is opened rather than on arrival: that is when
  // someone is about to look, and it is also when they are most likely stale -
  // another host, or liquidsoap's own page, may have moved one since.
  $('deskwrap').addEventListener('toggle', () => {
    if ($('deskwrap').open) loadKnobs();
  });

  // Lazy like the desk above, though for a reason of its own: it is a whole
  // page behind the password, so loading it eagerly would pop an auth prompt
  // on arrival. It sits on a path of its own rather than under /host/, so
  // the browser may ask for the credential once more when the fold is first
  // opened; the realm is the same, so it is asked once and not again.
  $('narwrap').addEventListener('toggle', () => {
    const f = $('narrator');
    if ($('narwrap').open && !f.src) f.src = '/narrator/';
  });

  // A frame with a fixed height scrolls inside itself, which on a phone means
  // two scrollbars and never the one you meant. The narrator page is
  // same-origin, so the height of the page inside can simply be read and the
  // frame grown to it. offsetHeight - clientHeight is the frame's own border:
  // without it every pass would come up that much short and the observer would
  // chase itself down the page.
  function fitFrame(f) {
    const fit = () => {
      try {
        const d = f.contentDocument;
        if (!d) return;
        const want = d.documentElement.scrollHeight + f.offsetHeight - f.clientHeight;
        if (Math.abs(want - f.offsetHeight) > 2) f.style.height = want + 'px';
      } catch {}
    };
    f.addEventListener('load', () => {
      fit();
      try { new ResizeObserver(fit).observe(f.contentDocument.documentElement); } catch {}
    });
  }
  fitFrame($('narrator'));

  // The music. Every one of these answers with the same state object, so one
  // draw() serves the poll and every button alike, and no button has to guess
  // what it did.
  let cur = { repeat: false, music: true, paused: false };

  async function control(path, method) {
    try {
      const res = await fetch('/control/' + path,
        { method, credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      draw(await res.json());
      $('cerr').textContent = '';
    } catch (e) { $('cerr').textContent = 'Music controls: ' + e.message; }
  }
  const nowPlaying = () => control('now', 'GET');

  // A toggle says what it is, not only what colour it is.
  function flag(id, on, text) {
    const b = $(id);
    b.textContent = text + (on ? ': on' : ': off');
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  }

  function draw(s) {
    cur = s;
    // Untagged files come back with empty title and artist. The path never does,
    // and the path is what you need to find the file in the library anyway.
    const named = [s.artist, s.title].filter(Boolean).join(' \u2014 ');
    $('npTitle').textContent =
      named || (s.path || '').split(/[\\/]/).pop() || '\u2014';
    $('npPath').textContent = s.path || '';
    flag('bRepeat', !!s.repeat, 'Repeat');
    flag('bMusic', !!s.music, 'Music');
    flag('bPause', !!s.paused, 'Pause');
  }

  $('bSkip').addEventListener('click', async () => {
    await control('skip', 'POST');
    nowPlaying();     // skip answers with the state before it - the next track
  });                 // is prepared a moment later, and the poll below catches it
  // Like skip, this answers with the state as it was a moment ago - the new
  // track is prepared just after - so re-poll rather than trusting the reply.
  $('bPrev').addEventListener('click', async () => {
    await control('previous', 'POST');
    nowPlaying();
  });
  $('bAgain').addEventListener('click', () => control('again', 'POST'));
  $('bRepeat').addEventListener('click', () => control('repeat?on=' + !cur.repeat, 'POST'));
  $('bMusic').addEventListener('click', () => control('music?on=' + !cur.music, 'POST'));
  $('bPause').addEventListener('click', () => control('pause?on=' + !cur.paused, 'POST'));

  nowPlaying();
  setInterval(nowPlaying, 3000);   // the track changes on its own; so must the name

  // Your own settings. One small json file in your own folder, which
  // liquidsoap reads when it queues your note: how loud you play, whether
  // the music dips under you, and your own seven-band EQ. Caddy files it
  // under whoever authenticated, so the page never says who you are - and no
  // file yet means never set, which is whatever liquidsoap falls back to.
  const SETTINGS_URL = '/host/setting/settings.json';

  // The EQ is seven numbers in dB, 0 meaning flat, on the same object and the
  // same PUT as the volume - liquidsoap reads all of it out of the one file.
  // The key IS the centre frequency in Hz, so the element ids and the line
  // the page says back after a save both come off it, and there is no second
  // list of names to keep in step with liquidsoap.
  const BANDS = ['f100', 'f200', 'f400', 'f800', 'f1600', 'f3150', 'f6300'];
  const flatEq = () => Object.fromEntries(BANDS.map(b => [b, 0]));
  // What each band is called out loud. The key stays the centre in hertz
  // because liquidsoap reads it that way; only the label is conventional.
  const HZ = { f100: '100 Hz', f200: '200 Hz', f400: '400 Hz', f800: '800 Hz',
               f1600: '1.6 kHz', f3150: '3.15 kHz', f6300: '6.3 kHz' };
  const settings = { gain: 12, duck: true, eq: flatEq() };
  const showGain = () => { $('gainval').textContent = $('gain').value; };
  const showBand = b => { $('eq' + b + 'val').textContent = $('eq' + b).value; };

  // Read-modify-write: the volume and the duck live in the same file, so
  // always PUT the whole object - a partial one would erase the other field.
  const showDuck = () => flag('duck', settings.duck, 'Music dips');

  async function loadSettings() {
    try {
      const res = await fetch(SETTINGS_URL, { credentials: 'same-origin', cache: 'no-store' });
      if (res.status !== 404) {
        if (!res.ok) return fail('Could not read your settings: HTTP ' + res.status);
        Object.assign(settings, await res.json());
      }
      if (isFinite(settings.gain)) $('gain').value = settings.gain;
      showGain();
      showDuck();
      // The eq is rebuilt from flat rather than patched in place, and that is
      // what keeps the file bounded and current: whatever came back is read
      // for the seven keys that exist now and then dropped, so the old
      // three-band low/mid/high cannot ride along in the next PUT. An older
      // file therefore comes back flat - the curve is lost, the volume and
      // the ducking are not. This runs after showDuck() on purpose: a throw
      // here would otherwise take those two down with it. Anything that is
      // not a number means flat.
      const had = (settings.eq && typeof settings.eq === 'object') ? settings.eq : {};
      settings.eq = flatEq();
      for (const b of BANDS) {
        const v = parseFloat(had[b]);
        settings.eq[b] = isFinite(v) ? v : 0;
        $('eq' + b).value = settings.eq[b];
        showBand(b);
      }
    } catch (e) { fail('Could not read your settings: ' + e.message); }
  }

  async function saveSettings(msg) {
    try {
      const res = await fetch(SETTINGS_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(settings)
      });
      if (res.ok || res.status === 201 || res.status === 204) {
        $('err').textContent = '';
        setStatus(recording ? 'on air' : msg);
      } else {
        setStatus('not saved');
        fail(res.status === 401
          ? 'Your sign-in expired. Reload the page and sign in again.'
          : 'Could not save your settings: HTTP ' + res.status);
      }
    } catch (e) {
      setStatus('not saved');
      fail('Could not save your settings: ' + e.message);
    }
  }

  $('gain').addEventListener('input', showGain);   // while dragging, show only
  $('gain').addEventListener('change', () => {     // on release, write it
    settings.gain = parseFloat($('gain').value);
    saveSettings('volume saved: ' + settings.gain + '\u00d7');
  });
  // Same two-step as the volume: dragging only redraws the number, and the
  // file is written on release. A slider fires `input` for every pixel, and
  // one webdav PUT per pixel would hammer the folder liquidsoap is polling
  // four times a second.
  for (const b of BANDS) {
    $('eq' + b).addEventListener('input', () => showBand(b));
    $('eq' + b).addEventListener('change', () => {
      settings.eq[b] = parseFloat($('eq' + b).value);
      saveSettings(HZ[b] + ' saved: ' + settings.eq[b] + ' dB');
    });
  }
  // Every slider above is on the air, and a thumb brushing the page used to be
  // enough to move one. So each is disabled until its own lock is tapped. The
  // lock is the host's, not the page's: once open it stays open until the same
  // button is tapped again, so a run of adjustments costs one tap and not one
  // tap per move.
  function lockable(id) {
    const input = $(id), btn = $('lock' + id);
    const set = open => {
      input.disabled = !open;
      btn.textContent = open ? '\u{1F513}' : '\u{1F512}';
      btn.setAttribute('aria-pressed', String(!open));
      btn.title = open ? 'lock it again' : 'unlock to change';
      btn.setAttribute('aria-label', btn.title);
    };
    btn.addEventListener('click', () => set(input.disabled));
    set(false);
  }
  lockable('gain');
  for (const b of BANDS) lockable('eq' + b);
  for (const k in KNOBS) lockable(k);

  // Liquidsoap polls this folder, so the setting IS the button: it lands on air
  // within a quarter second and there is nothing else to tell.
  $('duck').addEventListener('click', () => {
    settings.duck = !settings.duck;
    showDuck();
    saveSettings('music dips under you: ' + (settings.duck ? 'on' : 'off'));
  });
  loadSettings();

  // One click opens the mic, another closes it. Holding a phone button for a
  // whole thought is miserable, and this makes a back-and-forth possible.
  $('rec').addEventListener('click', () => recording ? end() : begin());
  window.addEventListener('beforeunload', e => {
    if (recording) { e.preventDefault(); e.returnValue = ''; }
  });
})();
  // Basic auth never tells a page who is using it, so the server does: /whoami
  // answers with the same credential Caddy already uses to pick a host's own
  // upload folder. Silent on failure - a footer is not worth an error.
  (async () => {
    try {
      const r = await fetch('/whoami', { credentials: 'same-origin', cache: 'no-store' });
      if (!r.ok) return;
      const who = (await r.text()).trim();
      if (!who) return;
      const el = document.getElementById('whoami');
      if (el) el.textContent = who;
      const w = document.getElementById('whoamiwrap');
      if (w) w.hidden = false;
    } catch (e) { /* leave it hidden */ }
  })();
</script>
</body>
</html>
