    if (rollLikes > 0 && prevTitle) {
      // Filed under the name the PANEL was showing, which is icecast's, and
      // read back under the same name rebuilt from /earlier's two fields. See
      // the matching note in renderRecent. One reading per name, the newest
      // kept. Sixty of them, the same depth the station serves: a reading for a
      // name that has fallen out of /earlier can never be drawn against
      // anything.
      heard = heard.filter(r => r.t !== prevTitle);
      heard.unshift({ t: prevTitle, l: rollLikes, u: rollUp });
      heard = heard.slice(0, 60);
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(heard)); } catch {}
    }
    rollLikes = null; rollUp = false;
    prevTitle = t;
    pollEarlier();
  }


  // --- share the current song --------------------------------------------
  // Points at a Jellyfin search rather than a file: nothing is hotlinkable,
  // the recipient still authenticates, and it survives files being renamed.
  const JF = 'https://music.wildnloyal.org:1111/web/#/search.html?query=';

  // Titles are mostly "Artist - Album - Track" (filename-derived), so the
  // last segment is the actual song name and searches far better.
  // Mixxx substitutes $artist blindly, so an untagged track arrives as
  // "- Album - Track". Strip the orphaned separator rather than show it.
  function cleanTitle(t) {
    if (!t) return '';
    let s = String(t).trim();
    while (s.length && (s[0] === '-' || s[0] === '\u2013' || s[0] === '\u2014')) {
      s = s.slice(1).trim();
    }
    return s;
  }

  function songQuery(title) {
    if (!title) return '';
    const parts = title.split(' - ').map(s => s.trim()).filter(Boolean);
    return parts.length > 1 ? parts[parts.length - 1] : title;
  }

  function songLink(title) {
    const q = songQuery(title);
    return q ? JF + encodeURIComponent(q) : '';
  }

  function updateFind(title) {
    const row = document.getElementById('findrow');
    const a = document.getElementById('findLink');
    if (!row || !a) return;
    const url = songLink(title);
    if (url) { a.href = url; row.hidden = false; } else { row.hidden = true; }
  }

  const copyBtn = document.getElementById('copySong');
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    const url = songLink(lastTitle);
    if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.classList.add('done');
      setTimeout(() => copyBtn.classList.remove('done'), 1400);
    } catch {}
  });

  // What the narrator is saying. Liquidsoap writes the line to a static file
  // at the web root - this page is public and cannot use the /control
  // endpoints, which sit behind the speaker credential. It carries its own
  // timestamp so a line ages out here rather than needing anything to come
  // back and clear it: a stale "that was" parked under the volume slider all
  // evening would be worse than showing nothing.
  const NARRATOR_TTL = 45000;
  async function pollNarrator() {
    const el = $('narrator');
    try {
      const res = await fetch('/live/narrator.json', { cache: 'no-store' });
      if (!res.ok) return;
      const n = await res.json();
      const age = Date.now() - Date.parse(n.at);
      if (n.words && age >= 0 && age < NARRATOR_TTL) {
        el.textContent = '\uD83D\uDCE2 ' + n.words;
        el.hidden = false;
      } else {
        el.hidden = true;
      }
    } catch (e) { el.hidden = true; }
  }

  // --- likes -------------------------------------------------------------
  // Anyone listening can like. No login, no account, no identity: the count
  // is one number against one song. Liquidsoap keeps it against the FILE
  // PATH, because an untagged track has no title to key on, and hands back an
  // opaque id for that path instead of the path itself - which is all this
  // page needs to remember what it has already liked, and keeps the layout of
  // the library off the public internet.
  //
  // One like per browser per track, remembered in localStorage. It is
  // defeatable by anyone who cares to clear it, and that is fine - it is a
  // song, not a ballot.
  const LIKED_KEY = 'radio.liked';
  let liked = [];
  try { liked = JSON.parse(localStorage.getItem(LIKED_KEY) || '[]'); } catch { liked = []; }
  let likeId = '';
  // The count as the station last reported it for likeId, and the FIRST count
  // this page was given for the same track. Kept rather than only printed,
  // because the recents list needs the reading a song ended on - and by the time
  // a song is written into that list the endpoint is describing the next one -
  // and because the difference between the two is the only thing that says a
  // song was liked while this listener was in the room. likeFirst is null until
  // the station has named a track, so joining between songs cannot be mistaken
  // for a reading of nought.
  let likeCount = 0, likeFirst = null;

  // The count belongs to the song on the air, not to the station: it is the
  // number a listener can move, and it changes when the track does. The two
  // places that carry it, the heart there is to press and the figure in the
  // meta row, are written here from the same response, so a vote and a track
  // change move both at once and neither can be caught telling a different
  // story than the other. The response also carries a station-wide total of
  // every like ever given to anything, which this page no longer shows: beside
  // a number about this song it only muddied which of the two was which.
  //
  // One counter, and it is the heart. It was briefly written in two places at
  // once, which cannot disagree - both are set here from the same response -
  // but two copies of one number a hundred pixels apart is not reassurance,
  // it is a question about whether they might ever differ. The count belongs
  // on the thing you press to change it; the row below stays about the
  // station, which is a different subject.

  // Whoever is on the microphone, from the same response as everything else
  // here and for the reason the station gives for putting it there: a poll of
  // its own would disagree with this one for as long as a poll takes at the
  // one moment that matters, which is a host leaving the air.
  //
  // textContent, never innerHTML, and here that is not a habit - these three
  // strings were typed by one person and are being shown to everybody else.
  // It is the rule the guestbook and the chat already follow, and the station
  // caps the three lengths on its own side as well.
  //
  // A host who has typed nothing still gets the dot. That is the honest
  // reading of what the station said - somebody is live, and they chose to
  // say nothing about it - and it is the half of this that survives a
  // listener who reads no English at all.
  function showShow(sh) {
    const on = !!(sh && sh.live);
    $('showname').textContent  = on ? (sh.name  || '') : '';
    $('showtitle').textContent = on ? (sh.title || '') : '';
    $('shownote').textContent  = on ? (sh.note  || '') : '';
    $('showtitle').hidden = !$('showtitle').textContent;
    $('shownote').hidden  = !$('shownote').textContent;
    $('showwrap').hidden  = !on;
  }

  // A paused station is not playing the track it is showing, and for the
  // length of a bucket set that is every listener seeing a name for something
  // they cannot hear. The operator caught this one on the live page.
  //
  // The label loses its words rather than gaining different ones. Every
  // control on this page is wordless on purpose - the tug is two glyphs and a
  // row of dots - because it has to work for somebody who reads no English,
  // and swapping one English phrase for another English phrase would have
  // made this the one piece of state that only reads in one language. The
  // pause glyph is the same character the tug row uses for skip, from the
  // same block, and it needs no translation.
  //
  // The title itself is deliberately kept. It is still the track the station
  // is standing on and will resume, and showing nothing would lose that.
  // What this panel says is on, in one place, because it has exactly one
  // subject and used to have two.
  //
  // Three states, and the middle one is the one worth spelling out:
  //
  //   no show          the track, as it always was
  //   show, music on   the show, with the track beneath it in the weight the
  //                    page uses for context - a host talking over the
  //                    station is genuinely hearing both, so both are named
  //   show, paused     the show alone. The track is not audible, and a track
  //                    that cannot be heard has no place on a panel that says
  //                    what is on. That is the lie the pause glyph was added
  //                    to stop telling and it would be told again here.
  //
  // No word of ours appears in the live state. The dot carries it, as it did
  // in the header, and the words are the host's own.
  function showHold(j) {
    const held = !!(j && j.paused);
    const live = !!(j && j.show && j.show.live);
    $('npLabel').hidden = live;
    $('npLabel').textContent = held ? '\u23F8\uFE0F' : 'NOW PLAYING';
    $('np').classList.toggle('hold', held && !live);
    $('np').classList.toggle('under', live);
    // Hidden rather than emptied, so the panel closes up instead of leaving a
    // gap where a track used to be named.
    $('np').hidden = live && held;
  }

  // --- a record being changed ---------------------------------------------
  // /likes/now's id is a digest of the file playing, so a change in it IS a
  // track change and there is nothing else to ask. showLikes already keys the
  // heart off that value; this keys the record off the same one.
  //
  // Cleared in sleep() for the reason that block already gives about the
  // clock: a change this page did not witness is not one it may act out.
  // Without that, pressing play after an hour away would open with a change of
  // record for one that went half an album ago.
  //
  // Reduced motion is refused HERE rather than left to the blanket rule at the
  // foot of the sheet, and the reason has changed with the mechanism. It used to
  // be a hazard: the carriage took itself out on its own animationend, so taking
  // the animation away left a copy of the outgoing record sitting over the real
  // one for good. The carriage is now driven by the Web Animations API, which
  // that rule cannot reach, and a plain timer ends the change whether anything
  // is drawn or not - so the hazard is gone and what is left is the preference,
  // which is honoured on its own account. The TIMING is not refused, only the
  // motion: a listener who wants no animation still gets a page that waits for
  // their ear rather than running ahead of it.
  let shownId = '';
  const stillness = matchMedia('(prefers-reduced-motion: reduce)');

  // One travel of the window, at the speed a record is carried, and one seat -
  // the drop onto the pin, at a seventh of that speed because it is aiming
  // rather than carrying. The sheet has the argument for both numbers. Two
  // travels and two seats are the floor for a change and one of each is the
  // floor for an arrival; everything above that is the deck standing empty.
  const TRAVEL = 420, SEAT = 240;
  // How long a change of record is DRAWN for when it is not covering a wait,
  // which since aiming is every change but the tug's. A track ending is seen
  // coming rather than reacted to - aimChange has the arithmetic - so the music
  // never stops, there is no silence to fill, and the length is free to be
  // whatever reads best instead of being whatever the ear is behind by.
  //
  // 660ms, which is TRAVEL + SEAT: the whole of the move, and nothing left over.
  // It was 2400 while a change was five parts - lift, carry out, stand empty,
  // carry in, seat - and 1920 of that was there to hold an empty deck open long
  // enough to be read as one. There is no empty deck in a change any more, so
  // there is nothing to hold open: the record crosses the window at 267px/s,
  // the speed this file has on record as the speed a record is carried at, and
  // is set down. Anything longer would be the same move drawn slower for no
  // reason, which is what 2400 became the moment the middle came out.
  //
  // record_min is still a floor under it and is read from the station, so a
  // desk that wants a longer minimum gets one - and at the 1.2s this station
  // sets it is what actually binds, stretching the travel and leaving the seat
  // alone. Nothing here is a ceiling: a change that is covering a wait - the
  // tug, or a page that found out late - is timed by that wait and not by this.
  const CHANGE_NATURAL = 660;
  // How near two boundaries have to be before they are taken for one, which is
  // what stops a prediction and the truth behind it from being acted out twice.
  // It was written as twice the length a change is drawn for, and that was a
  // convenience rather than an argument: the two have nothing to do with each
  // other, and the slide-over would have shrunk this from 4800ms to 2400
  // without anyone deciding to. So it is the 4800 that was in force, written
  // down. What sets it is how wrong a duration can be - a variable bitrate
  // file's claim about its own length - and the ceiling is the shortest gap
  // between two real boundaries, which is far longer than this.
  const SERVED_SAME = 4800;
  // How far out of the window a parked record stands, as a percentage of its
  // own width. It is not a taste: the window is the button, a circle of the
  // record's own diameter, and the paper label is .42 of that diameter, so a
  // record whose centre has gone half a width plus a label radius out has its
  // label exactly tangent to the window with no part of the paper - and so no
  // part of the symbol printed on it - inside. 50 + 42/2 = 71, out of two
  // fractions the record is already built from and not out of a preference.
  //
  // Under it the label is cut by the window's edge rather than gone, which
  // reads as a record with a bite out of it - the same fault this file lost a
  // round to on the spindle hole. Over it the record is a sliver and stops
  // being an object standing to one side.
  //
  // Both halves of that were read off a sixteen-times raster of the parked
  // button rather than trusted to the arithmetic, because a box model is no use
  // for either of them: the disc's own rect is the bounding box of a ROTATED
  // square and the cue's is a box a third wider than the triangle in it - it was
  // a glyph's advance when this was measured and it is padding now, and neither
  // is ink. The disc's centre
  // parks at -23.520px, so its face - a circle of the button's own diameter -
  // stops 32.48px into a 112px window; the cue's ink begins at 45.50px, which
  // is 13.02px further in; and the paper, whose centre is the same -23.520px,
  // leaves nine subpixels of antialiased red at the window's edge and nothing
  // else. So the parked state is a record BESIDE a triangle and never a record
  // across one, and the label is out rather than nearly out.
  const PARK = 71;
  // How far above the platter a record is carried, read off the sheet rather
  // than repeated here so that --seat is the one place it is written. It is a
  // custom property and getPropertyValue returns its raw tokens, so it is set as
  // a plain length for exactly this reason - a calc() would come back unresolved
  // and parseFloat would take the first number out of it and be wrong.
  const LIFT = parseFloat(getComputedStyle(document.documentElement)
                            .getPropertyValue('--seat')) || 9.22;
  // icecast's burst-size in BYTES, from the station's own config. A player that
  // joins is handed this much at once, so the oldest byte it holds - the one it
  // starts playing - is this many bytes old, and at a constant bitrate that is a
  // number of seconds: 65536 bytes at 128kbps CBR is 4.096s. The bitrate is NOT
  // written here: icecast publishes it on /status-json.xsl and poll() below
  // reads it, so a station re-encoded at 96 or 192 moves this figure by itself.
  //
  // That a browser really does start from the OLDEST byte, rather than throwing
  // the burst away and joining live, was measured rather than assumed - and it
  // had to be, because the element's readyState and its buffered range both
  // suggest the opposite: nothing at all is exposed for the first four seconds
  // and then playback begins with barely half a second in hand. A stream of
  // known content was built for the question, 25s of digital silence followed by
  // 25s of a tone, encoded at 128kbps CBR and pushed at exactly 128kbps behind a
  // 65536 byte burst; the page's own audio element was tapped with an
  // AnalyserNode and the wall clock of the tone's onset in the ear was compared
  // with the wall clock it left the server at. The ear was 9.155s behind, on
  // loopback, on the machine serving it. Burst plus the 4.262s that run took to
  // reach `playing` is 8.358s, so the model below is right in its shape and
  // about 0.8s short in its size, and it is short in the direction that lands
  // the record slightly before the music rather than after it.
  //
  // AND IT DOES NOT DECAY, which is the question that had not been asked. Both
  // of the numbers above are things that happen ONCE, at the connection: a
  // burst handed over on joining, and a buffer filled from cold. That they are
  // also the STEADY lag - what a listener is behind by ten minutes later - is a
  // separate claim, and if it were false every aimed change would fire late by
  // the difference. So the same stream was rebuilt as a repeating one, 20s of
  // silence and 4s of tone every 24.085s, and the onset was taken 22 times over
  // eight and a half minutes of continuous play:
  //
  //   9.166s at the first tone, 9.182s at the twenty-second, and never outside
  //   9.154 to 9.199 in between.
  //
  // Flat to forty milliseconds over eight minutes. A plain element joins with
  // the burst and then plays at real time against a stream arriving at real
  // time, so it never catches any of it up - the startup cost IS the steady
  // lag, and a stall does not recover either, which is why fillMs adds one
  // rather than replacing the figure. The estimate is therefore right in shape,
  // does not need to decay with time, and is short by the same ~0.8s it was
  // short by cold.
  const BURST = 65536;
  // air_delay used to be got at by subtracting 5.0 from /likes/now's `cool`,
  // because tug_cool was written `5.0 + air_delay()` in radio.liq and that was
  // the only way it reached a page with no password. It arrives on its own now,
  // and the subtraction is gone rather than kept as a fallback: it was a
  // coincidence of two unrelated numbers being written as one sum, the station
  // is free to change that sum, and a page still doing the arithmetic would go
  // on producing a plausible figure long after it stopped being air_delay.
  //
  // The ceiling on a change of record, and it is set by the parts rather than
  // picked: air_delay plus the burst plus the largest buffer reading this page
  // will believe is 1.75 + 4.096 + 10 seconds, so fifteen is just under
  // everything the sum can produce and binds only when all three are at their
  // worst at once. Beyond that a change of record stops being a mechanism and
  // becomes a fault, and the honest thing on a link that bad is a change that
  // ends before the song does.
  const CHANGE_MAX = 15000;
  // The buffer reading on its own, clamped before it is used. Anything under a
  // tenth of a second is a cached start rather than a measurement of this link.
  // Ten seconds is over twice the 4.4s measured from the machine that serves the
  // stream, and past it the reading has stopped describing a buffer being filled
  // and started describing a stream that is not arriving.
  const FILL_MIN = 100, FILL_MAX = 10000;
  // A held title nothing claimed. pollLikes is asked outright the moment one is
  // held, so the ordinary claim is a single round trip; three seconds is far
  // past any answer this station gives and still inside the five-second poll the
  // title would otherwise have waited for.
  const CLAIM = 3000;
  // A mute taken for a skip that never became a track change. The station is
  // asked outright the moment the counter tops out, so the ordinary wait is one
  // round trip and this never fires; six seconds is past any answer this station
  // gives and is the point at which silence has stopped being the mechanism
  // working and started being the mechanism stuck. Once a change HAS begun the
  // change's own deadline takes over and this stops applying.
  //
  // TEN SECONDS, AND IT WAS SIX. What this has to outlast is not a change - a
  // change owns the mute the moment it is booked - it is the gap between the
  // counter topping out and this page LEARNING what replaced the song, which is
  // one round trip in the ordinary case and was measured at 4.0s once, when the
  // catch-up polls straddled the skip. Six left two seconds between the two.
  //
  // The two failures are not the same size. Firing early puts the old song back
  // out for the second before the record lands, which is precisely the overlap
  // the whole skip was built to remove, and it happens whenever a poll is slow.
  // Firing late leaves a listener silent a few seconds longer in the rare case
  // where the station genuinely never names a replacement - and the record is
  // visibly being changed on screen throughout, so the silence has something
  // saying why. Ten is past the worst answer this station has been seen to give
  // by more than twice the margin six had.
  const MUTE_MAX = 10000;

  let airS = 0;           // /likes/now's air_delay, seconds the station holds back
  let recordMinMs = 0;    // /likes/now's record_min, the station's floor in ms
  let streamKbps = 128;   // icecast's own audio_info, until poll() says otherwise
  let fillMs = 0;         // measured on THIS connection, 0 until it has been
  let fillFrom = 0;       // when this browser started filling, 0 when it is not
  let fillCold = false;   // true for the fill that starts a connection
  // The change in progress: when the new record lands, what is drawing it, and
  // what the page has been told but is not showing yet.
  let changeUntil = 0, changeCar = null, changeAnim = null, changeTimer = 0;
  let changeArriving = false;
  // Where in a booked arrival the last carry-and-seat begins, so the `playing`
  // event can jump to it. Worked out where the arrival is booked rather than in
  // the handler, because a record returning from the park has PARK per cent of
  // a window to cross and one arriving from off the window has a whole one.
  let arriveSeat = 0;
  // A record lifted off the pin and standing beside the deck. Not the same fact
  // as an empty deck and not drawn like one: there IS a record, this session
  // put it there, and pressing play brings that one back rather than fetching a
  // first one.
  let parked = false;
  let heldTitle = null, heldSince = 0, heldTrack = null;
  // When this page silenced itself for a skip it saw land, 0 when it has not,
  // and the track it did it for. The id is what stops a station that has taken
  // a skip and not acted on it from being answered with a silence every six
  // seconds for the rest of the song: one song tops out once, the insurance
  // below gives the sound back, and this refuses to take it away again for the
  // same song. It cleans itself up, because the next id is a different one.
  let mutedAt = 0, mutedId = '';
  // A change of record booked for a moment that has not arrived yet. aimAt is
  // the instant this ear reaches the boundary and the seat is to complete on;
  // aimTold says the instant came from the station's own change of id rather
  // than from the duration, which is the difference between a fact and an
  // estimate; servedAim is the aimAt of the last change that finished, and it
  // is what stops one boundary being acted out twice when a prediction fires
  // and the truth arrives a moment behind it.
  let aimTimer = 0, aimAt = 0, aimTold = false, servedAim = 0;

  // "The ear has not caught up yet, so nothing new goes on screen." It was
  // changeUntil alone until the skip was silenced, and a skip opens a gap the
  // change has not begun in: the answer to the twelfth click reports the OLD
  // track, so this page knows the song is over several hundred milliseconds
  // before it is told what replaced it. Everything the change holds back - the
  // title, the clock, the tug - has to be held back over that gap too, or the
  // new title goes up while the deck is still full and the whole order the
  // change exists to keep is broken by the one event it matters most for.
  //
  // aimTold is the third, and it is the interval this round opened. The station
  // changes track about ten seconds before that track reaches an ear, and the
  // change of record is now aimed at the ear rather than started at the
  // station - so between being TOLD the boundary and drawing it there is a
  // stretch with no carriage on the button and a new title already fetched.
  // Without this the insurance in tick() would let that title go up after three
  // seconds, seven seconds early, which is the exact fault the whole mechanism
  // exists to prevent. A booking made from the DURATION does not count: nothing
  // has changed at the station yet, so there is nothing being held back.
  function waiting() { return changeUntil > 0 || mutedAt > 0 || aimTold; }

  // Sound comes back, and the listener's own volume comes back with it, which is
  // the whole reason this is `muted` and not the volume being wound down.
  //
  // Unconditional rather than guarded on mutedAt, and idempotent, because there
  // is no failure here worth protecting against and there is a bad one worth
  // ruling out. A muted element that nothing on the page believes it muted is a
  // radio that is silently off with nothing on screen to say why - the worst
  // thing this mechanism could leave behind - so every path that could reach
  // that state calls this and none of them has to be sure it was needed.
  //
  // It gives the sound back to `userMuted` and not to false, which is the one
  // asymmetry in this: the tug silences and the listener un-silences. A radio
  // that came back on by itself because a track was voted off would be the
  // same fault as the one above wearing the opposite sign, and this time there
  // WOULD be something on screen saying why - the switch, still down, being
  // contradicted by the sound.
  function unmute() { mutedAt = 0; audio.muted = userMuted; }
  // What an arrival is booked for before this connection has ever been measured.
  // Only the first press of a cold page uses it, and only until the playing
  // event says how wrong it was. 4400 is the median of five cold starts against
  // this station from a browser on the machine that serves it - 4360, 4433,
  // 4496, 4601, 4366 ms from the press to the first sound - which is the fastest
  // a listener can possibly be, so a real one is more likely to be over this
  // than under it. It is startlingly large for a loopback connection and it is
  // not the network: the element sits at readyState 0 with nothing buffered for
  // four seconds while data arrives every 360ms, and then goes from
  // loadedmetadata to playing in twenty milliseconds.
  const FILL_GUESS = 4400;

  // --- how long the ear is behind the page --------------------------------
  // Two halves, and only one of them can be worked out from the station.
  //
  // The station's half is arithmetic and is the same for everybody: air_delay,
  // which is the station holding the sound back so the narrator can be cut in,
  // plus icecast's burst, which is the several seconds of already-played audio a
  // joining player is handed in one go and then starts playing from the oldest
  // end of. Both are read live, one off /likes/now and one off /status-json.xsl.
  //
  // The listener's half cannot be worked out at all and does not have to be,
  // because the page is RUNNING on the listener's machine and that machine knows
  // how long it took to fill its own buffer. That is what fillMs is, and what it
  // honestly measures is stated where it is measured: it is the time this
  // browser needed to gather enough audio to make a sound, on this connection,
  // just now. It is a real component of the lag rather than a proxy for it, so
  // it is ADDED to the station's half rather than replacing it, and until there
  // is one the station's half stands alone. The two halves are about equal on
  // the fastest connection there is - 5.846s of station against 4.4s of browser
  // - and it is the browser's half that varies from listener to listener, which
  // is the whole reason it is measured rather than assumed.
  //
  // What this deliberately does NOT do is read the audio element's own buffered
  // range. `buffered.end(0) - currentTime` was used to steer the host console's
  // monitor and it read a flat 2.30s for ninety seconds while the true lag went
  // from 8.4s to 4.9s: a plain element reports a window around the playhead, not
  // everything it is holding, and the only way that console ever got a true
  // figure was by owning the buffer through MediaSource. This page plays /stream
  // through an ordinary element and must not repeat that mistake.
  function earLagMs() {
    return (airS + BURST * 8 / (streamKbps * 1000)) * 1000 + fillMs;
  }

  // The one honest reading a plain audio element gives: from asking it to play,
  // or from it running dry mid-stream, to it making a sound again. That is this
  // browser filling its buffer over this connection - network, decode and the
  // element's own idea of how much is enough, all three of which are exactly the
  // part of the lag the station cannot know. It is NOT the whole lag and is not
  // treated as it: the burst above is the other half of it and is invisible from
  // here. Kept in a variable and never stored, because it is a property of this
  // connection at this moment and a number measured on a train last week would
  // be worse than no number at all.
  //
  // A cold start and a stall are the same measurement and are not the same
  // arithmetic. The cold start IS the whole of this browser's contribution, so
  // it replaces the figure. A stall mid-stream does not restart anything: the
  // stream resumes where it left off, so the ear falls further behind by exactly
  // the length of the stall and the right thing to do with the reading is add
  // it. That is the difference fillCold carries, and it is the reason the
  // `waiting` below never resets the clock it finds already running - the first
  // thing a fresh <audio> does is fire `waiting`, and treating that as a stall
  // would throw away the cold start it is the beginning of.
  audio.addEventListener('waiting', () => { if (!fillFrom) fillFrom = Date.now(); });
  audio.addEventListener('playing', () => {
    if (fillFrom) {
      const ms = Date.now() - fillFrom;
      fillFrom = 0;
      if (ms >= FILL_MIN) {
        fillMs = Math.min(FILL_MAX, fillCold ? ms : fillMs + ms);
      }
      fillCold = false;
    }
    // A record arriving was booked against a guess at this moment, and this
    // moment is the answer. Sound has started, so the arrival finishes now
    // rather than at the length it was booked for. It is seeked to the START of
    // the carry rather than to the end: a record that snaps into place has not
    // been put there by anybody, and a travel and a seat is what it costs to be
    // put there. What is thrown away is only the waiting - the stretch where the
    // record sits off to the right with nothing happening - which is exactly the
    // part that was a guess. If the booking was too short the record is already
    // down and there is nothing to correct: a record on the platter waiting for
    // sound is a state this button has always had and still draws.
    if (!changeArriving) return;
    if (!changeAnim) return endChange(true);
    if (changeAnim.currentTime < arriveSeat) changeAnim.currentTime = arriveSeat;
  });

  // Everything the page was told while the record was being changed, put on
  // screen now that the ear has caught up with it. The title and the clock land
  // together and they land with the record, which is the whole order the change
  // exists to keep. The clock is applied with the timestamp it was READ at, not
  // this one, so it goes on telling the station's time rather than restarting.
  function settle() {
    if (heldTitle !== null) { const t = heldTitle; heldTitle = null; showTitle(t); }
    // And if nothing was held, the panel still has to come back from whatever
    // dash it is showing. This is the line the tug was missing: a release that
    // has no new title to land is still a release, and it owes the listener the
    // name of the song that is playing.
    else unblank();
    if (heldTrack) {
      trackElapsed = heldTrack.e; trackTotal = heldTrack.d; trackAt = heldTrack.at;
      heldTrack = null;
    }
    tick();
  }

  // landed says whether the record got where it was going. An arrival that did
  // is the one thing that takes the deck out of its opening state, and an
  // arrival that did not - the listener pressed play and pressed it again, or
  // the stream never came - leaves the deck exactly as empty as it found it,
  // which is the truth about what happened.
  function endChange(landed) {
    // What the move WAS, read before the classes that say so are taken off
    // below. A park and a return move the same record; a change and an arrival
    // bring a new one.
    const parkish = parked || btn.classList.contains('parked');
    // Anything still booked goes with it, and a booking that got as far as
    // being DRAWN is remembered rather than forgotten: servedAim is what tells
    // a second booking for the same boundary that the record is already on.
    // Only a landed change serves a boundary - one that was superseded drew
    // nothing that finished - and only an aimed one has a boundary to serve.
    if (aimTimer) { clearTimeout(aimTimer); aimTimer = 0; }
    if (landed && aimAt) servedAim = aimAt;
    aimAt = 0; aimTold = false;
    if (changeTimer) { clearTimeout(changeTimer); changeTimer = 0; }
    if (changeAnim) { changeAnim.onfinish = null; changeAnim.cancel(); changeAnim = null; }
    if (changeCar) { changeCar.remove(); changeCar = null; }
    // Including the park. Everything this function takes off the button is a
    // carriage, and a parked record is one that stopped - so ending it is the
    // record going back on the pin, which is exactly what a return begins by
    // doing before it draws the same record travelling in.
    btn.classList.remove('shoving', 'arriving', 'parked', 'away');
    parked = false;
    if (landed && changeArriving) btn.classList.remove('empty');
    changeArriving = false;
    changeUntil = 0;
    // Sound comes back with the record, and only for a change that finished.
    // beginChange starts by ending the change it is replacing and ends it as NOT
    // landed, so an unmute written unconditionally here would let the old song
    // back out for one poll every time a change was superseded.
    // The record that lands is a new one, so the disc it becomes starts its
    // revolution where the copy left off - which is nought, because that is
    // where the copy started and it was frozen for the whole travel. Without
    // this the label would jump from upright to wherever the outgoing record
    // had stopped, in the one frame a listener is looking straight at it.
    //
    // Only for a change or an arrival. A park and a return are the SAME record
    // going off the pin and coming back, and snapping that one upright would
    // be the fault the spin has been protected from since it was written: a
    // record does not lose its place because somebody paused it.
    if (landed && !parkish) {
      const sp = btn.querySelector('.lp-disc').getAnimations()[0];
      if (sp) sp.currentTime = 0;
    }
    if (landed) unmute();
    settle();
  }

  // The copy, the angle it inherits, and the travel over it. Four moves are
  // built here and they are one mechanism seen from four sides: a change (a
  // record in over the one that is on), an arrival (the same, over an empty
  // deck), a park (a record taken off and stood beside it) and a return (that
  // one coming back).
  //
  // ONE COPY, in every one of the four. A change used to build two, because it
  // took a record off and put another on and both had to move; it slides the
  // new one over the old one now, the old one does not move, and a record that
  // does not move does not need a copy of itself to move it with. What plays
  // the outgoing record instead is the real disc, left visible by the sheet for
  // this one mode - so the end of a change is a carriage being taken off an
  // element that was never touched, at the angle it was already at, and there
  // is no handover to get wrong.
  //
  // A missing spin is no longer a refusal. It used to be - reduced motion takes
  // the disc's animation away and there was then no angle to inherit - but the
  // park has to be drawn for those listeners too, and an unrotated copy over an
  // unrotated record is not a mismatch, it is the same upright record. So the
  // angle is copied when there is one and the carriage is built either way.
  function carry(total, mode) {
    const disc = btn.querySelector('.lp-disc');
    if (!disc) return false;
    const spin = disc.getAnimations()[0];
    const car = document.createElement('span');
    // `arriving` on the CARRIAGE - a different thing from the button class of
    // the same name - is what stands its copy off the right of the window, and
    // it is now on both of the moves that bring a record in.
    car.className = 'lp-shove' +
                    (mode === 'arrive' || mode === 'change' ? ' arriving' : '');
    car.setAttribute('aria-hidden', 'true');
    // The copy carries the pause bars, in every one of the four moves, and that
    // is the whole rule: the symbol printed on a record does not change while it
    // is a record on this deck. It arrives with the bars, turns with them, is
    // parked with them and leaves with them. Nothing has to be swapped at the
    // instant the music starts or at the instant it stops, and there is never a
    // moment where a listener is asked to compare two symbols - the play
    // affordance is the deck's own cue, printed on the platter, and the park is
    // what uncovers it.
    //
    // It used to copy whatever the disc had, which on an arrival is nothing:
    // the press clears the symbol to say connecting, so a record travelled in
    // blank and had a symbol appear on it after it landed.
    const d = car.appendChild(document.createElement('span')); d.className = 'lp-disc';
    const lab = d.appendChild(document.createElement('span')); lab.className = 'lp-label';
    const sy = lab.appendChild(document.createElement('span')); sy.className = 'lp-sym bars';
    sy.textContent = GLYPH_PAUSE;
    lab.appendChild(document.createElement('span')).className = 'lp-hole';
    btn.insertBefore(car, btn.querySelector('.lp-glint'));
    btn.classList.add('shoving');
    // The two moves that leave the deck bare, so the sheet can uncover the well
    // and hide the real disc for them and for nothing else. A change is not one
    // of them any more, which is the whole of the slide-over in one class.
    if (mode === 'park' || mode === 'return') btn.classList.add('away');
    // The copy is put at the angle the record is at instead of starting upright,
    // and `shoving` has just stopped both of them there. For a change that
    // matters twice over: the record still sounding is frozen mid-turn at the
    // angle the incoming one is carried at, so the two agree while one crosses
    // the other, and the real one is unpaused - never restarted - at the
    // landing. Each of these elements carries exactly one animation and it is
    // spin.
    // UPRIGHT, at nought degrees, because the copy is always the record
    // ARRIVING and a record arriving has not been played yet. It used to be
    // put at the angle of the one already turning, which is the right answer
    // for the disc being covered - that one is mid-song and stays where it is
    // - and the wrong answer for a fresh pressing carried in over it.
    //
    // Nought is also what the real disc is set to when it takes over at the
    // landing, below, so the record a listener watches come down and the record
    // that starts turning are at the same angle and there is no jump between
    // them. Set explicitly rather than left alone: the element is built by
    // cloning one that is part-way through the spin, so its animation arrives
    // carrying that phase.
    const a = d.getAnimations()[0];
    if (a) a.currentTime = 0;
    changeCar = car;
    // In, and down. That is the whole of a change now, and of an arrival, and
    // they share these keyframes because they are the same move over different
    // ground: the record starts a window clear of the right edge, crosses, and
    // is lowered onto the pin.
    //
    // The Y of every keyframe but the last is -LIFT and that is not decoration.
    // It is what makes the last frame a record being PUT somewhere rather than
    // a record sliding to a stop: it is carried above the platter and set down
    // on it. px rather than a percentage, because the lift is a property of the
    // SPINDLE and not of the record - it is twice the hole, which is what the
    // pin has to clear - and neither of those two scales with the disc.
    const at = (x, up) => 'translate(' + x + ', ' + (up ? -LIFT : 0) + 'px)';
    const s = SEAT / total, p = '-' + PARK + '%';
    // THE RECORD MOVES FROM THE FIRST FRAME, and the travel is stretched over
    // whatever the total is rather than taking a fixed 420ms of it.
    //
    // It used to wait off-screen for all but the last 660ms and then hurry in,
    // which is the same total and reads as a delay with an animation on the end
    // rather than as a record being put on. Now the slower the connection, the
    // slower the record comes in, which is the operator's own framing of it as
    // a speed test you can watch. A change that is covering a wait - the tug,
    // whose whole silence has to be filled - is drawn by the same rule, and one
    // that is aimed at a boundary simply has a short total to stretch over.
    //
    // Only the seat keeps a fixed length. It is the one part that is a physical
    // event rather than a wait: a record dropping the last two hole-widths onto
    // a pin takes as long as it takes, and stretching THAT over a slow
    // connection would make it hang in the air.
    //
    // The park and the return are the same list cut in half and reversed. A
    // park is a lift then a carry, stopped at PARK instead of running the
    // record out of the window; a return is that carry backwards and then the
    // seat. So a record leaves and comes back along one line, at one speed, and
    // the pin is uncovered for the whole of the time it is away.
    changeAnim = car.animate(
      mode === 'park' ? [
        { transform: at('0', 0), offset: 0 },
        { transform: at('0', 1), offset: s },
        { transform: at(p,   1), offset: 1 },
      ] : mode === 'return' ? [
        { transform: at(p,   1), offset: 0 },
        { transform: at('0', 1), offset: 1 - s },
        { transform: at('0', 0), offset: 1 },
      ] : [
        { transform: at('-100%', 1), offset: 0 },
        { transform: at('-200%', 1), offset: 1 - s },
        { transform: at('-200%', 0), offset: 1 },
      ], { duration: total, easing: 'linear', fill: 'forwards' });
    // A park is the one move here that does not end. The record stays where it
    // was put until somebody presses play, which is the whole of what a parked
    // record is, so there is nothing to clear away and nothing to land.
    if (mode !== 'park') changeAnim.onfinish = () => endChange(true);
    return true;
  }

  // Draw the change, now, over `want` milliseconds. `end` is the boundary it is
  // being drawn for, kept only so that endChange can remember which boundary
  // has been served; it is 0 for a change that is not aimed at one.
  function beginChange(want, end) {
    // A second change inside the first replaces it outright. Queueing would
    // spend the whole of one gap pushing off a record that is already two
    // behind, and would land the wrong title at the end of it.
    endChange(false);
    // TRAVEL + SEAT, where a change used to need two of each. It is the same
    // floor an arrival has, because since the slide-over it is the same move:
    // one record crossing the window and being set down. record_min, the
    // station's own floor off the desk, still sits above it.
    const total = Math.min(CHANGE_MAX, Math.max(TRAVEL + SEAT, recordMinMs, want));
    aimAt = end || 0;
    changeUntil = Date.now() + total;
    if (stillness.matches || !carry(total, 'change')) {
      changeTimer = setTimeout(() => endChange(true), total);
    }
    drawTug();
  }

  // How long a change is drawn for when it is not covering anything. The
  // station's own floor sits under it and is read live, so a desk that raises
  // record_min raises this with it.
  function changeMs() { return Math.max(CHANGE_NATURAL, recordMinMs); }

  // --- aiming a change of record at a boundary -----------------------------
  //
  // `end` is the wall clock at which THIS EAR reaches the end of the track it
  // is hearing, and the seat is to complete on it: the record is pressed down
  // onto the pin as the first sound of the next track arrives, and the title
  // and the clock land with it. Not when the page finds out - when the listener
  // gets there.
  //
  // It arrives two ways and they are not equal. The DURATION gives it before
  // anything has happened - the station has (duration - elapsed) left to play
  // and this ear is earLagMs() behind, so the boundary is arithmetic off two
  // numbers /likes/now already carries - and that is an estimate, because a
  // duration is a file's claim about itself and a variable bitrate file's claim
  // is approximate. The station's own change of id gives it exactly, and gives
  // it about ten seconds before the ear gets there, which is ample. So the
  // estimate books and the truth re-aims, a guess never overwrites a booking
  // made from the truth, and `told` is which of the two this is.
  //
  // Re-aimed on every poll rather than booked once. elapsed arrives every five
  // seconds and the estimate is better the nearer the boundary is, so a booking
  // made half a track early would drift; each poll clears the last timer and
  // sets a new one off a fresher reading.
  //
  // Three refusals, and each is a case that would otherwise draw the wrong
  // thing:
  //
  //   a change already on the button is already being drawn for this boundary,
  //   and a record that jumped back onto the deck to be taken off again would
  //   be the page arguing with itself;
  //
  //   a boundary this page has already SERVED is not served again - a
  //   prediction that fired a moment early is followed by the id change that
  //   proves it early, and without this the same track change would be acted
  //   out twice. Within SERVED_SAME of each other counts as the same boundary,
  //   which is far under the gap between two tracks and far over any error a
  //   duration has been seen to have;
  //
  //   and the tug never comes here at all. A skip voted through is a reaction
  //   to something that has already happened, it cuts the song off rather than
  //   letting it end, and it is drawn the way it always was - see showRecord.
  //
  // Nothing is booked on a page that is not listening. The one round of polls a
  // page does at load would otherwise leave a timer standing that fires minutes
  // later and changes the record on a turntable nobody has pressed.
  function aimChange(end, told) {
    if (quiet) return;
    if (changeUntil || mutedAt) { if (told) aimTold = true; return; }
    if (aimTold && !told) return;
    if (servedAim && Math.abs(end - servedAim) < SERVED_SAME) return;
    const now = Date.now(), total = changeMs();
    if (aimTimer) { clearTimeout(aimTimer); aimTimer = 0; }
    aimAt = end; aimTold = told;
    // Not enough of the wait left to draw the change inside it, so it is drawn
    // now and runs to the boundary instead of to a chosen length. That is a
    // page that found out late - a poll that did not answer, a tab that was
    // throttled - and stretching the change to cover what is left of the wait
    // is exactly what this mechanism used to do for every change.
    if (end - now <= total) beginChange(end - now, end);
    else aimTimer = setTimeout(() => { aimTimer = 0; beginChange(total, end); },
                               end - total - now);
  }

  // The boundary as the DURATION sees it, off the reading that has just come
  // in. Nothing is booked when the station does not say how long the track is -
  // a live show has no duration and neither does a voice note - and the id
  // change below still aims those, just later and with less warning.
  function aimNatural(j) {
    if (!j || typeof j.duration !== 'number' || typeof j.elapsed !== 'number') return;
    if (!(j.duration > j.elapsed)) return;
    aimChange(Date.now() + (j.duration - j.elapsed) * 1000 + earLagMs(), false);
  }

  // The first press of a session, and the arrival half of the same mechanism
  // with nothing leaving. The deck opens empty - see the well in the sheet - and
  // this is the record being put on it.
  //
  // What it covers is a DIFFERENT wait from the one a skip covers, and the
  // arithmetic says so. A listener who has just pressed play is not behind the
  // station at all, because they are not hearing anything: air_delay and the
  // burst decide how OLD the first sound will be, not how long it takes to
  // arrive. What they are waiting through is their own browser filling its
  // buffer, start to finish, which is the whole of fillMs and nothing else. So
  // this is the one place that number stands alone rather than being added to
  // the station's half.
  //
  // On the very first press of a cold page there is no measurement yet, which is
  // the one moment this cannot be right; FILL_GUESS stands in and the playing
  // event corrects it in whichever direction it was wrong.
  //
  // Two floors under that, and they are floors of different kinds. TRAVEL + SEAT
  // is mechanical: it is what the drawing costs, and nothing can be drawn in
  // less. record_min is the station's, set on the desk, and it is there because a
  // fast connection produces a true measurement that is too SHORT to see - a
  // record change that completes in two hundred milliseconds is a flicker rather
  // than a record being changed. Neither is a target and neither can make a
  // change shorter than the wait it is covering; they only stop a short wait
  // being drawn as nothing at all.
  //
  // The deck is lit here rather than in carry(), because carry() is the one part
  // of this that a listener may not get: reduced motion refuses the travel, and
  // a press that draws nothing is what this whole state exists to stop. The
  // park is the one move that is drawn anyway - its own paragraph says why.
  //
  // Two arrivals rather than one, and the second is a record that never left
  // the window. A parked record has PARK per cent of a window to come back
  // across where a fresh one has a whole one, so the mechanical floor under it
  // is smaller by exactly the part of the travel it does not have to make.
  // Nothing else about the two differs, because the wait they cover is the same
  // wait: this browser filling its buffer, whichever record is being put on.
  function beginArrival(mode) {
    endChange(false);
    const carryMs = mode === 'return' ? TRAVEL * PARK / 100 : TRAVEL;
    const total = Math.min(CHANGE_MAX,
                           Math.max(carryMs + SEAT, recordMinMs, fillMs || FILL_GUESS));
    changeUntil = Date.now() + total;
    changeArriving = true;
    arriveSeat = total - carryMs - SEAT;
    btn.classList.add('arriving');
    if (stillness.matches || !carry(total, mode)) {
      changeTimer = setTimeout(() => endChange(true), total);
    }
    drawTug();
  }

  // The record coming OFF the pin, and the one move on this button that covers
  // no wait at all. The music has already stopped - it stops on the press, as
  // it always did - so this is drawn at the speed a hand works at and at no
  // other: 240ms to lift, then PARK per cent of a window at the speed records
  // are carried at, which is 538ms and is the same 538ms the return has as its
  // floor. Neither is stretched to anything, because there is nothing to
  // stretch to.
  //
  // Nothing about the record itself changes. It keeps its angle - the copy is
  // handed the phase exactly as every other copy is, and the real disc under it
  // is only ever unpaused, never restarted - it keeps its red, and it keeps the
  // pause bars printed on it. What changes is that it is no longer on the pin,
  // and what a listener presses next is the deck's own play cue, which the
  // record uncovers on its way out. One symbol on screen at a time, and the two
  // are never compared because they are never both in the window.
  //
  // The deck does not go back to `empty`. A parked record is a record this
  // session has already put on, and the opening state - a turntable nobody has
  // pressed - is not a state playback returns to.
  //
  // DRAWN EVEN WHEN MOTION IS REFUSED, which is what makes this different from
  // every other move here. The others end with the record on the pin, which is
  // where it already is if nothing was drawn, so refusing them costs a listener
  // only the travel. This one ends with the record somewhere else, and refusing
  // it would leave that listener a record on the pin carrying the pause bars
  // and not turning - which under reduced motion is precisely what PLAYING
  // looks like, because nothing turns there either. So the carriage is built
  // either way and only the travel is refused: finish() puts it where the
  // travel would have left it, in one frame, with no motion to see.
  function park() {
    if (parked) return;
    // A press taken back before the record was down. The arrival is abandoned
    // rather than parked, and if it was the first press of the session there is
    // nothing to park: the deck goes back to empty, because that is what
    // happened.
    if (changeArriving) {
      endChange(false);
      if (btn.classList.contains('empty')) return;
    }
    if (!carry(SEAT + TRAVEL * PARK / 100, 'park')) return;
    parked = true;
    btn.classList.add('parked');
    if (stillness.matches) changeAnim.finish();
  }

  function showRecord(id, elapsed) {
    const was = shownId;
    shownId = id;
    // Not a change this page witnessed, so nothing to act out - but anything
    // being held for a change is released here rather than waiting out CLAIM,
    // which is what makes the first title after a resume appear at once.
    if (!id || !was || id === was) { if (!waiting()) settle(); return; }
    // The station has changed track. elapsed is where the STATION is in the new
    // one and the ear is earLagMs() behind it, so what is left before this
    // listener hears the change is that lag less the part of it the station has
    // already spent - the same subtraction showTug does to the cool-off, off the
    // same two numbers. It is the exact boundary rather than an estimate of one.
    const end = Date.now() + earLagMs() - elapsed * 1000;
    // Muted means the tug took this song off, and the tug is a reaction because
    // that is what it is: the sound is already cut and the whole of the wait is
    // silence, so the change is drawn NOW and stretched to the boundary rather
    // than booked to start near it. Since the slide-over that is one record
    // crossing the window very slowly over the record it is replacing, which is
    // the same drawing an arrival gives a slow connection and reads the same
    // way - something is being put on, and it is taking this long. Nothing is
    // aimed and nothing waits; see the paragraph over aimChange for why every
    // other change now does both.
    if (mutedAt) beginChange(end - Date.now(), 0);
    else aimChange(end, true);
  }

  function showLikes(j) {
    // Before the early return below, because the two are about different
    // things: that one is "is a track on", and a host can be live over a
    // station playing nothing at all - which is exactly what the music being
    // paused for a bucket set looks like from here.
    showShow(j && j.show);
    showHold(j);
    const wasId = likeId;
    likeId = (j && j.id) || '';
    // A song has been replaced, so the count it ended on is the last one this
    // page was given for it and the arrow is whether that differs from the first
    // one it was given. Both are kept here and spent by noteTrack, which runs
    // several seconds later - at the end of the change of record, with the title
    // they belong to - and that gap is exactly why they have to be caught now:
    // by then likeCount is the NEW song's. Only on a real transition between two
    // named tracks; arriving at a station, or the station going quiet, is not a
    // song ending and leaves the previous entry's reading alone.
    const n = (j && typeof j.likes === 'number') ? j.likes : null;
    if (likeId !== wasId) {
      if (wasId && likeId) {
        rollLikes = likeCount;
        rollUp = likeFirst !== null && likeCount > likeFirst;
      }
      likeFirst = n;
    }
    if (n !== null) likeCount = n;
    // Before the record is changed, because both of these are inputs to how long
    // the change lasts and a change started on last poll's numbers would be
    // timed against a station that has since been retuned. Each is read rather
    // than derived from another: air_delay is how far the station holds the
    // music back, record_min is the floor under the animation, and `cool` - the
    // window the station refuses clicks in - is a third number that showTug
    // takes straight off the response. air_delay used to be got by subtracting
    // 5.0 from `cool`, which was true only for as long as the station happened
    // to write tug_cool as a sum containing it, and is now a variable this page
    // does not keep at all.
    if (j && typeof j.air_delay === 'number') airS = j.air_delay;
    if (j && typeof j.record_min === 'number') recordMinMs = j.record_min * 1000;
    showRecord(likeId, (j && typeof j.elapsed === 'number') ? j.elapsed : 0);
    if (!likeId) { $('likerow').hidden = true; $('tugrow').hidden = true; return; }
    const mine = liked.includes(likeId);
    $('likeCount').textContent = j.likes;
    $('likeHeart').textContent = mine ? '\u2665' : '\u2661';
    $('likeBtn').disabled = mine;
    $('likerow').hidden = false;
    // Same response, same track: the position rides along with the likes
    // because this is the one endpoint a page with no password may ask.
    //
    // Held while the record is being changed. The station is already several
    // seconds into the new track by the time it has reached anybody's ear, so
    // taking this reading straight would jump the clock to the new song while
    // the old one is still playing - which is the same crime the title used to
    // commit and the reason the change of record now covers the gap at all. The
    // reading is kept with the moment it was READ at, so when it lands the clock
    // is still the station's time and not a stopwatch started here.
    if (typeof j.elapsed === 'number') {
      const t = { e: j.elapsed,
                  d: typeof j.duration === 'number' ? j.duration : 0,
                  at: Date.now() };
      if (waiting()) heldTrack = t;
      else { trackElapsed = t.e; trackTotal = t.d; trackAt = t.at; }
    }
    // And the end of this track is booked from the same reading, every poll, so
    // the change of record is drawn INTO the boundary rather than after it. It
    // is last of the three because it wants both of the numbers above: the
    // station's floor, which was read a few lines up, and this reading's
    // elapsed. It refuses itself while a change is running or the tug has cut
    // in, so nothing here has to check for either.
    aimNatural(j);
    showTug(j);
    if (j && j.show && j.show.live && j.paused) {
      $('likerow').hidden = true;
      $('tugrow').hidden = true;
      $('findrow').hidden = true;
    }
  }

  async function pollLikes() {
    try { showLikes(await (await fetch('/likes/now', { cache: 'no-store' })).json()); }
    catch {
      $('likerow').hidden = true;
      $('tugrow').hidden = true;
      // The same rule as the clock below: a show this page was told about
      // before the station stopped answering is not a show it may keep
      // drawing.
      showShow(null);
      showHold(null);
      // Stop rather than keep counting from the last thing it was told. A
      // position that goes on climbing after the station stopped answering is
      // a number this page has no right to.
      trackAt = null;
    }
  }

  $('likeBtn').addEventListener('click', async () => {
    if (!likeId || liked.includes(likeId)) return;
    liked.push(likeId);
    liked = liked.slice(-50);
    try { localStorage.setItem(LIKED_KEY, JSON.stringify(liked)); } catch {}
    try { showLikes(await (await fetch('/likes/add', { method: 'POST' })).json()); }
    catch { pollLikes(); }
  });

  // --- the skip tug of war -----------------------------------------------
  // Same standard as the likes above: no login, no account, no identity. One
  // counter per track, from 0 to 12, shared by everybody listening - the skip
  // glyph adds one, the anchor takes one away, and at 12 the station skips.
  //
  // There is no per-browser budget here and that is not an oversight. A
  // listener who is alone can click twelve times and skip the song; that has to
  // be possible, or "somebody who does not want the skip has to keep the
  // counter down" is about nothing. Keeping a song is not a veto, it is effort,
  // and the effort is the feature: you cannot object once and be done, so a
  // brief loud opinion does not win and nobody holds the track.
  //
  // Nothing is stored. There is no localStorage key, because there is nothing
  // per-browser worth remembering - the counter belongs to the room, not to
  // this browser, and it arrives fresh in every response.
  //
  // GAP is the one piece of per-browser bookkeeping, and it is metering rather
  // than a budget: it bounds how fast this page can click, never how many times
  // it may. Without it a held Enter key, whose auto-repeat runs at about thirty
  // a second, walks the counter to twelve from one press nobody meant as twelve.
  //
  // 400 WAS WRONG AND WAS WRONG IN THE DIRECTION THAT HURTS. It is slower than
  // anybody taps a button they want something to happen on - deliberate tapping
  // sits near 300ms - so roughly every second click was swallowed here and
  // never sent. Reported as "it is taking me two clicks to do one click", which
  // is precisely what a 400ms floor does to a 300ms hand. The old comment
  // claimed twelve clicks took under five seconds; that was arithmetic at
  // exactly 400ms apart, and no hand is a metronome.
  //
  // 120 bounds this page to about eight clicks a second: still far under a key
  // repeat, and now comfortably above a hand. The cost of getting it wrong this
  // way is one dropped click out of an accident; the cost of the other way was
  // half of every honest click.
  //
  // No poller of its own. The counter arrives on /likes/now, which pollLikes
  // already asks for and which only runs while sound is coming out. A second
  // timer here would be the exact bug that block was written to fix.
  const GAP = 120;
  let rope = 0, pullNow = 0, lastPull = 0, coolUntil = 0;

  // The counter has reached the top. The song is over, and the first thing that
  // has to happen is that it stops - for the person who clicked, off their own
  // POST's answer, and for everybody else on their next poll. That is the only
  // asymmetry in it and it is the honest one: the clicker knows first because
  // they are the one who did it.
  //
  // MUTED, not paused and not disconnected, and the reason is arithmetic rather
  // than taste. Tearing the connection down would mean building another one:
  // icecast hands a joining player its 65536-byte burst, which is 4.096s of
  // already-played audio, and this browser then needs its own fill on top -
  // 4.4s measured from the machine that serves the stream, and it is the fastest
  // a listener can be. So dropping the stream to stop the song sooner buys
  // nothing and costs eight and a half seconds of the wait it was meant to
  // shorten. audio.pause() is worse still and would be a bug rather than a
  // trade: it fires the pause event, sleep() takes that as the listener leaving,
  // and the page would stop polling in the one second it most needs to poll -
  // ending the change of record before it began, on the track change the change
  // exists for.
  //
  // Muting stops the sound in the same frame and leaves everything else running.
  // The stream goes on arriving at real time, so the ear stays exactly where it
  // was relative to the station, and the moment to let it out again is a moment
  // this page already computes to the millisecond: the end of the change of
  // record, which is when the new music reaches this listener. The old song's
  // last seconds are played silently into the gap rather than being skipped, and
  // that is right - they are what the ear would have heard.
  //
  // The title goes to a dash for the same interval and comes back with the
  // record. lastTitle must not move while it is away - it is what the guestbook
  // stamps on a note and what the search link points at, and neither should
  // become a dash - so this does not go through showTitle. It goes through
  // blank() instead of writing the panel outright, which is what makes the dash
  // something the release can take off again whether or not a new title turned
  // up to replace it; the block over blank() has the two paths where none did.
  //
  // Two catch-up polls rather than waiting out the five-second one. The station
  // needs a moment to skip and to name what replaced it, and until it does this
  // page is silent with nothing drawn - which is the one stretch of this
  // sequence that has no mechanism covering it. They are one-shots hung off an
  // event, in the same shape as the /likes/now poll() already fires when it
  // notices a title change, and not a timer of their own.
  function topOut() {
    // Nothing to silence and nothing to hold. A page that is not listening can
    // still push the counter - the tug row is drawn from the one round of polls
    // this page does at load - and taking a mute there would arm waiting() with
    // no poller running to disarm it, which would freeze the title for the rest
    // of the session on a page that never made a sound.
    if (quiet || mutedAt || mutedId === likeId) return;
    mutedAt = Date.now();
    mutedId = likeId;
    audio.muted = true;
    blank();
    setTimeout(pollLikes, 300);
    setTimeout(pollLikes, 1000);
  }

  // One pip per click, and the same count in digits beside them. The page is
  // told how many there are rather than knowing, so twelve lives in exactly one
  // place and that place is the station - which is also why the reading is
  // built out of j.rope and why "/12" is written nowhere in this file.
  function showTug(j) {
    if (typeof j.pull !== 'number' || typeof j.rope !== 'number' || j.rope <= 0) {
      $('tugrow').hidden = true; return;
    }
    const el = $('rope');
    if (rope !== j.rope) {
      rope = j.rope;
      el.textContent = '';
      for (let i = 0; i < rope; i++) el.appendChild(document.createElement('i')).className = 'pip';
    }
    pullNow = j.pull;
    // The cool-off after a track change, during which the station refuses every
    // click, because the audio a listener is hearing is several seconds behind
    // what this page has already been told is playing - so a click now is a
    // vote on a song they have not reached yet.
    //
    // A deadline of our own, in two parts. The station hands over the LENGTH of
    // the window and its own position in the track, so what is left is the one
    // minus the other, worked out from the same two numbers the station uses.
    //
    // And then the part that is not arithmetic: the answer to the click that
    // takes the counter to the top is the answer to a skip that has just been
    // ordered but has not landed yet, so it still reports the OLD track's
    // position and truthfully says the window has not started. Believing it
    // leaves the buttons live until the next poll - measured at 3672 ms of a
    // 5000 ms window spent looking live while every click was refused. Nothing
    // but a click can take the counter to the top, so seeing it there IS proof
    // that a change has this moment happened, and the window is armed whole
    // from here rather than waiting to be told about it.
    const cool = typeof j.cool === 'number' ? j.cool : 0;
    const into = typeof j.elapsed === 'number' ? j.elapsed : 0;
    const left = pullNow >= rope ? cool
               : (into >= 0 && into < cool) ? cool - into
               : 0;
    coolUntil = Date.now() + left * 1000;
    // The same proof, used for the other thing that has to happen at the top of
    // the counter: the song stops. See topOut.
    if (pullNow >= rope) topOut();
    [...el.children].forEach((p, i) => p.classList.toggle('on', i < pullNow));
    // The digits, off the same two variables as the line above and in the same
    // breath as it, so no redraw can leave the reading and the picture holding
    // different numbers. drawTug does not touch this and nothing else writes
    // it: the only other thing that happens to the figure is the fade, and the
    // fade is CSS hanging off the class drawTug already puts on the rope.
    $('tugNum').textContent = pullNow + '/' + rope;
    drawTug();
    $('tugrow').hidden = false;
  }

  // Split out of showTug because the cool-off ends between polls. tick() calls
  // this every second - the timer that already runs, and only while sound is
  // coming out - so the buttons come back when the wait is actually over
  // instead of at the next poll. Nothing new is on a timer.
  function drawTug() {
    // The record being changed counts as cool-off in its own right, so the tug
    // comes back AFTER the new record has landed and never during it - which is
    // the last step of the order the change exists to keep, and on the numbers
    // this station actually measures it is not a corner case but the ordinary
    // one. The station refuses clicks for 6.75s today, which is where tug_cool
    // sits with air_delay at 1.75. The
    // ear is behind by air_delay + the burst + this browser's own buffer, and
    // the browser's own buffer alone measured 4.4s from the machine that serves
    // the stream - so the change of record outlasts the station's window
    // whenever that buffer takes more than 0.904s to fill, which is every
    // listener there has ever been. Without this line the buttons would come
    // back while the record was still travelling, every time.
    //
    // waiting() rather than changeUntil, so the gap between the counter topping
    // out and the station naming what replaced the song is covered as well. The
    // station's own window is armed whole from the top-out and would cover it
    // anyway; this makes the page's answer follow from the page's own state
    // instead of from a deadline that happens to be long enough.
    const cool = Date.now() < coolUntil || waiting();
    $('rope').classList.toggle('cool', cool);
    $('tugSkip').disabled = cool;
    // Nought is the floor and nothing else - no saved state, no veto, just a
    // click with nowhere to go. Saying so with the button is kinder than taking
    // the click and doing nothing with it.
    $('tugKeep').disabled = cool || pullNow === 0;
  }

  // The answer is the whole public state, so one response redraws the counter,
  // the heart and the clock together and none of them can be caught disagreeing
  // with the others.
  //
  // The cool-off is checked here as well as drawn, because a click can arrive
  // between the button disabling and the eye noticing - and because the station
  // refuses it anyway. This only saves the round trip; it is not the rule.
  async function tugPull(path) {
    const now = Date.now();
    if (!likeId || now < coolUntil || now - lastPull < GAP) return;
    lastPull = now;
    try { showLikes(await (await fetch(path, { method: 'POST' })).json()); }
    catch { pollLikes(); }
  }

  $('tugSkip').addEventListener('click', () => tugPull('/tug/skip'));
  $('tugKeep').addEventListener('click', () => tugPull('/tug/keep'));

  // Everything on a timer, in one place, because "is sound coming out" is now
  // the only question that decides whether this page talks to the station at
  // all. Measured before this existed: one open tab made 691 requests in ten
  // minutes - 69 a minute, forever, whether or not anybody was listening. A tab
  // left open overnight was a tab downloading the guestbook two thousand times.
  //
  // The audio element is the switch rather than the button, so a pause from the
  // keyboard, the lock screen, a headset button or the stream dropping all stop
  // it too - the button is one way in and it was never the only one.
  const PULSE = [
    [poll,          8000],
    [loadMessages, 30000],
    [pollChat,      4000],
    [pollNarrator,  4000],
    [pollLikes,     5000],
    [tick,          1000],
  ];
  let timers = [];

  function wake() {
    if (timers.length) return;
    quiet = false;
    for (const [fn] of PULSE) fn();   // catch up now, do not wait out a cycle
    // Not in PULSE, deliberately: Earlier is fetched on the events that change
    // it, not on a clock. See pollEarlier.
    pollEarlier();
    timers = PULSE.map(([fn, ms]) => setInterval(fn, ms));
  }

  function sleep() {
    if (!timers.length) return;
    timers.forEach(clearInterval);
    timers = [];
    // The clock stops rather than counting on from the last reading it was
    // given. A position that keeps climbing while nothing is being fetched is
    // a number this page has no right to - the same rule pollLikes already
    // follows when the station stops answering.
    // A change of record in progress is ended here rather than left to run.
    // Its whole job is to cover the wait for audio that is no longer coming,
    // and a carriage still travelling over a button nobody is listening to is
    // an animation with nothing left to mean. Ending it also lets go of the
    // title and the position it was holding, which is what a page that has
    // stopped listening should be showing: what the station says, now.
    //
    // Ended as NOT landed, which matters only in the opening state: somebody who
    // presses play and changes their mind before the record is down gets the
    // empty deck back, because that is what happened. What this does NOT do is
    // empty the deck of a record that arrived. That one is lifted off the pin
    // and stood beside it at the foot of this function, and it stays in the
    // session for the rest of it. Emptying the deck on every pause would make
    // the opening state a state playback returns to, which it is not.
    endChange(false);
    // And the sound comes back, because the element is about to be handed to
    // somebody pressing play. endChange above is deliberately NOT the place for
    // this - it ends as not-landed here - and a mute that outlived the page's
    // listening would make the next press silent with nothing on screen to say
    // why, which is the worst failure this whole mechanism could have.
    unmute();
    trackAt = null;
    // And the record forgets what it was last showing, for the same reason.
    shownId = '';
    // The buffer reading belongs to a connection that no longer exists.
    fillFrom = 0;
    quiet = true;
    tick();
    // And the record comes off the pin. It is here rather than on the pause
    // event because sleep() is the one place every way of stopping arrives at -
    // the button, the lock screen, a headset, a stream that ends or errors -
    // and the record has to be parked on all of them. If it were not, the
    // carriage would be gone (endChange above) and the real disc uncovered
    // while the page is paused, showing the triangle setBtn writes for the
    // accessible name; the paper a listener can see must go on carrying the
    // bars. It is last because endChange at the top of this function would end
    // the carriage it builds.
    park();
  }

  audio.addEventListener('playing', wake);
  audio.addEventListener('pause',   sleep);
  audio.addEventListener('ended',   sleep);
  audio.addEventListener('error',   () => { if (audio.paused) sleep(); });

  // One round at load and then silence until someone presses play. Without it
  // the page would open blank - no track, no guestbook, no chat - and asking a
  // visitor to press play to find out what is playing is the wrong way round.
  // One round is not traffic; sixty-nine a minute was.
  //
  // Earlier is in this round for the reason the whole change exists: somebody
  // who has just arrived and not yet pressed anything should be able to see the
  // hour they missed. It is also the only path that fills the list when the
  // station is playing nothing at all, since the other one hangs off a title.
  poll(); loadMessages(); pollChat(); pollNarrator(); pollLikes(); pollEarlier();
  quiet = true;
  tick();
})();
</script>
</body>
</html>
