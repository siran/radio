<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild n Loyal Radio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<style>
  :root {
    --bg: #0b0b0e; --panel: #131318; --line: #24242c;
    --fg: #ecebe8; --dim: #8b8b96; --accent: #4ade80;
    /* Not in the light block below, on purpose. Every other colour here is
       redefined for light because it is a shade of the page; this one is a
       signal and reads the same on both, exactly as the host console's own
       on-air red does with no light theme at all to check it against. */
    --air: #ef4444;
    /* The diameter of the record, and through it the height of the volume row
       and the width of the column under the button. This number is no longer the
       one chosen first, and what is chosen first has changed again. It used to be
       the play triangle at fourteen pixels tall, the height of the triangle in a
       standard twenty-four pixel play icon and so the size a play button is on
       anything else; the label was then made only wide enough to hold that symbol,
       which is centred on the spindle hole rather than hanging below it; and the
       vinyl was finally made only as wide as it had to be for the grooves outside
       the label to still read as grooves. Deciding in that order landed on
       eighty-four pixels, twelve less than the ninety-six this used to be, and
       eighty-four is not reopened by anything below: the counter under the button
       is pinned to this width and does not scale with it, and 10:00 / 100:00
       measures 71.7px, so there are twelve pixels in hand and no more to give.

       What is chosen first now is the red the spindle hole is allowed to keep
       around it. The symbol printed round that hole had closed to within two
       thirds of a pixel of it in the pause state, and a gap that narrow does not
       read as a gap; it reads as two things that were meant to touch and missed.
       So the hole is held at 4.61px, the clearance is asked for, and the symbol is
       made as large as that clearance leaves room for: sixteen pixels of ink where
       it was fourteen, on paper that goes from thirty and a half per cent of the
       diameter to thirty-five. The grooves pay for the paper, because the paper
       has nowhere else to grow into, and the price is one ring out of seventeen.

       Eighty-four became a hundred and twelve because the red was asked to be
       bigger, and the red is a fraction of this. Growing the fraction alone would
       have been the wrong lever twice over: the paper is already at the largest
       share the groove field could pay for at eighty-four, and a label that takes
       more of a disc that stays the same size is a label crowding a record rather
       than a bigger label. Growing the disc pays for both at once, because the
       groove pitch below is in pixels and does not scale - so a wider disc simply
       has more rings to spend, and the paper can take a larger share of it and
       still leave more of them showing than before. Nineteen now, against sixteen.

       --ctl and --hole are the two things here that are NOT a fraction of the
       diameter, and that is the whole shape of this change. They are the control:
       the symbol somebody presses and the hole it is printed around. A control is
       the size a control is, on a small pressing or a large one, so both hold the
       exact measurements they were cut to at eighty-four - 20.41px of symbol and
       4.61px of hole - and the red grows around them instead of with them. The
       clearances round that hole are the reason both numbers are frozen, and they
       are now 2.35px of white inside the triangle and 2.45px of red between the
       hole and each pause bar, measured off the rendered button and not derived.
       The white moves with where the button lands on the page and the red does
       not, which is a fact about the raster rather than about the drawing; the
       symbol explains it.
       Scale them with the disc and the bars grow by a third too, and the
       label ends up exactly as full as it started, which is what was asked to
       change.

       --cue is the third of those, and it is the one that is NOT a control. The
       triangle on the empty deck used to be --ctl as well, on the argument that
       it had to be the same size and in the same place as the one printed on the
       paper so that nothing moved when a record landed over it. That argument
       was paid for by the mechanism it was written against: the record used to
       appear in place, so the two symbols were compared at the same coordinates
       and any difference read as a jump. The record now travels in from the side
       and is lowered onto the pin, so it COVERS the cue by moving over it, and
       an occlusion invites no comparison. The constraint is bought out, and what
       decides the size instead is the thing the owner of this page asked to be
       able to enjoy: the pin standing through the ink. Set out at the cue.
       It is no longer a font size, because the cue is no longer a glyph - a
       glyph's shape belongs to whatever device is drawing it, and the pin has
       to stand in the middle of the shape on all of them. It is still the em
       that triangle was cut at, and .700 and .782 in .lp-cue are the ink the
       font drew at it, so the size on screen did not change when the drawing of
       it did. The four thirds beside the .700 is not part of that measurement:
       it is the box being made a third wider than the ink so that the
       triangle's centroid is the centre of it, and the cue's own paragraph
       has the argument.

       --seat is how far the record is held above the deck while it is carried,
       and it is twice --hole for a reason that is about the drawing rather than
       about taste: the pin must start the drop clear of the hole by its own
       width, or the record is already on the spindle before it is lowered and
       there is nothing for the lowering to show. */
    --lp: 112px;
    --ctl: 20.41px;
    --hole: 4.61px;
    --cue: 45px;
    --seat: 9.22px;
    /* The metal of the spindle, and it is a custom property for one reason: the
       pin is drawn in two places now. It stands on the empty deck, and it shows
       through the hole of the record that is on it - which is the same post seen
       from the same lamp, so it cannot be two gradients that agree by hand. Not
       in the light block below, like --air and for the same kind of reason:
       steel under one lamp is the same steel whichever way the page is themed,
       and a pin that changed colour with the theme would be the one part of this
       button lit from somewhere else. */
    --pin: radial-gradient(circle closest-side at 45% 35%,
                           #9d9da8 0 30%, #6a6a75 62%, #43434c 100%);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f6f4; --panel:#fff; --line:#e2e2dd; --fg:#17171a; --dim:#6b6b73; --accent:#16a34a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px 20px; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 900px; }

  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 5px; }
  .desc { color: var(--dim); font-size: .9rem; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: .72rem;
          letter-spacing: .14em; color: var(--dim); margin-bottom: 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; }
  .on .dot { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  .on .lbl { color: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(74,222,128,.5)} 50%{opacity:.75; box-shadow:0 0 0 6px rgba(74,222,128,0)} }

  /* A HOST is on the microphone. A different fact from the one above it, and
     it needed a different mark rather than a second reading of that one: the
     dot up there is the stream, this one is a person. Same dot, and the red
     and the beat of the host console's own on-air bar, so both ends of a
     broadcast look like each other.

     Not one word of ours anywhere inside it, which is the rule this page is
     built to: the tug row has no words at all so that somebody who reads no
     English can still use it. What is drawn here IS the host's own writing,
     which is theirs and not a label, and the dot is what carries the meaning
     for a reader who cannot read it.

     The show block simply is not there when nobody is live, so nothing has
     to be dimmed, greyed or explained away in the off state. */
  .show { margin: 2px 0 6px; text-align: center; }
  .show .showname { justify-content: center; }
  /* The station's own track while a show is on: still audible, so still
     shown, but it is the bed and not the billing. Dropped to the weight the
     page already uses for context - the same treatment a paused track gets -
     so the eye reads the show first. */
  .np.under { font-size: .86rem; font-weight: 500; color: var(--dim);
              margin: 8px 0 18px; }
  .show .showname { display: inline-flex; align-items: center; gap: 8px;
                    font-size: 1.02rem; font-weight: 650; overflow-wrap: anywhere; }
  .show .dot { background: var(--air); animation: airpulse 1.2s ease-in-out infinite; }
  .show .showtitle { font-size: .92rem; margin-top: 2px; overflow-wrap: anywhere; }
  .show .shownote { color: var(--dim); font-size: .86rem; margin-top: 3px;
                    white-space: pre-wrap; overflow-wrap: anywhere; }
  /* by name. The reduced-motion rule further down is a * and this is a real
     element, so it does reach it - but the animation still has to be one
     that can be named. */
  @keyframes airpulse { 50% { opacity: .25; } }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  .chatlog { height: 170px; overflow-y: auto; font-size: .84rem; margin-bottom: 11px;
             display: flex; flex-direction: column; gap: 3px; }
  .chatlog .line { overflow-wrap: anywhere; }
  .chatlog .nick { color: var(--accent); font-weight: 600; }
  .chatlog .t { color: var(--dim); font-size: .68rem; margin-left: 5px; }
  .chatlog .quiet { color: var(--dim); }
  .chatrow { display: flex; gap: 7px; }
  .chatrow input { margin-bottom: 0; }
  .chatrow #nick { width: 82px; flex: none; }
  .chatrow #say { flex: 1; min-width: 0; }
  .chatrow button { flex: none; padding: 9px 13px; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; }

  .np-label, .panel h2 { font-size: .68rem; letter-spacing: .16em; color: var(--dim);
                         text-align: center; font-weight: 500; margin: 0; }
  .panel h2 { text-align: left; margin-bottom: 12px; }
  .np { text-align: center; font-size: 1.02rem; font-weight: 550; margin: 6px 0 22px;
        min-height: 1.6em; overflow-wrap: anywhere; }
  /* Held, not playing. The track stays on the panel - it is still the one the
     station will come back to, and the operator asked to be able to see it -
     but it stops looking like sound coming out. Dimmed to the weight of the
     label above it, which is the page's existing shade for "this is context
     rather than the thing itself". */
  .np.hold { color: var(--dim); font-weight: 500; }

  .controls { display: flex; align-items: center; gap: 16px; }
  /* A switch rather than a button, and the difference is that a switch has a
     state you can see without pressing it. The face goes IN when it is off -
     the same inset the deck's own well is drawn with - so silence reads as a
     thing held down rather than as a thing missing.

     It is the symbol itself, with no label beside it. That is the rule the
     rest of this page's controls follow, and here it costs nothing: a speaker
     with waves and a speaker with a cross need no translation.

     Sized against the volume slider it sits beside rather than against the
     record, which is a different object at a different scale. */
  .sw { flex: 0 0 auto; width: 34px; height: 27px; padding: 0; cursor: pointer;
        border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
        display: grid; place-items: center; font-size: 15px; line-height: 1;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.35);
        transition: box-shadow 130ms ease, opacity 130ms ease; }
  .sw[aria-pressed="true"] { opacity: .62;
        box-shadow: inset 0 2px 5px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.25); }
  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.play { flex: none; width: var(--lp); height: var(--lp); border-radius: 50%; cursor: pointer;
    border: none; background: #0d0d11; padding: 0;
    display: grid; place-items: center; transition: transform .12s ease; }
  /* No hover. It grew the button five per cent, which was a reasonable thing
     for a button to do and is the wrong thing for a turntable: a record on a
     deck does not swell because a cursor came near, and the transform fought
     the carriage on the way in. Touch never had it and lost nothing. */
  button.play:disabled { opacity: .28; cursor: not-allowed; }
  /* An empty deck that cannot be pressed keeps more of itself than a record that
     cannot. .28 was chosen for a disc with grooves and a label on it, where a
     quarter of the contrast still leaves a recognisable object; a recess has
     almost no contrast of its own to spend and at .28 it goes to a flat grey
     coin in the light theme, which reads as a missing image rather than as a
     turntable nobody can start. Half is enough to keep the dish and the pin,
     and the state is carried anyway by the thing that is missing rather than by
     the light: there is no play cue on it. */
  button.play.empty:disabled { opacity: .5; }
  /* The stream takes a moment to arrive however fast the server is - TLS, then
     the first audio, then whatever the browser wants buffered before it makes a
     sound. Pressing a button that sits there looking unpressed is the worst part
     of that wait, so the ring starts turning on the press itself and stops when
     sound actually begins. It is not a progress bar and does not pretend to be:
     it says heard you, and still coming. */
  button.play { position: relative; }
  /* Grey means the stream cannot be reached, and this round is it coming to
     mean only that. It used to be written `not loading and not spinning`, which
     is a description of a record that is not playing, so every listener who
     merely pressed pause was handed a grey record - and the owner of this page
     named what a grey record actually says when he saw one: a greyed label
     means the stream is unreachable. It is a good thing to be able to say and
     it was being spent on something else.

     So the filter keys off the one condition that is true then and false
     otherwise, which is the button being disabled. setLive turns the control
     off when icecast reports no source and when a press could not be started,
     and those are the two ways this page ever learns there is nothing to
     listen to.

     Pausing is not one of them. A paused record is red because it is a record.
     What says it is not playing is that it has been lifted off the pin and
     stood beside the deck, which is an object having moved rather than a wash
     laid over one, so the states are kept apart by where the record IS:

       parked, out of the window   nothing is playing
       on the pin, still           the press landed, sound has not come yet
       on the pin, turning         sound is coming out
       grey, whatever it holds     the station is not there

     The filter sits on the BUTTON rather than on the disc, so the silver rim
     and the light on it grey out with the vinyl - a bright specular highlight
     on a grey record reads as a rendering fault rather than as a record there
     is no point pressing.

     620ms because the colour coming back is the whole announcement that the
     station has returned; instant would look like a redraw. The transition is
     on the button and is therefore killed with everything else under reduced
     motion, which leaves the states intact and only removes the fade. */
  button.play { transition: filter 620ms ease; }
  button.play:disabled { filter: grayscale(1) brightness(.72); }
  /* Waiting, with no words in it. The record is on the platter and breathing;
     when sound arrives it stops breathing and starts turning, so the two states
     are never both true and cannot be confused for each other.

     opacity rather than filter, because filter is already carrying the grey and
     one property cannot be driven by a transition and an animation at once. It
     never goes below .55: a control that fades most of the way out looks broken
     rather than busy, and this one is still the thing you press to give up. */
  @keyframes lpwait { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  button.play.loading { animation: lpwait 1.15s ease-in-out infinite; }
  button.play.loading { cursor: progress; }
  /* Not while a record is on its way onto the deck. The pulse says the record is
     on the platter and waiting, and during an arrival it is not on the platter -
     the arrival itself is saying the same thing better, with an object moving.
     Two things saying wait at once, one of them by fading the other in and out,
     is worse than either. It comes back the moment the record lands, which is
     the moment the pulse's own sentence becomes true again. */
  button.play.loading.shoving { animation: none; }
  /* The ring that used to sit here is gone. A record coming up to speed says
     the same thing - heard you, still coming - with the object already on
     screen rather than a second spinner laid over it. */
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The button is the record, and the record is built the way one looks: black
     vinyl carrying fine concentric grooves, a smooth run-out ring where the
     grooves stop, a red paper label, and a spindle hole punched dead centre. The
     label takes a little over a third of the face, which is about what a twelve
     inch LP gives it, and it can be that small because the symbol is printed
     around the spindle hole rather than stacked below it: what the paper has to
     cover is the symbol's furthest corner from the centre, and no longer the
     length of a hole and a symbol laid end to end. It grew from thirty and a half
     per cent to thirty-five in order that the symbol printed on it could grow too
     and still leave a pixel and a half of red between the hole and the ink. The record is built outward
     from the symbol rather than the label being handed whatever the disc had left
     over, which is how it ended up with a six pixel triangle on a ninety-six pixel button.
     Every measurement here is a fraction of --lp, so changing the diameter changes
     the whole pressing rather than leaving the label the wrong size for the disc
     it is glued to.

     The background layers are listed in the order the background property wants
     them, topmost first, which is the reverse of the order anyone would describe
     them in. The glint used to be the first of them and is not here any more; it
     is an element of its own now, below, because light from a lamp in the room
     does not turn with the turntable. What makes the turning legible without it
     is the label, which carries a symbol and is unmistakably going round; grooves
     in motion do look exactly like grooves at rest, but they were never the only
     evidence.

     So the first layer is the run-out, the smooth dark band every pressing has
     between the last groove and the paper. Its inner edge is written as thirty-five
     per cent, which is the same number as the label's share of the
     diameter, and that is not a coincidence to be tidied away: a percentage in
     this gradient is a fraction of the disc's radius, and the label's edge lies
     at exactly the label's fraction of it. Move one number without the other and
     the smooth band stops meeting the paper. Its outer edge is a different kind
     of number, measured from the inner one and from nothing else: the band is
     four and a half points of the radius wide, which is the 1.89px it was cut to
     when the rings were last counted, so the outer edge is thirty-nine and a half
     per cent. It moved out by exactly what the paper moved out by, because a
     run-out that does not follow the paper is a run-out that no longer starts at
     it, and it happens that the paper's new edge lands exactly where this band's
     outer edge used to be.

     Then the grooves, and they are a ramp rather than a step. A step edge carries
     a great deal of energy above its own pitch, and once the pitch is down near
     the width of a pixel that energy folds back and the ring field breaks into a
     speckled hatch, which was rendered at true size and is not a subtle failure:
     it is worse than having no grooves. Written as a ramp instead, from near-black
     up to the light of the groove at the halfway point and back down, the field
     survives at pitches a step cannot reach, because a ramp has almost nothing
     above its own pitch left to fold.

     Sixteen rings is what is drawn now, and the pitch that draws them has still
     not moved by so much as a hundredth of a pixel. Contrast lives in the pitch and
     the pitch lives on the raster: these rings are a gradient sampled on a grid
     whose pixels are one, and measured off the rendered button over a fixed
     annulus a pitch of 1.45px draws its rings at 9.3 levels out of 255 where
     1.61px draws them at 13.5, and the angular scatter that tells a ring field
     from a hash goes up by half again at the finer pitch. A pitch chosen to make
     a ring count come out is therefore a pitch that throws the rings away, and the
     count has to follow the band instead. A repeating radial gradient is phased
     from the centre, so a light ring falls at 0.81px, 2.42px, 4.03px and so on
     outward whatever happens to be covering it, and moving the paper does not move
     a single one of them; it only decides how many are still uncovered when the
     run-out has finished. Growing the label to thirty-five per cent put the band's
     outer edge at 16.59px, a third of a pixel short of the ring that used to be
     second from the middle, so that ring survives and the one at 15.35px does not.
     Seventeen becomes sixteen and the price of the whole change is that one ring.

     What the ring cost buys back is worth stating beside it, because it is the
     reason the trade was taken. The pause bars went from two thirds of a pixel
     clear of the spindle hole to a pixel and a half, and the play triangle from
     1.80px of white around it to 2.39px. Both of those numbers have since moved
     and the second of them was never rendered by anything: the clearances the
     button actually draws are 2.45px of red and 2.35px of white, and
     where they come from is set out down at the symbol. Measured off the rendered button over the
     band each field actually occupies, the sixteen come out at 16.8 levels of
     contrast against the seventeen's 18.1, with the angular scatter that tells a
     ring field from a hash unchanged at 6.1 against 6.0 and the median pitch
     unchanged at 1.6px. The contrast falls by a level and a third for two reasons
     and neither of them is a field starting to break: the ring that was lost sat on
     the lighter part of the moulding near the middle where the same gradient has
     the most room to swing, and the innermost ring that remains is now clipped by
     the run-out on its inner side. A level and a third off eighteen is a long way
     from the 9.3 that was measured at the finer pitch and rejected two rounds ago.
     The innermost of the sixteen sits at 16.94px and clears the run-out by a third
     of a pixel where the innermost of the seventeen had two thirds, and the
     outermost sits at 40.99px and clears the rim by a whole one. A label of
     thirty-five and a half per cent was rendered and measured as well, and that is
     where the second ring goes: it puts the run-out's outer edge past 16.90px and
     the count falls to fifteen. Thirty-five was therefore the largest label that
     groove field gave up only one ring for - AT EIGHTY-FOUR PIXELS, which is the
     half of the sentence that mattered and the half that was easy to lose.

     The disc is a hundred and twelve now and the arithmetic is not close. The
     pitch is in pixels and does not scale, so the rings available are set by the
     radius alone: light rings fall at 0.805px, 2.415px and every 1.61px outward
     whatever is printed over them, the paper at forty-two per cent puts the
     run-out's outer edge at 26.04px, and the rings from there to the 56px rim are
     the ones at k=16 through k=34. Nineteen, against the sixteen a smaller disc
     showed under a smaller label. Growing the disc is what buys a bigger label
     without the grooves paying for it, which is why the diameter moved and not
     the fraction on its own.

     The white is left at the weight it was already carrying, because the band's
     average brightness follows that weight and hardly notices the pitch, so leaving
     it alone keeps the margin reading as black vinyl rather than as grey card
     without anything else having to be arranged: each measured over the band it
     actually occupies, this sixteen ring field reads 26.0 levels of mean luminance
     where the seventeen read 26.6 and the ten before them read 24.4, and every one
     of those steps is the lighter moulding near the middle changing hands between
     the paper and the grooves. This pitch is in
     pixels and not a fraction of --lp on purpose, unlike everything else here: it
     was chosen against the raster the browser draws it on, and a pitch that scaled
     with the record would land somewhere else on that raster at every size and
     alias differently at each.

     Underneath is the vinyl, a shade lighter at the centre than at the rim so
     the face reads as a moulded object rather than a hole cut in the page.

     It comes round in four and a half seconds, far slower than a real record and
     deliberately so: at this size anything near thirty-three revolutions a minute
     stops reading as a record and starts reading as the loading ring above,
     which means something else entirely and can follow it within the same press.

     The animation is declared on the disc unconditionally and left paused, and
     playing only flips animation-play-state to running. Toggling the animation
     itself on and off would throw the angle away and snap the label back to
     upright every time the stream stopped, which is the opposite of what a
     record does; pausing the play state leaves the transform exactly where it
     had got to, so the label freezes mid-turn and the next press carries on from
     the same angle. */
  .lp-disc {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle closest-side, transparent 0 42%, #0f0f14 42% 46.5%, transparent 46.5%),
      repeating-radial-gradient(circle closest-side, rgba(0,0,0,.86) 0,
                                rgba(255,255,255,.12) .805px, rgba(0,0,0,.86) 1.61px),
      radial-gradient(circle closest-side, #26262f 0 26%, #16161c 60%, #08080b 100%);
    animation: spin 4.5s linear infinite;
    animation-play-state: paused;
  }
  button.play.spinning .lp-disc { animation-play-state: running; }
  /* --- a record being changed --------------------------------------------
     THE NEW RECORD SLIDES IN OVER THE ONE THAT IS PLAYING. It comes in from the
     right riding above the pin, crosses the face of the record already on the
     deck, and is lowered onto the spindle; at that instant the title changes,
     the tug comes back and the record turns. Two axes and they are used for two
     different things: sideways is a record being carried, downwards is a record
     being PUT somewhere, and the second is the whole of what a spindle is for.
     One constant speed on each, a hard start and a hard stop: nothing here is
     eased, because easing is what makes a change look designed, and this one is
     meant to look like a mechanism.

     WHAT THE OUTGOING RECORD DOES IS NOTHING. It stays exactly where it is,
     turning until the incoming one reaches it, and is covered. That is the
     operator's own instruction and it is also the only one of the two choices
     that keeps a record on the deck the whole way through: carried off
     underneath, it would leave the far side of the window empty again for as
     long as it took to clear, which is the thing this round exists to remove.
     Covered, there is never a moment with no record under the pin, so the lift
     off the spindle goes with it - nothing has to come off a spindle it is not
     leaving - and the deck's own well and cue are never uncovered by a change.

     Which is why the outgoing record is not a copy any more. It is the REAL
     disc, left visible where every other move here hides it, held at its own
     angle by the play-state rule below and let go of again at the instant the
     new one lands. There is nothing to hand over at the end: the carriage is
     taken off and what is underneath is the same element that was underneath
     when it went on, at the same angle, so the seam that the copies were
     built to hide does not exist for a change. One copy is built and it is the
     incoming record.

     Nothing turns while the record is being changed. The copy and the real disc
     under it are held at one angle by the play-state rule, and the real one is
     unpaused - never restarted - at the landing. A record being carried is not
     spinning, a record on the platter is, and this is the difference between
     the two being drawn. It also makes the operator's sentence literally true:
     the new record starts playing at the moment it is put down, because that is
     the moment anything on this button starts turning again.

     THIS IS THE SAME MOVE AS AN ARRIVAL, over a deck that is not empty. Both
     are one copy waiting off the right of the window, one travel across it, one
     seat onto the pin, and they share the script's keyframes. What differs is
     only what is underneath - a lit well and a play cue for the first press of
     a session, the record that is still sounding for a change - and the change
     is therefore no longer the long sequence it was: lift, carry out, stand
     empty, carry in, seat, of which the empty deck was the largest part.

     The empty middle was not decoration and it is worth writing down what paid
     for it, because the argument was sound and the drawing was still wrong. A
     track change happens at the source and does not reach a listener until the
     station's delay, icecast's burst and that browser's own buffer have all
     been paid - about ten seconds, measured - so the change was timed against
     THAT moment and the deck stood empty across it. Aiming fixed the timing;
     the empty deck was what was left over, and a long sequence that has to be
     STARTED at the right moment is more sensitive to an estimate of that
     ten seconds than a short one that has to LAND on it. One move that lands is
     the whole simplification.

     The window is the button itself, clipped only while this runs. It is a
     circle, so the incoming record comes through a porthole and passes over the
     face of the one it is replacing.

     420ms of travel is 267px/s across the 112px face, and it is the FLOOR
     rather than the length. A change that is covering a wait - the tug, which
     cuts a song off and has the whole silence to fill - stretches the travel
     over that wait instead, which is the same rule an arrival is drawn by and
     for the same reason: the speed a hand moves at does not depend on the wait,
     but a drawing whose job is to cover one does.

     The seat is 240ms over --seat, which is 9.22px, and that is 38px/s: one
     seventh of the speed the same record is carried at. The difference is the
     point rather than a taste. Carrying a record is a move that only has to end
     somewhere near; putting one on a spindle is a move that has to end on a
     4.61px target, and a hand slows down for the second one. Drawn at the
     carrying speed the drop lasts 35ms, which is two frames and is not a motion
     at all - it reads as the record snapping down. It is not eased for the same
     reason nothing else here is; what says "aiming" is the speed, not a curve.
     It is the ONE part of any of these moves that keeps its length whatever the
     total, because it is a physical event rather than a wait.

     The floor is therefore TRAVEL + SEAT = 660ms, the same for a change as for
     an arrival, where a change used to need SEAT + TRAVEL + TRAVEL + SEAT.
     Under it there is nothing to see, and the station has a floor of its own -
     record_min, on the desk - which sits above it and is what actually binds.

     The copy is offset with `left` rather than a transform, and that is not a
     preference: it carries spin, spin drives transform, and one property cannot
     be driven by an animation and a static value at once - the same collision
     the waiting pulse above avoids by using opacity. Left means width as well,
     because inset:0 sizes these from both edges. 200% puts it a whole window
     clear of the right edge, so the carriage's own -100% at the first frame is
     what stands it just off the window with nothing showing.

     Both axes are driven on the CARRIAGE and never on the copy, for that same
     reason: the carriage carries no spin, so its transform is free, and one
     translate can hold the sideways and the downwards at once.

     There are no @keyframes here any more. The travel has offsets that depend on
     a duration only the script knows, so it is written with the Web Animations
     API instead, where a keyframe can be handed an offset at the moment it is
     built. That has a second effect worth knowing: the blanket
     `animation: none !important` at the foot of this sheet cannot touch a script
     animation, so the carriage can no longer be stranded by it. Reduced motion
     is still refused in the script, because it should be, but it is now a
     preference being honoured rather than a hazard being avoided. */
  button.play.shoving { overflow: hidden; }
  button.play.shoving .lp-disc { animation-play-state: paused; }
  .lp-shove { position: absolute; inset: 0; pointer-events: none; }
  /* One copy, waiting off to the right, for both of the moves that bring a
     record IN - the first press of a session and a change of record. Same
     element, same travel, same speed, same seat; what differs is only what is
     under it, and that is decided by the button's own classes rather than here.
     A park and a return do not take this rule: their copy starts and ends ON
     the deck, which is where inset:0 already puts it. */
  .lp-shove.arriving .lp-disc { left: 200%; right: auto; width: 100%; }
  /* A park and a return use neither of those two rules, and the omission is the
     whole of what they are. There is one copy and it is left where inset:0 puts
     it - ON the deck - because a record being taken off starts there and the
     same record coming back ends there, where the offsets above are for records
     that are somewhere else at one end of their travel. Both are driven on the
     carriage exactly as the other two are, and both are the same three moves in
     opposite orders: off the pin, PARK per cent of a window sideways, stop. */
  /* --- the deck with no record on it --------------------------------------
     A page that has just opened used to show a grey record, and a grey record is
     a claim: it says a record is on the deck and is not playing, which is not
     what is true of a station nobody has pressed play on yet. What is true is
     that there is a turntable and nothing is on it. The owner of the page put it
     in one line - there is no grey record, there is only the place where you put
     the record - and this is that place.

     It is a recess and a spindle pin, and nothing else. The bowl is darker than
     the button's own face and carries an inner shadow at the top and a hairline
     of light at the bottom, which is what a dish lit from above does and is the
     whole of why it reads as a hole rather than as a black circle. The pin is
     exactly --hole across, because it is the thing the hole is punched for; a
     pin that did not match the hole would be a pin no record on this page could
     be put on.

     The play triangle sits here too. It used to be the same glyph at the same
     size with the same centring correction as the one printed on the paper, and
     it is not any more - see the cue below for what paid for that and what it
     bought. What has not changed is why the pin is written after it and given a
     position of its own: a spindle stands proud of whatever is drawn on the
     platter, exactly as the hole is punched through whatever is printed on the
     paper, and the rule that makes one work makes the other.

     Four states this has to keep apart, and they are kept apart by what is
     drawn rather than by how brightly:

       empty and pressable    the recess unlit, the pin, and the triangle
       empty and not          the recess unlit and the pin, and no triangle
       a record on its way    the recess LIT, the pin, and the triangle
       a record on the deck   none of this; the disc covers it

     The second is a station that is not answering, and it must not be the
     first one with the lights turned down. So the triangle is not dimmed there,
     it is absent: an empty deck with no cue on it is a deck there is no point
     pressing, which is exactly the fact. The button's own disabled fade is still
     underneath and says the same thing again in the way the rest of the page
     says it.

     It is shown for the park and the return as well, and that is not a second
     job: a record standing beside the deck, or coming back to it, leaves this
     same platter with its pin in it rather than a plain black hole. It is NOT
     shown for a change of record any more, and that is the one line of this
     sheet the slide-over changed the most. A change used to open a window in
     the middle of itself - the old record off, the next one not yet here - and
     this deck was what stood in it. The new record now comes in over the old
     one, so there is no such window and this stays covered from the first frame
     of a change to the last.

     The third state is new and it is what the press now buys. The press used to
     take the triangle away and put nothing in its place - the only thing that
     changed on screen was a symbol going missing, which is the one edit that
     cannot mean "heard you". The deck lights instead. It is a lamp over the
     platter coming on, which is what a deck does when it is asked for a record,
     and it leaves everything that was on the button still on it.

     What "lit" is, is a brighter dish and nothing else: no colour of its own, no
     second light source, no glow outside the recess. Everything on this button
     is lit by one lamp from above - the dish's own inner shadow at the top and
     hairline at the bottom, the pin's highlight at 45%/35%, the glint's conic -
     and a light that arrived from anywhere else would break the one agreement
     the whole drawing rests on. So the same lamp is simply turned up: the bowl
     rises about two and a half stops, the hairline along the bottom of the dish
     that reads as its far wall gets the same lift, and the rim goes from a fifth
     of a level to two. The play cue is lit by it too, because it is printed on
     the platter and not floating over it.

     The transition is on .lp-well rather than on the class that lights it, so it
     fades both ways off one declaration. 260ms is the number: it has to be
     slower than a redraw or the press reads as the page repainting rather than
     as something switching on, and it has to be finished well inside the 420ms
     the record spends travelling, or the lamp is still coming up when the record
     is already over it. It is a transition and not an animation, so the blanket
     rule at the foot of this sheet kills it under reduced motion and leaves the
     lit state itself standing - which is the right half to lose. */
  .lp-well {
    position: absolute; inset: 0; border-radius: 50%; visibility: hidden;
    display: grid; grid-template: 1fr / 1fr;
    justify-items: center; align-items: center; line-height: 1;
    background: radial-gradient(circle closest-side at 50% 38%,
                                #08080c 0 46%, #101017 84%, #06060a 100%);
    box-shadow: inset 0 7px 11px -2px rgba(0,0,0,1),
                inset 0 -4px 7px -3px rgba(255,255,255,.16),
                inset 0 0 0 1px rgba(255,255,255,.05);
    transition: background 260ms ease, box-shadow 260ms ease;
  }
  button.play.empty .lp-well, button.play.away .lp-well { visibility: visible; }
  /* `away` and not `shoving`, and the difference is this round's. It used to be
     any carriage at all, because every carriage meant a record off the pin: a
     change took one off and the deck stood empty in the middle of it. A change
     no longer does - the new record slides in over the old one and there is a
     record under the pin the whole way - so the two moves that DO leave the
     deck bare are named instead. `away` is the park and the return, set by the
     script when a record is standing beside the deck or on its way back from
     there, and `empty` is a deck this session has not put a record on yet. */
  /* The deck used to brighten while a record was on its way. It does not any
     more, and the reason is worth keeping: the record MOVING is the
     acknowledgement of the press. A light as well is two things saying one
     thing, and the brighter dish pulled the eye to the middle of the window at
     exactly the moment the interesting object was entering from the side.

     So the well is lit exactly the same whether a record is moving, parked or
     absent. What changes is only whether it is VISIBLE, which is the rule above,
     and that is not lighting - it is whether there is a record over it. */
  /* No light on an empty deck. The glint is a lamp catching the smooth face of a
     record, and there is no record here to catch it - drawn over the recess it
     is a wedge of light on nothing, which is the one thing on this button that
     has ever read as a rendering fault rather than as an object.

     It is off while any carriage is on the button, and the reason for that has
     changed with the mechanism. It used to be that the middle of a change was
     an empty deck. There is now a record under the pin for the whole of a
     change - so what would be wrong is different: the glint does not turn with
     the platter, it is a lamp fixed to the room, and a fixed highlight lying
     across a record that is sliding under it reads as light painted on the
     window rather than as light falling on a record. It comes back when the
     record is down and nothing is moving over it. */
  button.play.empty .lp-glint, button.play.shoving .lp-glint { visibility: hidden; }
  /* The real disc is hidden for the three moves where it is not what a listener
     should be looking at: an empty deck has no record, and a park and a return
     have one that is somewhere else and is being drawn by a copy standing over
     its place. A CHANGE is the case that is not in this list, and that is the
     whole of the slide-over: the real disc stays visible and IS the outgoing
     record, so the incoming copy has something to slide over and there is
     nothing to hand back at the end. */
  button.play.empty > .lp-disc, button.play.away > .lp-disc { visibility: hidden; }
  /* The cue, and it is no longer the control's own symbol at the control's own
     size. What it was for was written down two rounds ago: the same glyph at the
     same size in the same place as the one printed on the paper, so that nothing
     moved when a record landed over it. That was worth a great deal while the
     disc simply became visible where the cue had been - two symbols compared at
     one set of coordinates, where a pixel of difference reads as a jump. The
     record is carried in from the side now and lowered onto the pin, so what
     happens to the cue is that a record passes over it. Nothing is compared,
     because the two are never in the same place at the same time, and the
     constraint went with the mechanism that needed it.

     What decides the size instead is the thing the owner of this page asked for
     in one line: the deck has a short three-dimensional tube standing in the
     middle of the play symbol, and the symbol should be bigger so that effect
     can be enjoyed. So this is the one glyph on the button drawn to show the
     pin off rather than to be pressed, and the pin is what sets it. The pin is
     --hole across and cannot grow with it - it is the thing the record's hole
     goes over, and a pin that did not match that hole would be a pin nothing on
     this page could be put on - so the white round it inside the ink is bought
     entirely by the triangle. Every figure here is measured off the rendered
     button on a sixteen-times raster WITH THE PIN HIDDEN, because the pin is
     grey on white and any threshold that separates ink from dish also separates
     ink from pin: masking it out by radius instead makes the mask decide the
     answer, which is how a first pass reported a 1.50px clearance that was
     nothing but the radius it had been told to exclude.

     At --ctl the triangle inks 14.25 x 15.94px, the nearest edge of the ink is
     4.18px from the centre the pin stands on, and the pin takes 2.31px of that:
     1.87px of white, well under half the pin's own diameter, which is a post in
     a tight collar. At --cue the same glyph inks 31.50 x 35.19px, the nearest
     edge is 10.33px out, and the white is 8.03px - better than a pin's width on
     every side. The pin does not get bigger; it gets room, which is what was
     missing. (1.87 rather than the 2.35px this file records for --ctl is layout
     phase and not a disagreement: the vertical clearance moves with where the
     button lands on the page, this was read on a taller page than that one was,
     and the symbol's own paragraph gives the 1.90 to 2.33px spread.)

     45px is where that stops and the record is what stops it. When the record
     lands, its paper label covers 42 per cent of the disc, a radius of 23.52px
     about the same centre this triangle is drawn about. The ink's furthest
     corner from the pin measures 21.16px, so the whole cue is covered by PAPER
     rather than by black vinyl, with 2.36px in hand. That is a real relationship
     rather than a round number: the mark on the platter is inside the mark the
     record carries, and one lands on the other. 50px was rendered as well and
     puts that corner at 23.47px, which is the paper's own edge to five
     hundredths of a pixel - a cue exactly as large as the label it waits for,
     where any layout phase at all lands a corner out on the vinyl. It buys
     0.90px of white round the pin for that, which is not what the trade is
     about: the pin has had enough room since about forty.

     IT IS NOT A GLYPH ANY MORE, and that is the whole of this round. It was
     U+25B6 set at --cue with a horizontal correction of .1211em, and that
     number was the distance from the bounding box centre of THIS machine's
     Arial triangle to its centroid, read off a rendered button. A device with
     other fonts draws another triangle - another width, another height, another
     centroid - and .1211em then puts the pin somewhere that is not the middle
     of the shape. That is what was reported from Android, where the pin sits
     visibly off the centre of the cue, and it is not reproducible here at all:
     headless Chrome on this machine uses this machine's fonts, so the correction
     measures right however wrong it is elsewhere. No value of that number can be
     the right one on every device, because it is a measurement of a typeface and
     the typeface is not ours.

     So the shape is ours: one SVG path, no font consulted. The ink is the ink
     the font drew at --cue, kept so that nothing on screen moved - .700em by
     .782em is 31.50 x 35.19px at 45px, which is the size every figure above is
     about, and the rendered path measures 31.49 x 35.19 against the glyph's
     31.44 x 35.19. What changed is where the numbers come from, not what they
     are.

     THERE IS NO CORRECTION ANY MORE. The centroid argument is not gone - it is
     in the path. A right pointing triangle's visual centre is a third of the
     way from base to apex where its box's centre is half way, so instead of
     drawing the triangle in a box its own size and then shifting the box by the
     difference, the viewBox is a THIRD WIDER than the triangle and the triangle
     is drawn against its right edge. 250, 1000: the base stands at a quarter of
     the width, the apex at the right edge, and the centroid - 250 + 750/3 - is
     500, the exact middle of the box. The box is centred in the well by the
     grid, the pin is centred in the same cell, and so the pin is on the
     centroid by construction rather than by measurement. Nothing here is a
     number read off a raster and nothing travels with a typeface.

     It is written that way rather than as one sixth of a translate, and that
     was measured rather than preferred. The translate form was drawn first -
     transform: translate(16.6667%, 0) on a box the size of the ink, which is
     the same geometry said the other way - and it puts the ink between 0.13 and
     0.25px LEFT of the pin, at deviceScaleFactor 1, 2, 3 and 4, growing with
     the scale. A plain div given the same box and the same translate lands
     exactly, so it is the transform on an SVG element and not the arithmetic.
     With the offset in the viewBox instead the same measurement reads -0.003,
     -0.004, -0.003 and -0.006px at the same four scales: on the pin to within a
     two-hundredth of a pixel everywhere, which is what this round was for.

     The vertical correction is gone rather than carried over. .0087em existed
     because text ink snaps to whole device pixels while the painted hole does
     not, so the two could never be lined up and the number only chose which
     phases landed where - the paragraph over the two transforms still has that
     argument, and it still applies to the glyph printed on the paper, which is
     still a glyph. A triangle with a vertical base has its centroid at half its
     height, and the viewBox puts that at the middle of the box on that axis
     too, so the same construction answers both and there is nothing left to
     nudge.

     Two states, and the second is the whole of what the press changes here. The
     cue is shown on an empty deck that can be pressed, as it always was, and it
     is now ALSO shown for the whole of an arrival - which is a deck being lit
     with a record on its way onto it, and the play cue printed on that platter
     is still true right up to the moment the record covers it. It is not shown
     during a change of record, and since the slide-over there is nothing to
     decide: a change never uncovers the deck at all, so the well and the cue
     printed in it are behind a record from the first frame to the last. The
     selectors below say the same thing twice over - a change leaves the button
     neither `empty` nor `parked` nor `arriving`.

     Three states now, and the third is a record parked beside the deck rather
     than on it. This triangle is what a paused control shows, and it is the
     only symbol in the window while it is paused: the paper goes on carrying
     the pause bars, because a record on this deck carries them from the moment
     it starts moving until the moment it leaves, and the park takes that paper
     clear of the window so the two are never both on screen. Nothing pops,
     because the cue is uncovered BY the record sliding off it rather than
     switched on afterwards. The measurement that makes that work is in PARK, in
     the script: the record's trailing edge stops 13.21px short of the nearest
     ink of this glyph, so neither is ever half drawn.

     Absent when the station is not there, exactly as it is on an empty deck and
     for the same reason: a deck there is no point pressing should not be the
     pressable one with the lights turned down. That is what keeps a parked deck
     on a dead station from reading as a parked deck on a live one. */
  .lp-cue { grid-area: 1 / 1; display: block; visibility: hidden;
            width: calc(var(--cue) * .700 * 4 / 3); height: calc(var(--cue) * .782);
            color: rgba(255,255,255,.46);
            transition: color 260ms ease; }
  button.play.empty:not(:disabled):not(.shoving) .lp-cue,
  button.play.parked:not(:disabled) .lp-cue,
  button.play.arriving .lp-cue { visibility: visible; }
  /* Left at its resting weight during an arrival for the same reason the well
     is: nothing about the press should light up. It is covered by the record
     within a second anyway. */
  /* Metal, not a light. A first pass drew this bright enough that it read as a
     bead or a lamp rather than as a post, and on an empty deck it was the only
     lit thing on the button, which is a great deal of attention for the one part
     of a turntable nobody looks at. Dulled until it reads as what it is: a short
     steel pin catching the same lamp everything else on this button is lit by,
     with the shadow it casts on the platter around it.

     The dark ring round it is the same device the spindle hole uses on the paper
     and it is here for the same reason. The play cue is printed around this pin
     exactly as the symbol is printed around the hole, and grey metal inside grey
     ink reads as a bead ON the triangle rather than as a post standing through
     it - which is a version of the mistake this file lost a whole round to on
     the label. One pixel of black separates them and the shape resolves. */
  .lp-pin { grid-area: 1 / 1; position: relative;
            width: var(--hole); height: var(--hole); border-radius: 50%;
            background: var(--pin);
            box-shadow: 0 0 0 1px rgba(0,0,0,.85), 0 1px 2px rgba(0,0,0,.7); }
  /* The highlight is light landing on the record, not something printed on it. A
     specular reflection comes from a lamp somewhere in the room and a lamp does
     not go round with the turntable, so the streak has to stay where it is while
     the vinyl passes underneath. That is the whole of this element's job, and it
     is why the glint is no longer one of the disc's own background layers, where
     the same transform that turned the grooves turned the light as well and made
     the spin read as a texture rotating rather than as a record catching the
     light. Nothing here animates, so there is nothing here to freeze: the
     highlight is in the same place at every angle, in every state, and while the
     record is stopped, which is what a lamp that is not moving does.

     It is a span rather than a pseudo-element because both of the button's are
     effectively spoken for. ::after carries the loading ring. ::before is painted
     before the element's children rather than after them, so a glint put there
     would sit underneath the disc instead of on it and would need a z-index to
     climb out, which would then have to be answered by a second z-index on the
     ring to keep the ring on top of the light. One element written after the disc
     lands above the disc and below the ring by tree order alone and needs
     neither. It takes no pointer events, because the control is the whole button
     and not any part of it, and it is hidden from the accessibility tree for the
     same reason the disc is.

     The mask keeps the light off the paper. A label is matte and takes no
     specular sheen, and the shape of this particular highlight settles the
     argument on its own: it is a conic wedge, so it narrows as it approaches the
     middle, and any of it allowed over the label reads as a beam aimed at the
     spindle hole rather than as a sheen across paper. A version at a third of the
     strength was rendered and it still draws that line. Thirty-five per cent
     is the label's share of the diameter once more, so the light stops exactly
     where the paper starts, and it moved outward this round by exactly what the
     paper moved outward by, for no reason other than that the paper did. The mask is declared
     twice because Safari wanted the prefix
     until 15.4 and this page is public; a browser that honours neither gets the
     highlight across the label, which is wrong but is not broken. */
  .lp-glint {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 250deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.34) 15deg,
                               rgba(255,255,255,.08) 29deg, rgba(255,255,255,0) 44deg,
                               rgba(255,255,255,0) 360deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 0 42%, #000 43%);
    mask-image: radial-gradient(circle closest-side, transparent 0 42%, #000 43%);
  }
  /* The lip. A pressed record is not flat at its edge: there is a raised smooth
     rim outside the last groove, and being smooth it is the one part of the black
     face that returns a specular reflection rather than scattering it, which is
     why the edge of a record catches the light in a way the playing surface never
     does. That is the thing being drawn here, and it decides where it belongs.
     Light that comes from a lamp in the room does not turn with the turntable, so
     the lip's highlight has to sit still while the vinyl passes under it, exactly
     as the glint above does, and it lives on the glint for that reason rather than
     on the disc. It is brightest at 265 degrees because that is where the glint is
     brightest: the glint's conic starts at 250 and reaches its peak fifteen degrees
     later, and this one starts at 85 and reaches its own peak half a turn later, so
     the same number is arrived at from the other side of the circle rather than
     being copied. Two lights on one record pointing in two directions is the single
     thing that would give the whole illusion away.

     The texture is in the shape of the arc rather than in a pattern laid over it.
     A repeating conic gradient was tried first, which is the obvious way to write
     texture that turns with the surface, and it was measured rather than admired:
     at forty-eight and at ninety-six cells around the circumference the phase of
     the ripple did not move with the disc at all through a whole revolution,
     because a cell is then two to five pixels wide on a band two pixels tall and
     what survives the raster is its own beat against the pixel grid and not
     anything that was drawn. At twenty-four cells it does genuinely turn, and it
     turns as a ring of visible dashes, which is a worse thing to have than a plain
     rim. So the variation is written into the conic itself as a main lobe with
     several lesser ones around it, which is what an edge that is not polished under
     a room that is not one point light actually looks like, and it varies over tens
     of degrees rather than over three, which is a rate two pixels can hold.

     The mask is what makes this a lip rather than a wash over the whole face: it
     opens at ninety-five and a half per cent of the radius, is fully open across
     the crest, and closes again at the rim so the outermost half pixel, which is
     already being shared with the button's antialiased edge, is not asked to carry
     a hard bright line. It is declared prefixed and unprefixed for the same reason
     the glint's own mask is. Nothing here animates, so there is nothing here to
     freeze, and the lip is in the same place at every angle and in every state. */
  .lp-glint::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 85deg, rgba(255,255,255,.03) 0deg, rgba(255,255,255,.055) 38deg,
                               rgba(255,255,255,.03) 72deg, rgba(255,255,255,.10) 104deg,
                               rgba(255,255,255,.07) 131deg, rgba(255,255,255,.34) 180deg,
                               rgba(255,255,255,.17) 203deg, rgba(255,255,255,.24) 222deg,
                               rgba(255,255,255,.08) 258deg, rgba(255,255,255,.115) 292deg,
                               rgba(255,255,255,.04) 325deg, rgba(255,255,255,.03) 360deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 0 95.5%, #000 97% 99.3%, transparent 100%);
    mask-image: radial-gradient(circle closest-side, transparent 0 95.5%, #000 97% 99.3%, transparent 100%);
  }
  /* The paper label. There is no word on it any more, and losing the word is the
     point of this pressing rather than a consequence of shrinking it. PLAY and
     PAUSE were the only English anywhere in this interface. A triangle pointing
     right and two upright bars are read the same way by someone who has never met
     an English word, the station is on the open internet, and this button is the
     one control it has, so the word was costing a reader in another language the
     whole of the control and buying a reader in this one nothing the symbol was
     not already saying. What it cost is easy to state and what it bought is not,
     which is the shape of an argument that ends in a deletion.

     Losing it does not shrink the paper by anything like the width of a word, and
     what moved the paper since is a different thing altogether: the symbol is
     printed around the spindle hole now instead of hanging below it. The label is a
     circle centred on that hole either way, so what sets its radius is how far the
     furthest corner of the symbol reaches from the centre. Stacked below the hole
     that corner was the lower outer end of the pause bars, 22.10px out, and the
     paper had to be fifty-seven and a half per cent of the diameter to cover it.
     Centred on the hole it is the upper outer end of the same bars, and that is the
     number this round moved: the bars are set wider apart so the spindle hole has
     red on either side of it and they are set larger so the symbol still dominates
     the paper, and the corner goes from 10.73px out to 12.52px. The label follows
     it out from thirty and a half per cent of the diameter to thirty-five, which is
     that reach plus 2.17px of red - a tenth of a pixel more than the 2.07px the
     last two pressings both carried, which is as near as thirty-five per cent lands
     to it and nearer than any rounder number does. The paper can only grow into the
     grooves, and one ring is what it took.

     That is the arithmetic of an eighty-four pixel pressing and it no longer runs.
     Once the disc went to a hundred and twelve and the control stayed where it was,
     the paper stopped being cut to the symbol's reach: it is 23.52px of radius
     against a corner that has since gone out to 13.31px, so the forty-two per cent
     below is a fraction of the disc and not a fit to the ink any more. The three
     places that forty-two appears still have to move together - they are about
     where the paper's edge is, and the run-out and the glint have to meet it - but
     the symbol no longer has a vote in what it is. The bars were free to move out
     this round for exactly that reason.

     One row rather than three, and the spindle hole is still the reason there is a
     grid here at all rather than a stacked column. Both children are placed in the
     same single cell and centred in it, so each is centred on the label and
     therefore on the disc, and the hole cannot leave the middle whatever size the
     symbol is set to. That is what the three rows were for as well; they were the
     answer to the same question asked of a symbol that had to sit somewhere else,
     and with the symbol on the centre too there is nothing left for an empty row to
     hold apart. The minmax(0, 1fr) they were written with goes with them. It was
     there because a track written 1fr may not be smaller than its own contents, and
     the pause symbol's line box was 0.07px taller than the row it had to fit in, so
     the bottom row would quietly steal that 0.07px from the empty top one and carry
     the hole off centre with it; a single cell has no neighbour to steal from and
     cannot fail that way. Measured off the rendered raster the hole is within a
     hundredth of a pixel of the centre of the disc in both states, and it has to
     be: a hole that is off centre orbits visibly the moment the record turns, and
     it is the one thing on a record nobody can look past.

     An earlier pressing put the hole and the triangle concentric, found that a hole
     punched through a triangle reads as a triangle with a bite out of it, and
     stacked them instead. That was true of the drawing it was made from and not of
     the arrangement in general, and the two things it missed are both measurable.
     The first is that the hole was being put at the triangle's bounding box centre,
     and on the pressing that argument was made from the triangle's inradius about
     that point - the distance from it to the nearest edge of the ink - was 1.99px,
     which is less than the 2.73px radius of the hole then in use. The hole was not
     sitting in the triangle at all; it was crossing its edge, and a bite is exactly
     what that draws. A right pointing triangle's visual centre is not the middle of
     its box but its centroid, a third of the way from base to apex, and about the
     centroid the clearance on the triangle drawn here measures 4.36 to 4.81px. The
     second is that the hole was wider than it had to be. At 4.61px across it leaves
     2.35px of white all the way round at the tightest point, and
     at true size that reads as a spindle hole showing through printed label art,
     which is what it is. That white was 1.80px two rounds ago and the triangle has
     grown twice while the hole has not, which is the whole of the difference. A
     hole of 5.21px was rendered against the
     smaller triangle and thinned the white to about a pixel, which was enough to
     make it look eaten; the same hole against this one would leave over two, so
     what that test established was a ratio between hole and triangle and not a
     width in pixels.

     The pause state asks for none of that argument, because a spindle hole falling
     in the gap between two upright bars is where a spindle shows on any real label.
     It does ask for the bars to be set a good deal further apart than the font sets
     them: at the size they are drawn the font's own gap is 4.06px and the hole is
     4.61px, so left alone the hole would rest on both bars at once rather than
     between them.

     A gap of 7.50px was where that landed for two rounds, and it was not enough.
     It left 1.51px of red on either side - the same at every layout phase, which is
     the one mercy of a measurement that comes out of letter-spacing rather than out
     of where the button lands - and at true size a pixel and a half of
     red between a dark hole and a white bar does not read as three things with two
     gaps; it reads as one accidental stripe across the middle of the label, which
     is exactly what an owner of this page said when he first looked at it. The
     letter-spacing below opens the gap to 9.50px instead, leaving 2.45px of red
     each side, and the two ways of getting there are worth setting down because
     only one of them was taken.

     The other was to let the hole BITE the bars - to pull them in until the hole
     crosses the ink and reads as punched through it rather than fitted between it,
     which is a real thing a spindle does to label art. It was rejected on three
     counts. It is not available at a usable depth: reaching the ink at all means a
     gap under the hole's own 4.61px, which is below the 4.06px the font already
     sets, and the deepest bite that leaves a recognisable pause glyph takes about
     half a pixel out of a six pixel bar - a nick, which reads as a rendering fault
     and not as a punch. This file has already lost that argument once in the other
     state, twenty lines up: a hole punched through a triangle read as a triangle
     with a bite out of it. And it would make the two states disagree about what the
     hole is, floating clear in one and cutting in the other, when it is one hole
     that never moves and the symbol is what changes around it.

     Red between is also what a record looks like. Label art is laid out AROUND the
     spindle, because the hole is punched before the sleeve ever sees it; ink that
     ran into the hole would be ink the press was going to destroy. Two bars either
     side of a bare spindle is a real label. A bar with a bite in it is a misprint.

     What the wider gap costs is nothing this time. It carries the bars outward, and
     at eighty-four pixels the paper had to follow them and the grooves paid for the
     paper - which is why the gap stopped at 7.50px in the first place. At a hundred
     and twelve the paper is already 23.52px and the ink's furthest corner only
     13.31px, so the bars move out into red the record already had. Ten pixels of it
     are still there afterwards.

     The hairline round the paper is --lp divided by EIGHTY-FOUR, which is the
     diameter it was cut at and not the diameter it is drawn at now: one pixel on
     an eighty-four pixel pressing, and 1.33px on the hundred and twelve this is
     set to. That is the formula doing what it was written to do rather than
     drifting - a hairline that stayed at one pixel while the record grew by a
     third would read as a finer line on a bigger object, which is not what a cut
     paper edge does. Divide by the current diameter instead and it would be
     pinned at a pixel for ever, which is the version this deliberately is not. */
  .lp-label {
    width: calc(var(--lp) * .42); height: calc(var(--lp) * .42); border-radius: 50%;
    display: grid; grid-template: 1fr / 1fr;
    justify-items: center; align-items: center;
    line-height: 1; color: #fff4ef;
    background: radial-gradient(circle closest-side, #e02a3e 0 58%, #c4142a 100%);
    box-shadow: 0 0 0 calc(var(--lp) / 84) rgba(0,0,0,.5);
  }
  /* A hole, not a dot: it takes the colour of the panel behind the button rather
     than a dark grey of its own, so it reads as the page showing through. It is
     4.61px across where it used to be 5.45px, and that pixel was not given up for
     looks. It is the width at which the hole still fits between the pause bars
     without the bars having to be pushed so far apart that the label grows further
     than the grooves can pay for, and it is the one measurement this round was not
     allowed to touch: the whole of the change is the symbol growing around a hole
     that stayed where it was and stayed the size it was, and a hole that grew with
     the symbol would have bought no clearance at all. What that fixed width now
     leaves is 2.35px of white all round it inside the triangle and 2.48px of red
     on either side of it between the bars, both measured on a sixteen-times
     raster at the phase the page loads at - near enough the same margin whichever
     symbol is printed round it, where two rounds ago the pause got barely half
     what the play did.

     Those two margins do not have to be equal to read as equal, and in neither
     theme do they. Measured off the rendered button, in the dark theme the hole's
     edge against the triangle is a step of 227 levels of luminance and its edge
     against the paper is a step of 63 - the red gap carries 28 per cent of the
     contrast the white one does, and a low-contrast gap of the same width reads as
     the narrower gap. That is the argument for red being the margin worth spending
     on, and it is the one the pause state got.

     The light theme inverts it exactly, and measures 9 levels against the ink and
     173 against the paper: there the red gap is the strong one and it is the white
     one that has no contrast left to give, which is what the cut edge two
     paragraphs down exists to answer. So no one margin can be the one to widen,
     and the answer is to give both states enough of their own rather than to tune
     either to a ratio.

     It is written last inside the label and given a position of its own so that it
     paints over the symbol, because a spindle hole is punched through whatever is
     printed on the paper and not printed under it. Being written last is not enough
     on its own: the symbol carries a transform, which puts it in the late painting
     pass that positioned elements are painted in, and an ordinary in-flow hole would
     be painted before it and disappear underneath. Giving the hole a position puts
     the two in the same pass, where the one written second wins, and no z-index is
     needed to say so - which is the same argument the glint above is placed by.

     The dark line round the inside of it is the cut edge of the paper, and it had
     to be darkened from a rgba(0,0,0,.45) to a .9 the moment the symbol moved onto
     the hole. In the dark theme the change is invisible, because the hole is filled
     with the panel colour and the panel is darker than the line drawn over it. In
     the light theme the panel is white, and in the play state the hole is now
     surrounded by the white of the triangle rather than by red paper: at .45 the
     two whites met across a grey so faint that the hole read as a smudge on the ink
     rather than as a hole through it, which was rendered before this was changed.
     At .9 the edge carries the whole of the hole in that one case and is not
     noticeable in any of the others, which is what an edge that is a cut rather
     than a shading should do. */
  .lp-hole { grid-area: 1 / 1; position: relative;
             width: var(--hole); height: var(--hole);
             border-radius: 50%; background: var(--panel);
             box-shadow: inset 0 0 0 1px rgba(0,0,0,.9); }
  /* And the post standing in it. The paragraph above is about a hole with
     nothing behind it, which is what this one was until the deck was drawn
     under it: the panel colour reads as the page showing through, and that was
     true of a record floating on a page and is not true of a record on a
     spindle. A record on a spindle has the pin IN its hole. The two are the
     same width - --hole is what .lp-pin is set to, because the hole is punched
     for that pin - so the metal fills the hole exactly, which is the whole
     reason no second measurement is needed here.

     Only the real disc, and the child combinator is what says so rather than a
     class. A disc inside a carriage is a record being CARRIED, and a record
     being carried is held --seat above the deck for the whole of its travel, so
     that it passes over a pin rather than through it. Nothing stands in the
     hole of a record in the air, so the copy keeps the panel colour and the pin
     appears at the instant the carriage is taken off and the real disc is
     uncovered, which is the instant the record is down. The park is the one
     move that never shows it, which is correct: a parked record is standing
     beside the deck with daylight through it.

     A change is the case where the real disc is visible from the start, and
     this rule is what keeps that honest. The record still sounding is on the
     pin and shows the metal in its hole; the one sliding over it is in the air
     and does not; and when the carriage comes off there is only ever the one
     that was on the pin all along.

     Nothing else about the hole changes, and the paragraph above still governs
     all of it: still painted rather than transparent, still written last inside
     the label so it paints over the symbol, still carrying the cut edge of the
     paper as an inset hairline. That hairline now does a second job it was
     already the right shape for - it is the one pixel of black between grey
     metal and the ink around it that .lp-pin's own paragraph says the shape
     needs, and it is the reason the pin in the hole reads as a post through the
     paper rather than as a bead sitting on it. */
  button.play > .lp-disc .lp-hole { background: var(--pin); }
  /* The symbol is the one thing on this button that was not free to be whatever
     the disc had left. It used to be a play triangle fourteen pixels tall, which is
     what a play button looks like everywhere else and which every other measurement
     on the record was once worked back from; it is sixteen now, and what decided
     sixteen was not another icon but the spindle hole. The symbol is printed around
