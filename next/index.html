     that hole, the hole is fixed, and the red between the two is the thing being
     protected, so the symbol is drawn as large as it can be while the pause bars
     still clear the hole by a pixel and a half and the paper that has to cover them
     still costs the grooves only one ring. Fourteen pixels is where that argument
     landed when the symbol first moved onto the hole and nobody had yet looked at
     how little red was left; sixteen is where it lands now that somebody has.

     The paper's half of that argument is over. It was true at eighty-four pixels,
     where the label was cut to the symbol's own reach plus two pixels of red and
     the grooves paid for every pixel the symbol grew by. At a hundred and twelve
     the paper grew and the control did not, so the ink's furthest corner is 13.31px
     out on a paper of 23.52px and there are ten pixels of red beyond it. Nothing
     the symbol does below is paid for by a groove any more, and the ring count is
     untouched by this round. What still binds is the hole, which has not moved and
     is not allowed to.

     It takes two font sizes to get one symbol size: U+25B6 inks 0.783 of its em
     and the pair of U+275A bars inks 0.700 of theirs, so set at a single size the
     bars come out a pixel and a half shorter than the triangle and the pause reads
     as the smaller of the two controls. Set at these two, the ink of both measures
     sixteen pixels tall to the eighth of a pixel the raster can resolve, which is
     the thing being compared. They stay fractions of --lp rather than becoming
     fixed pixels so that the symbol still travels if the record is ever resized,
     even though here it was the symbol that decided the record's size.

     The height is the axis the two symbols share, and it is now the only axis
     either of them is set on. A round of this file stretched the triangle
     horizontally - scaleX(1.2632), out to 18.00px wide against its own 15.94px
     tall - on the argument that the pair of bars it turns into inks 21.38px wide
     at that same height, so the control swapped between a portrait footprint and
     a landscape one with nothing in the resting shape to say which way it would
     go. The argument was sound and the drawing was not. It was rendered, the
     owner of this page looked at it, and the verdict was one line: the elongated
     triangle was a bad idea, use standard play and pause symbols and make sure
     they fit in the red label. So the glyphs are drawn at the proportions the
     font cut them at and nothing here scales either of them. A play triangle is
     the one shape on this page that everybody already knows, and a control built
     so that it needs no words cannot afford to redraw it into something that has
     to be recognised afresh.

     What that costs is written down rather than argued away. The triangle inks
     14.25px wide at 15.94px tall, near enough square to read as square, and the
     bars ink 21.38px at the same height, so the two footprints do differ and the
     resting shape does not forecast the pressed one. That is what a play button
     looks like everywhere else, and it is not a fault of this record.

     It costs the hole a little as well, and that is the part the stretch was
     quietly paying for. A right pointing triangle's clearance about its centroid
     is set by its two slanted edges, and stretching it horizontally laid those
     edges flatter without moving the centroid off the hole, so the white round
     the hole went UP as the triangle widened - by 0.165px, on the round that put
     the stretch in.

     Measured again this round, off the button as the page loads it, on a
     sixteen-times device raster in the dark theme, the unstretched symbol leaves
     2.349px of white between the hole and the nearest edge of the triangle and
     the pause bars leave 2.476px of red. The hole is 4.61px across, the base edge
     was never close to binding either way, and both figures are well over the
     1.51px this file has on record as the width at which a gap stops reading as a
     gap and starts reading as an accident.

     One honest hole in that. The ranges this file quotes for these clearances -
     1.90 to 2.33px unstretched, 2.05 to 2.51px stretched - come from sweeping
     the button through a whole pixel of layout phase, and that sweep was NOT
     reproduced this round. It cannot be done the way the button was captured
     here: at sixteen device pixels to the CSS pixel a sixteenth-pixel shift is a
     whole device pixel, so the glyph and the paper move together and nothing
     snaps against anything - seventeen phases were rendered and all seventeen
     measured identically, which is the instrument reporting its own resolution
     rather than the button holding still. The figures above are therefore ONE
     phase and not the worst one, and if the worst case ever matters again it has
     to be measured on a one-times raster with the sub-pixel position estimated
     off the antialiasing, which is a different instrument from this one. */
  /* --- the two transforms -------------------------------------------------

     The transforms are what put the hole inside the symbol rather than merely near
     it, and they differ between the states because the two shapes do. Horizontally,
     a pair of upright bars is symmetric about that axis, so centring the box centres
     the ink and the only correction wanted is half of the letter-spacing that opens
     the gap: that space is added after the second bar as well as between the two,
     and without the correction it would carry the pair that far to the left of the
     hole. A right pointing triangle is not symmetric about that axis, and its visual
     centre along it is its centroid rather than the middle of its box, a third of
     the way from base to apex and so further right. Both are written in em rather
     than as fractions of --lp, because they are corrections to a glyph and should
     follow the size that glyph is set at, and both are read off a button rendered
     at sixteen times scale rather than taken from the font's published metrics,
     because what is being lined up is where the pixels land.

     The horizontal one is .1211em, and undoing the stretch meant going back to
     that number rather than dividing the stretched one down. While the triangle
     was scaled, the scale multiplied the centroid's offset from the box centre,
     so .1211 x 1.2632 = .1530em was the arithmetic and .1570em was what actually
     measured right - an eighth of a pixel apart, because glyph positions land on
     the raster and geometry does not get the last word. .1570 / 1.2632 lands back
     at .1243em rather than at .1211em, which is that same eighth of a pixel
     travelling in the other direction, and .1211em is the value that was read off
     the unstretched glyph on a rendered button. It is therefore the one to use
     for an unstretched glyph. Both numbers are measurements of this size and of
     no other: if --lp or --ctl is ever changed they are the first things to
     re-read, off the rendered button in both states, never taken from the font's
     metrics or from the shape's own geometry.

     The vertical one is a different animal and this round found out why. It is NOT
     a constant of the design and cannot be made one. Text ink snaps to whole device
     pixels; the spindle hole is a painted box and does not. So the distance between
     them is decided by where the button happens to land on the page, and the button
     lands wherever the lines above it leave it - a track title that wraps moves it.
     Swept through a whole pixel of that layout phase, the ink sits at one of three
     places against the hole, half a pixel apart, and .0087em only chooses WHICH
     three. It cannot close the gap, because moving the glyph by a fraction of a
     pixel just re-labels which phases land where: measured at every sixteenth of a
     pixel of phase, the white inside the triangle averages 2.27px whatever this
     number is, and the whole of the effect is on the spread. .0087em keeps that
     spread at 2.05 to 2.51px, which was measured while the triangle was stretched;
     take the stretch's 0.165px back off and it is the 1.90 to 2.33px the
     unstretched glyph was recorded at before the stretch went in. It is left
     unchanged because the argument it settles is about which phases land where
     and not about the width itself, and because that sweep was not redone this
     round - the paragraph over .lp-sym says why. Values that centre the ink at the commonest phase
     were rendered and rejected for making the worst phase worse - .0300em looks
     perfect on the page as it usually loads and drops to 1.65px when a title wraps.
     The best any value can do for the worst case is 2.09px, so .0087em is within a
     thirtieth of a pixel of the best there is and stays.

     Two things follow that should not be quietly forgotten. The first is that
     2.39px of white was never rendered by anything; it was derived from an ideal
     triangle's inradius rather than measured, which is the one thing every other
     number in this file is not, and the button was drawing between 1.90 and 2.33px.
     The second is that the two symbols snap independently - they are set at
     different sizes, so their line boxes round to different pixels - and at three
     phases in seventeen the ink JUMPS a whole pixel vertically as the state flips.
     That is not caused by anything here and is not fixed by anything here; it was
     already happening, it costs nothing measurable in clearance, and closing it
     would mean giving both symbols one font size and equalising their ink height
     some other way. Written down because it is invisible until it is looked for.

     The red between the hole and the bars has none of this trouble. It comes from
     letter-spacing, which is horizontal, and horizontal glyph placement is not
     snapped: 2.445px at every one of the seventeen phases, to the thousandth. */
  .lp-sym { grid-area: 1 / 1; font-size: var(--ctl);
            transform: translate(.1211em, .0087em); }
  /* Keyed off the glyph rather than off the button, and the copies are what
     forced it. A record travelling onto the deck carries the pause bars
     whatever the button is doing while it travels, and while it travels the
     button is `loading` and not `spinning` - so a selector that asked the
     BUTTON which symbol was printed would set a pair of bars at the triangle's
     size with none of the letter-spacing that opens the gap the spindle hole
     sits in, and the hole would rest on both bars at once. That is the fault
     the 9.50px gap forty lines up was measured to avoid. Whoever writes the
     glyph writes this class with it, which is the only arrangement in which the
     metrics cannot disagree with the ink they were measured for. */
  .lp-sym.bars { font-size: calc(var(--ctl) * 1.1152);
                 letter-spacing: .2348em;
                 transform: translate(.1174em, 0); }
  /* The record is the whole face of the button turning with a symbol printed on
     it, which is a great deal of motion, so under reduced-motion it stops
     outright. It is named here rather than being left to
     the universal animation kill at the foot of this sheet: that rule does reach
     the disc now the disc is a real element, but relying on it would mean relying
     on a rule written for something else. There used to be a thin loading ring
     here too, slowed rather than stopped because an arc can afford it; the record
     was replaced by a line of words under the button, so there is nothing
     left here to slow. */
  @media (prefers-reduced-motion: reduce) {
    .lp-disc { animation: none; }
  }
  /* The counter goes under the button rather than beside it so the row keeps its
     shape on a phone. It used to appear when playback started and vanish when it
     stopped, and the track line inside it used to wait for a title, so the block
     changed both width and height as you played and paused and the whole row
     jumped. Now it is always rendered and always exactly as wide as the button
     above it, which is what makes it steady: the column is given the diameter of
     the record explicitly, so no string this line can hold is able to widen it,
     and the line is centred inside that fixed box. Tabular figures keep the
     digits from shuffling sideways as the seconds turn over, and the placeholder
     occupies the same shape as a real reading so there is no empty box waiting
     to be filled. */
  .deck { flex: none; width: var(--lp);
          display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .clocks { width: 100%; text-align: center; white-space: nowrap;
            font-size: .72rem; color: var(--dim);
            font-variant-numeric: tabular-nums; }
  /* Pinned to the height of the button rather than centred in the row, so
     that the slider stays level with the record whether or not the counter
     underneath it is there. Centring would drop it half the height of the
     counter every time playback started. */
  .vol { flex: 1; align-self: flex-start; height: var(--lp);
         display: flex; align-items: center; gap: 9px; color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .narrator { margin-top: 8px; font-size: .8rem; color: var(--dim); line-height: 1.45; }

  .meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px;
          padding-top: 16px; border-top: 1px solid var(--line); font-size: .76rem; color: var(--dim); }
  .meta b { display: block; color: var(--fg); font-weight: 550; font-size: .88rem; }

  /* guestbook */
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 11px; font: inherit; font-size: .88rem; margin-bottom: 9px;
  }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  /* browsers style autofilled fields themselves - override it */
  input:-webkit-autofill, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    box-shadow: 0 0 0 1000px var(--bg) inset;
  }
  .row { display: flex; gap: 9px; align-items: center; }
  button.send {
    background: var(--accent); color: #06210f; border: 0; border-radius: 9px;
    padding: 9px 18px; font: inherit; font-weight: 600; font-size: .85rem; cursor: pointer;
  }
  button.send:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: .74rem; color: var(--dim); }
  .hp { position: absolute; left: -9999px; }

  .msgs { margin-top: 18px; max-height: 320px; overflow-y: auto; }
  .msg { padding: 10px 0; border-top: 1px solid var(--line); }
  .msg .who { font-size: .82rem; font-weight: 600; }
  .msg .when { font-size: .7rem; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .msg .body { font-size: .88rem; margin: 3px 0 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg .track { font-size: .7rem; color: var(--dim); font-style: italic; overflow-wrap: anywhere; }
  .findrow { display: flex; gap: 16px; justify-content: center; margin: -10px 0 18px; }
  .findrow a, .findrow button { color: var(--dim); background: none; border: 0; padding: 4px;
    cursor: pointer; border-radius: 6px; font: inherit; font-size: .76rem; display: flex;
    align-items: center; text-decoration: none; }
  .findrow a:hover, .findrow button:hover { color: var(--accent); background: rgba(127,127,127,.12); }
  .findrow .done { color: var(--accent); }
  .findrow[hidden] { display: none; }
  /* the like pill reuses button.vote below; this only centres it */
  .likerow { display: flex; justify-content: center; margin: -6px 0 18px; }
  .likerow[hidden] { display: none; }
  /* The tug of war: two buttons with the counter drawn between them. The
     buttons are button.vote again, so the thing you press to move a number
     looks the same here as it does on the heart and in the guestbook.

     One pip per click, filled from the left, with the same count in digits
     beside them. The pips are the picture - how far it has got, how much rope
     is left - and past about four dots a picture stops answering "how many is
     that" without counting five-pixel circles one at a time, which is the
     question the digits take. They are not the two-copies-of-one-number the
     heart was cured of: those sat a hundred pixels apart and were written by
     different lines, and these sit nine pixels apart and are written from
     pullNow and rope in the same pair of statements as the pips, so there is
     no moment in which either of them is the newer. */
  .tugrow { display: flex; justify-content: center; align-items: center; gap: 9px;
            margin: -10px 0 18px; }
  .tugrow[hidden] { display: none; }
  .rope { display: flex; align-items: center; gap: 3px; }
  .rope .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--line);
               transition: background-color .18s ease, opacity .18s ease; }
  .rope .pip.on { background: var(--accent); }
  /* The cool-off after a track change, while the counter refuses every click.
     The pips go faint and both buttons disable themselves, which is the whole
     message: not yet. No word for it and no countdown - a figure ticking down
     would be a second clock on a page that already has one, about a wait of
     five seconds. */
  .rope.cool .pip { opacity: .3; }
  /* The count in digits, beside the pips rather than instead of them. .72rem is
     button.vote's own size, so it stands between the two glyphs at their weight
     instead of reading as a heading over the row, and var(--dim) is the pips'
     UNLIT colour rather than the lit one: it reports the number, it is not a
     thirteenth pip.

     A floor under the width, because the row is centred and so pays for every
     character twice. 12/12 measures 29.34px against 23.13px for 7/12 - four
     tabular digits of 6.22px and a solidus of 4.47px - so with no floor the
     pips would jump 3.11px sideways on the click from 9 to 10 and back again
     on the one that undoes it, which is the click a listener is watching
     hardest. The floor is written in ch rather than in that 29.34px so that it
     follows the font instead of recording the one this stack happens to resolve
     to. 4.74 and not the 4.7186 the division gives, because ch is the advance
     of the ZERO and these figures are tabular, which are a hair wider here -
     6.20px against 6.22px. At 4.72 the box came out 0.05px short of 12/12 and
     the pips still moved, by a sixty-fourth of a pixel. Invisible, but it was
     the whole point of the floor, so it is cleared outright instead.

     Right-aligned in that box so the /12 does not move at all and only the
     column that is really changing changes.

     The fade is the pips' own .18s. It matters that it is theirs and not
     nought: with no transition the digits went out on the frame the class
     landed while the dots took most of a fifth of a second after them, and two
     halves of one object leaving at different times reads as two objects. */
  .tugnum { font-size: .72rem; color: var(--dim); font-variant-numeric: tabular-nums;
            min-width: 4.74ch; text-align: right; transition: opacity .18s ease; }
  /* Faded with the pips during the cool-off, off the one class drawTug already
     toggles and by the pips' own .3 rather than a constant of its own. The
     figure is part of the rope, so it goes out by exactly what the rope goes
     out by and cannot be left looking live over a pair of dead buttons. */
  .rope.cool + .tugnum { opacity: .3; }
  .recent { margin-top: 20px; }
  .recent h3 { font-size: .66rem; letter-spacing: .16em; color: var(--dim);
               font-weight: 500; margin: 0 0 7px; }
  .recent ol { list-style: none; margin: 0; padding: 0; }
  .recent li { font-size: .82rem; color: var(--dim); padding: 4px 0;
               border-bottom: 1px solid var(--line);
               display: flex; gap: 10px; align-items: baseline; }
  .recent li:last-child { border-bottom: 0; }
  .recent li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  /* What a song was liked to, in the mark you press to like one. The heart is
     U+2665, the same character the like button carries when it is filled and
     from the same block, rather than an emoji: an emoji renders in colour and in
     somebody else's design at a size where this list is deliberately quiet, and
     it would be the only coloured thing in a column of grey. The number rides
     beside it with no word of any language between them, which is the standing
     rule for every control and reading on this page.
     Tabular figures because the counts are in a column and a 1 that is narrower
     than a 7 makes a ragged edge out of a straight one. Never wrapped and never
     shrunk: the title gives way, because a title that loses its last word is
     still readable and a count that loses a digit is a different number. */
  /* The vote-off mark, at the likes' weight rather than louder. It is a fact
     about how a song ended, not a verdict on it, and a row of them shouting
     would make Earlier read as a list of failures. */
  .recent li .k { flex: none; color: var(--dim); font-size: .82em; margin-left: 6px; }
  .recent li .l { flex: none; font-variant-numeric: tabular-nums;
                  letter-spacing: .04em; white-space: nowrap; }
  /* A host was on the microphone. The same dot, in the same red, that the panel
     and the header already use for that fact, so it needs no word and no
     translation - a listener has seen this mark mean exactly this. It does NOT
     pulse: the pulse says something is happening now, and everything in this
     list is over. Centred rather than on the baseline, because the row is
     baseline-aligned for text and a 7px circle has no baseline to sit on. */
  .recent li .dot { background: var(--air); align-self: center; }
  .empty { font-size: .84rem; color: var(--dim); padding: 12px 0; }
  .privacy { font-size: .7rem; color: var(--dim); margin-top: 9px; line-height: 1.45; }
  .replying { font-size: .78rem; color: var(--dim); margin-bottom: 9px;
              display: flex; gap: 8px; align-items: baseline; }
  .replying b { color: var(--fg); font-weight: 600; }
  .msg.reply { padding-left: 11px; border-left: 2px solid var(--line); border-top: 0; }
  button.link { color: var(--dim); background: none; border: 0; padding: 0;
                font: inherit; font-size: .74rem; cursor: pointer; text-decoration: underline; }
  button.link:hover { color: var(--fg); }
  .msg .foot { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  button.vote { background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 20px; padding: 1px 9px; font: inherit; font-size: .72rem;
    cursor: pointer; line-height: 1.5; }
  button.vote:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.vote:disabled { opacity: .5; cursor: default; }

  footer { margin-top: 16px; display: flex; justify-content: center; align-items: center;
           gap: 8px; font-size: .72rem; }
  footer a, footer .flink { color: var(--dim); text-decoration: none; background: none;
    border: 0; padding: 0; font: inherit; font-size: .72rem; cursor: pointer; }
  footer a:hover, footer .flink:hover { color: var(--fg); }
  footer .sep { color: var(--line); }
  /* the bitrate: plumbing, so it sits down here with the rest of the plumbing */
  footer .quality { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="live" id="live"><span class="dot"></span><span class="lbl" id="lbl">connecting</span></div>
    <h1 id="name">&nbsp;</h1>
    <div class="desc" id="desc">&nbsp;</div>
    <!-- Whoever is broadcasting, in their own words, and only while they
         are. Empty and hidden the rest of the time - a station between
         shows says nothing about shows. -->
  </header>

  <div class="cols">

   <div class="col">
    <!-- player -->
    <div class="panel">
      <div class="np-label" id="npLabel">NOW PLAYING</div>
      <!-- The show, when there is one, IS this panel. It is not a second
           announcement above it: two blocks describing what is on is two
           things to disagree, and during a show they did - the header named
           the host while this named a track that had been paused for an
           hour. -->
      <div class="show" id="showwrap" role="status" hidden>
        <div class="showname"><span class="dot"></span><span id="showname"></span></div>
        <div class="showtitle" id="showtitle" hidden></div>
        <div class="shownote" id="shownote" hidden></div>
      </div>
      <div class="np" id="np">—</div>
      <div class="findrow" id="findrow" hidden>
        <a id="findLink" target="_blank" rel="noopener" title="find this song in the library">♫ find this song</a>
        <button type="button" id="copySong" title="copy a link to this song" aria-label="copy song link">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
      </div>
      <div class="likerow" id="likerow" hidden>
        <button type="button" class="vote" id="likeBtn" title="like this song" aria-label="like this song"><span id="likeHeart">&#9825;</span> <span id="likeCount">0</span></button>
      </div>
      <!-- The tug of war. No words anywhere in it, deliberately: the anchor
           pulls the counter down, the skip glyph pushes it up, and the pips
           between them are the counter. Every one of those is a symbol or a
           countable thing, so there is nothing here to translate - the same
           rule the play button follows. The variation selector on both glyphs
           asks for the text form rather than the colour emoji, so they sit
           beside the hollow heart instead of shouting over it.
           The pips are built by the script, not written here: how many there
           are is the station's number and the page is told it - and so is the
           12 in the reading beside them, for that same reason.
           The digits break none of the rule above them. 7/12 is figures and a
           solidus, which say the one thing they say to a reader of any of the
           languages the words this row refuses would have had to be translated
           into. They are a span of their own rather than a child of .rope
           because showTug lights the pips by walking that element's children by
           index, and anything else living in there would be pip thirteen. -->
      <div class="tugrow" id="tugrow" hidden>
        <button type="button" class="vote" id="tugKeep" title="pull the skip counter back down" aria-label="pull the skip counter back down">&#9875;&#65038;</button>
        <div class="rope" id="rope"></div>
        <span class="tugnum" id="tugNum"></span>
        <button type="button" class="vote" id="tugSkip" title="push the skip counter up" aria-label="push the skip counter up">&#9197;&#65038;</button>
      </div>
      <div class="controls">
        <div class="deck">
          <button class="play empty" id="btn" disabled aria-label="Play or pause"><span class="lp-well" aria-hidden="true"><svg class="lp-cue" viewBox="0 0 1000 838"><path fill="currentColor" d="M250 0 1000 419 250 838Z"/></svg><span class="lp-pin"></span></span><span class="lp-disc" aria-hidden="true"><span class="lp-label"><span class="lp-sym" id="btnsym">▶</span><span class="lp-hole"></span></span></span><span class="lp-glint" aria-hidden="true"></span></button>
          <div class="clocks" id="intotrack">--:-- / --:--</div>
        </div>
        <div class="vol">
          <button type="button" class="sw" id="mute" aria-pressed="false" aria-label="Mute">
            <span id="muteg" aria-hidden="true">🔊</span>
          </button>
          <input type="range" id="vol" min="0" max="100" value="85" aria-label="Volume">
        </div>
      </div>
      <div class="narrator" id="narrator" hidden></div>
      <div class="meta">
        <div>listeners <b id="listeners">–</b></div>
        <div>on air <b id="uptime">–</b></div>
      </div>
    </div>

    <!-- chat -->
    <div class="panel">
      <h2>CHAT</h2>
      <div class="chatlog" id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <div class="chatrow">
          <input type="text" id="nick" maxlength="20" placeholder="nick" required>
          <input type="text" id="say" maxlength="200" placeholder="say something…" required>
          <button type="submit" class="send" id="chatsend">&rarr;</button>
        </div>
      </form>
    </div>
   </div>

    <!-- guestbook -->
    <div class="panel">
      <h2>LEAVE A MESSAGE</h2>
      <div class="replying" id="replying" hidden>
        replying to <b id="replyWho"></b>
        <button type="button" class="link" id="cancelReply">cancel</button>
      </div>
      <form id="form" autocomplete="off">
        <input type="text" id="who" maxlength="40" placeholder="who you claim to be" required>
        <textarea id="text" maxlength="500" placeholder="say something…" required></textarea>
        <input type="text" id="website" class="hp" tabindex="-1" aria-hidden="true">
        <div class="row">
          <button type="submit" class="send" id="send">Send</button>
          <span class="hint" id="hint">stamped with whatever is playing</span>
        </div>
      </form>
      <div class="msgs" id="msgs"><div class="empty">no messages yet</div></div>
    </div>

  </div>

  <div class="recent panel" id="recentWrap" hidden>
    <h3>EARLIER</h3>
    <ol id="recent"></ol>
  </div>

  <footer>
    <a href="/stream" title="open the raw stream in VLC or any audio player">stream</a>
    <span class="sep">&middot;</span>
    <span class="quality" id="bitrate" title="stream quality">&ndash;</span>
    <span class="sep">·</span>
    <button class="flink" id="share">copy link</button>
    <span class="sep">·</span>
    <a href="/host/">i'm a radio host</a>
    <span class="sep">·</span>
    <a href="/next/">try the newest version &rarr;</a>
  </footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio'), btn = $('btn'), vol = $('vol');
  const sym = $('btnsym');
  let lastTitle = null, titleSince = Date.now();
  let stationName = '', stationDesc = '';
  let replyTo = null;   // filename of the message being replied to

  // TWO OWNERS OF ONE FLAG, and the rule between them is not symmetrical: the
  // tug may silence this element, and only the listener may give the sound
  // back. Written the other way round, a track being voted off in the middle
  // of somebody's deliberate silence would turn their radio back on.
  //
  // Kept as a variable rather than remembered across loads, which is what the
  // volume beside it does too. A radio that opens silent is a radio that looks
  // broken, and the argument that saved the switch - that the state is visible
  // on screen - is weaker on a page somebody has just opened and is not yet
  // looking at.
  let userMuted = false;

  // --- the dash on the panel, and who owns taking it off -------------------
  // Two things put a dash where the track name goes - the tug silencing a song
  // it has voted off, and the station going unreachable - and until this
  // existed neither of them owned putting it back. What put it back was
  // settle(), and settle() only has something to say when a NEW title arrived
  // while the change was running: poll() holds a title only `if (title !==
  // lastTitle)`, so a dash written over a track whose name the page had ALREADY
  // shown was permanent, for the rest of that track.
  //
  // Reproduced twice against a station driven on demand, on two paths that end
  // in the same state, and the state is exactly the one the operator
  // photographed - NOW PLAYING at a dash, the counter reset to 0/12, the clock
  // running on the new track, the tug live again:
  //
  //   the two endpoints are polled separately, /status-json.xsl at 8s and
  //   /likes/now at 5s, so icecast can name the incoming track several seconds
  //   before the id turns over. The page claims that title, the CLAIM insurance
  //   settles it because nothing is being held back yet, and the panel is
  //   already showing the song the skip is about to land on when the counter
  //   tops out and blanks it;
  //
  //   and, more simply, a skip onto a track icecast happens to name the same
  //   way as the one it replaced.
  //
  // Nothing was stuck in either. changeUntil, mutedAt, aimTold and the aim all
  // released on time, which is why the tug came back and the counter read
  // 0/12 - the same release ran and had nothing to give the title, because
  // heldTitle was null and the dash was a DOM write nobody was holding.
  //
  // So the dash is a STATE rather than a write. This says the panel is showing
  // one, unblank() is what takes it off, and neither of the two places that
  // blank has to know how the other one is undone.
  let blanked = false;
  function blank() { blanked = true; $('np').textContent = '—'; }
  // Only when the page is not deliberately holding the panel back - the tug's
  // dash has to last the whole silence, and beginChange ends the change it
  // replaces before drawing its own, which reaches settle() with the mute still
  // on. And only when there is a name to go back to: a page that has never had
  // one keeps the dash, which is what a station that has said nothing looks
  // like.
  function unblank() {
    if (blanked && lastTitle !== null && !waiting()) showTitle(lastTitle);
  }

  // The glyph is the state. Zero on the slider draws the crossed speaker even
  // with the switch up, because a slider at nothing IS silence and an icon
  // that said otherwise would be lying about what you can hear.
  const muteBtn = $('mute'), muteGlyph = $('muteg');
  function drawMute() {
    const v = Number(vol.value);
    muteGlyph.textContent =
      (userMuted || v === 0) ? '\uD83D\uDD07'
      : v < 34              ? '\uD83D\uDD08'
      : v < 67              ? '\uD83D\uDD09'
                            : '\uD83D\uDD0A';
    muteBtn.setAttribute('aria-pressed', String(userMuted));
  }

  vol.addEventListener('input', () => { audio.volume = vol.value / 100; drawMute(); });
  audio.volume = vol.value / 100;

  // mutedAt is declared much further down and is in its temporal dead zone
  // until then, so this reads it only from the click - which cannot happen
  // before the page has finished running. At startup neither owner wants
  // silence and the element is simply left alone.
  muteBtn.addEventListener('click', () => {
    userMuted = !userMuted;
    audio.muted = userMuted || mutedAt > 0;
    drawMute();
  });
  drawMute();

  function start() {
    audio.src = '/stream?t=' + Date.now();   // always join live, never a stale buffer
    audio.load();
    // Every press begins audible. The page silences this element on its own
    // account when a skip lands - see topOut - and every path that takes that
    // mute gives it back, but this is the one line that cannot be reasoned
    // around: whatever state the element was left in, the thing a listener asked
    // for by pressing play is sound. unmute() rather than the property, so the
    // bookkeeping goes with it and waiting() cannot be left armed.
    unmute();
    // The clock on this browser filling its buffer starts with the request that
    // fills it, not with the click - see the fill measurement further down. Cold,
    // because this is a new connection and nothing about the old one survives it.
    fillFrom = Date.now();
    fillCold = true;
    return audio.play();
  }
  // One line, always on screen, and only ever about the track. There used to be
  // two counters here and the other one was how long this browser had been
  // listening, which is a private stopwatch nobody asked to see; it was also the
  // wider of the two by a long way, and the row on a phone cannot afford it next
  // to a volume slider. The position and the duration are what a player shows and
  // what the operator sketched, they come from the station rather than from a
  // guess made here, and they are therefore right for someone who arrived in the
  // middle of a song, which a count started at page load never could be.
  //
  // The line is never hidden and never empty. When the station has not said where
  // it is, or has stopped answering, the line says so in the shape of a reading
  // rather than going blank, because a box that empties and refills is exactly
  // the jumping this replaces. A duration of zero is a live input saying it does
  // not know the length, and the honest answer to that is the same placeholder in
  // the second half only - inventing a total would be worse than admitting there
  // is none.
  const NOTIME = '--:--';
  // What the station last said about the track, and when it said it. The
  // reading is the STATION's position; what is drawn is that reading less
  // earLagMs(), because the number this line is for is where the LISTENER is in
  // the song and the station is several seconds ahead of every listener.
  //
  // It was drawn straight, and the size of what that cost is the thing to keep:
  // the record was pressed onto the pin and the clock read 0:10 at the instant
  // it landed, on every change, because the aim lands the record when the ear
  // reaches the boundary and the station is by then ten seconds into the next
  // track. The operator read it as the station mixing between songs. It is not
  // mixing - this station cuts, radio.liq has no crossfade in it - it was one
  // panel showing two different clocks, the title and the record on the
  // listener's and this line on the station's.
  //
  // Taken off continuously and not at the landing, which is the half that is
  // easy to get wrong: an offset applied only when a change ends would leave
  // the clock correct for one frame and jump ten seconds forward on the next
  // ordinary poll. It comes off every tick, so the line reads the listener's
  // position for the whole of every track and simply passes through 0:00 at the
  // moment the record is set down.
  //
  // It is also a free check on the estimate. The clock at the instant of the
  // seat IS the error in earLagMs(), in seconds, on screen: if the aim is right
  // it reads 0:00 there, and anything else is the estimate being wrong by
  // exactly that much and in that direction.
  let trackElapsed = 0, trackTotal = 0, trackAt = null;
  // True means the page is not listening and has stopped fetching.
  let quiet = true;
  // Numbers only. There was briefly a "putting on a new record" here and it was
  // wrong for a reason that has nothing to do with how it read: the button lost
  // its PLAY and PAUSE words on purpose, so that nothing on this control needs
  // translating, and a status line in English puts that straight back. Waiting
  // is said by the record pulsing instead - see the button rules in the sheet.
  //
  //   3:41 / 5:02     playing, and where in the track
  //   --:-- / --:--   anything else
  //
  // Nothing dated either. A timestamp of when the page last heard from the
  // station read as information and was not: what a paused page wants to say
  // is that it is paused, which the placeholder already says.
  function tick() {
    // Two pieces of insurance, both about state that is supposed to be ended by
    // something else and must not be able to stick if that something never
    // fires. The first is a change of record whose animation or timer went
    // missing; the second is a title held for a change that was never begun,
    // which is what a /likes/now that will not answer leaves behind. Half a
    // second of grace on the first so it never races the animation it is
    // insuring. Neither is expected to fire.
    // A fourth was added with the aim: a change BOOKED for a boundary and not
    // yet drawn holds the title back through waiting(), so a booking whose timer
    // never fires would hold it for ever. A second past the moment it was aimed
    // at, the booking is over whether or not anything drew it - which is also
    // the honest answer when a predicted boundary passes and the station never
    // changes track: let go of what was being held and leave the record where
    // it is. It is checked before the change's own deadline because a booking
    // that HAS become a change is that change's business.
    if (aimAt && !changeUntil && Date.now() > aimAt + 1000) endChange(false);
    if (changeUntil && Date.now() > changeUntil + 500) endChange(true);
    else if (heldTitle !== null && !waiting() && Date.now() - heldSince > CLAIM) settle();
    // And a third, about the one piece of state that silences the radio. A mute
    // is taken on the counter reaching the top and let go of when the record
    // that replaces the song is down; if the station never produces that record,
    // the sound has to come back on its own rather than wait for a change that
    // is not coming. Once a change HAS begun its own deadline above owns this.
    if (mutedAt && !changeUntil && Date.now() - mutedAt > MUTE_MAX) unmute();
    // /likes/now answers with elapsed and duration off the frame being played.
    // Carried forward between polls by the wall clock so the seconds move every
    // second rather than in jumps every five.
    $('intotrack').textContent = (quiet || trackAt === null)
      ? NOTIME + ' / ' + NOTIME
      : mmss(trackElapsed + (Date.now() - trackAt) / 1000 - earLagMs() / 1000) +
        ' / ' + (trackTotal > 0 ? mmss(trackTotal) : NOTIME);
    // The tug's cool-off ends between polls, and this is the second hand that
    // already exists. It rides here rather than on a timer of its own for the
    // reason the whole PULSE block exists.
    drawTug();
  }

  // Three states, one place, and the place is still here. 'loading' is set by the
  // press itself and cleared only by sound actually arriving, or by giving up -
  // never on a timer, because a timer would lie in whichever direction the
  // network did not go. What changed is where the state gets written: the label
  // has to turn with the record, so it lives inside the disc, and a
  // pseudo-element could never have held text that this function sets. The symbol
  // is therefore a span addressed by id. While the stream is still coming it is
  // cleared rather than the disc being taken away - a blank pressing with a ring
  // turning over it is the record on the platter and not yet playing, which is
  // exactly what is true at that moment. The aria-label was always the whole
  // accessible name of this button and it is now the only text naming the control
  // anywhere, because the word that used to sit above the symbol has gone; the
  // disc is hidden from assistive technology precisely so that the name never
  // becomes a decoration that happens to be upside down half the time.
  const GLYPH_PLAY = '▶', GLYPH_PAUSE = '❚❚';
  function setBtn(state) {
    btn.classList.toggle('loading', state === 'loading');
    btn.classList.toggle('spinning', state === 'pause');   // the record turns only while sound is coming out
    sym.textContent = state === 'loading' ? '' :
                      state === 'pause'   ? GLYPH_PAUSE : GLYPH_PLAY;
    // The bars are set at their own size with their own gap - see .lp-sym.bars
    // - and the class is written here with the glyph rather than being derived
    // from the state, because the copies the carriage is built from carry the
    // bars while the button says `loading`.
    sym.classList.toggle('bars', state === 'pause');
    btn.setAttribute('aria-label', state === 'loading' ? 'Connecting to the stream' :
                                   state === 'pause'   ? 'Pause' : 'Play');
  }
  // wake()/sleep() are declared at the foot of this file with the rest of the
  // polling; function declarations hoist, so calling them from here is fine.
  btn.addEventListener('click', () => {
    if (audio.paused) {
      setBtn('loading');          // before anything else, on the press itself
      tick();                     // and say so, while no poller is running yet
      // A deck with nothing on it gets a record put on it; a deck with one
      // standing beside it gets that one back. Either way the putting is what
      // fills the wait for the first sound, and it is the same wait and the
      // same arithmetic - only the distance differs, because a parked record
      // never left the window.
      if (btn.classList.contains('empty')) beginArrival('arrive');
      else if (parked) beginArrival('return');
      // A press taken back before the first sound is NOT a failure, and treating
      // it as one disabled this button until the page was reloaded. Stopping
      // calls pause() and load() on the element, which rejects the play promise
      // that is still outstanding - so the listener's own second click arrived
      // here as `could not start`, set disabled, and nothing ever cleared it:
      // wake() only fires on `playing`, and no poller is running before the
      // first sound. Every later click was dead.
      //
      // AbortError is the name the browser gives that exact case - the play was
      // interrupted by a new load request - and it is the one rejection that
      // means the station is fine and the listener changed their mind.
      start().catch(e => {
        setBtn('play');
        if (e && e.name === 'AbortError') return;
        setLive(false, 'could not start');
      });
    } else {
      // sleep() by hand rather than trusting the pause EVENT. pause() only
      // QUEUES that event, and load() on the next statement restarts the media
      // load algorithm in the same tick, which cancels the element's queued
      // events - so it never arrives and the pollers ran on. It looked correct
      // from the outside because setBtn('play') is called right here, so the
      // record showed the play glyph while the page went on fetching: paused,
      // zero listeners, clock still counting.
      //
      // The listener below stays, for every pause this button does not make -
      // the lock screen, a headset button, a stream that drops.
      audio.pause(); audio.removeAttribute('src'); audio.load();
      // park() as well as sleep(), and it is not a duplicate of the one sleep()
      // ends with. sleep() returns early when it finds no pollers running,
      // which is exactly the case for a press taken back before any sound
      // arrived - and that press still has to put the record wherever it
      // belongs. park() is idempotent, so the ordinary pause pays nothing for
      // it. What setBtn writes to the paper is not seen either way: a parked
      // record is a copy, the real disc is hidden under it, and the paper a
      // listener can see goes on carrying the bars.
      setBtn('play'); sleep(); park();
    }
  });

  audio.addEventListener('playing', () => setBtn('pause'));
  audio.addEventListener('pause',   () => setBtn('play'));
  audio.addEventListener('error',   () => { if (audio.paused) setBtn('play'); });

  function setLive(on, label) {
    $('live').className = 'live' + (on ? ' on' : '');
    $('lbl').textContent = label || (on ? 'ON AIR' : 'OFF AIR');
    btn.disabled = !on;
    // A dash while there is no station, and the name back when there is one.
    // The second half is this round's: the station coming back does not change
    // the title, so poll() below has nothing to hold and the panel used to keep
    // the dash for the rest of the track over one failed request.
    if (!on) blank();
    else unblank();
  }

  function fmtUptime(s) {
    if (!s) return '–';
    const secs = Math.max(0, (Date.now() - new Date(s).getTime()) / 1000);
    const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }

  async function poll() {
    try {
      const j = await (await fetch('/status-json.xsl', { cache: 'no-store' })).json();
      let s = j.icestats && j.icestats.source;
      if (!s) return setLive(false);
      if (!Array.isArray(s)) s = [s];
      const src = s.find(x => (x.listenurl || '').endsWith('/stream')) || s[0];
      if (!src) return setLive(false);

      if (src.server_name) { $('name').textContent = src.server_name; document.title = src.server_name; }
      $('desc').textContent = src.server_description || '';
      stationName = src.server_name || '';
      stationDesc = src.server_description || '';
      const title = cleanTitle(src.title || '');
      // The title is no longer written straight to the panel, and this is the
      // half of the change that is easiest to miss. icecast's metadata turns
      // over the instant the station changes track, which is several seconds
      // before that track reaches anybody, so a page that printed it on arrival
      // named a song nobody was hearing yet - the same complaint the record
      // change below is built to answer, in the one place where it is words
      // rather than motion. So a new title is HELD, and it goes up when the new
      // record lands.
      //
      // Which of the two pollers notices a track change first is a race - this
      // one runs on eight seconds and /likes/now on five - so noticing it here
      // asks /likes/now outright rather than waiting for its own turn. That is
      // the poller that knows WHEN, because only it carries the station's
      // position in the track, and it is the one that starts the change of
      // record and therefore the one that will release this. One extra request
      // per track change, on an endpoint already asked twelve times a minute.
      //
      // Nothing is held while the page is not listening. There is no ear to be
      // ahead of, and holding then would mean a page that opens showing nothing
      // until a poller it has not started yet says otherwise.
      if (title !== lastTitle) {
        if (quiet) showTitle(title);
        else if (waiting()) heldTitle = title;
        else if (heldTitle !== title) { heldTitle = title; heldSince = Date.now(); pollLikes(); }
      }
      // On the title being SHOWN rather than the one just read, so the link
      // under the panel points at the song the panel names. Left on every poll
      // rather than moved inside showTitle: it is also the thing that puts the
      // row back after a live show has hidden it.
      updateFind(lastTitle || '');

      $('listeners').textContent = src.listeners ?? '–';
      $('uptime').textContent = fmtUptime(src.stream_start_iso8601 || src.stream_start);
      const br = (src.audio_info || '').match(/bitrate=(\d+)/);
      $('bitrate').textContent = br ? br[1] + ' kbps' : '–';
      // The same number, kept rather than only printed. It is one half of how
      // long icecast's burst lasts in seconds, and therefore of how long the
      // change of record has to cover - see earLagMs.
      if (br) streamKbps = parseInt(br[1], 10) || streamKbps;
      setLive(true);

      setMedia();
    } catch { setLive(false, 'unreachable'); }
  }

  // The lock screen and the headset say what the panel says, which means they
  // say the held title too. Split out so that the moment a held title lands is
  // also the moment the lock screen changes, rather than up to eight seconds
  // later when this poller next comes round.
  function setMedia() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: lastTitle || 'Live', artist: stationName, album: stationDesc
    });
  }

  // The one place the track name is written. Everything that follows from a new
  // title follows from here: the panel, the recents list, the share link and the
  // name the guestbook stamps on a note, which is lastTitle and is therefore now
  // the song the writer was actually hearing when they typed.
  function showTitle(t) {
    // Whatever was on the panel, a name is on it now.
    blanked = false;
    $('np').textContent = t || 'live';
    if (t !== lastTitle) { lastTitle = t; titleSince = Date.now(); noteTrack(t); }
    updateFind(t);
    setMedia();
  }

  // --- guestbook ------------------------------------------------------
  // No application server. The browser PUTs one markdown file per comment
  // and Caddy's webdav module writes it to disk. Reading is a directory
  // listing plus a fetch per file.

  function when(iso) {
    const d = new Date(iso), diff = (Date.now() - d) / 1000;
    if (isNaN(d)) return '';
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return d.toLocaleDateString();
  }

  // minimal front-matter parser: --- key: value --- then the body
  function parseMd(text) {
    const m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) return { name: 'anonymous', at: '', playing: '', text: text.trim() };
    const meta = {};
    for (const line of m[1].split('\n')) {
      const i = line.indexOf(':');
      if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
    return { name: meta.name || 'anonymous', at: meta.at || '',
             playing: meta.track || meta.playing || '',
             atTrack: meta.at_track || '',
             upvotes: parseInt(meta.upvotes || '0', 10) || 0,
             replyTo: meta.reply_to || '',
             file: meta.file || '', raw: text, text: (m[2] || '').trim() };
  }

  async function loadMessages() {
    try {
      const res = await fetch('/messages/', { headers: { accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const files = (await res.json())
        .filter(f => !f.is_dir && f.name.endsWith('.md'))
        .sort((a, b) => b.name.localeCompare(a.name))
        .slice(0, 25);
      const texts = await Promise.all(files.map(f =>
        fetch('/messages/' + encodeURIComponent(f.name), { cache: 'no-store' })
          .then(r => r.ok ? r.text().then(t => ({ t, name: f.name })) : null)
          .catch(() => null)));
      // newest first, on the parsed timestamp rather than the filename
      const msgs = texts.filter(Boolean)
        .map(o => Object.assign(parseMd(o.t), { file: o.name }))
        .sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
      render(msgs);
    } catch { /* leave whatever is shown */ }
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  function msgEl(m, depth) {
    const d = document.createElement('div');
    d.className = 'msg' + (depth ? ' reply' : '');
    if (depth) d.style.marginLeft = (depth * 16) + 'px';

    const who = document.createElement('div'); who.className = 'who';
    who.textContent = m.name;                        // textContent, never innerHTML
    const t = document.createElement('span'); t.className = 'when'; t.textContent = when(m.at);
    who.appendChild(t);

    const body = document.createElement('div'); body.className = 'body'; body.textContent = m.text;
    d.append(who, body);

    if (m.playing) {
      const tr = document.createElement('div'); tr.className = 'track';
      tr.textContent = '\u266a ' + m.playing + (m.atTrack ? '  @ ' + m.atTrack : '');
      d.appendChild(tr);
    }

    const foot = document.createElement('div'); foot.className = 'foot';
    const up = document.createElement('button');
    up.className = 'vote'; up.type = 'button';
    up.textContent = '\u25b2 ' + m.upvotes;
    up.addEventListener('click', () => upvote(m, up));
    const rep = document.createElement('button');
    rep.className = 'link'; rep.type = 'button'; rep.textContent = 'reply';
    rep.addEventListener('click', () => setReply(m));
    foot.append(up, rep);
    d.appendChild(foot);
    return d;
  }

  function render(list) {
    const box = $('msgs');
    box.textContent = '';
    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'no messages yet';
      box.appendChild(e); return;
    }
    // a real tree: a reply can itself be replied to
    const byFile = new Map(list.map(m => [m.file, m]));
    const kids = new Map();
    const roots = [];
    for (const m of list) {
      if (m.replyTo && byFile.has(m.replyTo)) {
        if (!kids.has(m.replyTo)) kids.set(m.replyTo, []);
        kids.get(m.replyTo).push(m);
      } else roots.push(m);
    }
    const MAXDEPTH = 4;
    const seen = new Set();
    function walk(nodes, depth) {
      // children oldest-first; roots stay newest-first
      if (depth > 0) nodes.sort((x, y) => new Date(x.at || 0) - new Date(y.at || 0));
      for (const m of nodes) {
        if (seen.has(m.file)) continue;      // guards against reply cycles
        seen.add(m.file);
        box.appendChild(msgEl(m, Math.min(depth, MAXDEPTH)));
        const ch = kids.get(m.file);
        if (ch && ch.length) walk(ch, depth + 1);
      }
    }
    roots.sort((x, y) => new Date(y.at || 0) - new Date(x.at || 0));
    walk(roots, 0);
  }

  function setReply(m) {
    replyTo = m.file;
    $('replyWho').textContent = m.name || 'anonymous';
    $('replying').hidden = false;
    $('text').focus();
  }
  $('cancelReply').addEventListener('click', () => {
    replyTo = null;
    $('replyWho').textContent = '';
    $('replying').hidden = true;
  });

  // Upvoting is read-modify-write on the file itself. Two people voting at the
  // same second can lose one vote - acceptable for a guestbook, and the only
  // option without server-side code.
  async function upvote(m, btn) {
    if (!m.file) return;
    btn.disabled = true;
    try {
      const cur = await (await fetch('/messages/' + encodeURIComponent(m.file), { cache: 'no-store' })).text();
      let next;
      if (/^upvotes:\s*\d+\s*$/m.test(cur)) {
        next = cur.replace(/^upvotes:\s*(\d+)\s*$/m, (_, n) => 'upvotes: ' + (parseInt(n, 10) + 1));
      } else {
        next = cur.replace(/^---\n/, '---\nupvotes: 1\n');   // older files had no field
      }
      const r = await fetch('/messages/' + encodeURIComponent(m.file), {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: next
      });
      if (r.ok) await loadMessages(); else btn.disabled = false;
    } catch { btn.disabled = false; }
  }

  // strip anything that would break the front matter
  const clean = s => String(s).replace(/[\r\n]+/g, ' ').replace(/^-{3,}$/gm, '').trim();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('text').value.trim().slice(0, 500);
    const name = clean($('who').value).slice(0, 40);
    if (!name) { $('hint').textContent = 'who are you?'; $('who').focus(); return; }
    if (!text) return;
    if ($('website').value) return;                   // honeypot
    $('send').disabled = true;

    const now = new Date();
    const stamp = now.toISOString().replace(/[:.]/g, '');
    const rand  = Math.random().toString(36).slice(2, 8);
    const file  = stamp + '-' + rand + '.md';
    // The station's own position, the same number the clock under the button
    // shows. This used to be measured from when THIS browser first saw the
    // title change, which is the moment the reader arrived rather than the
    // moment the track began - so every note left by someone who tuned in
    // mid-song recorded a position earlier than the one they were actually
    // hearing, and recorded it into a file that is kept. There is no guess to
    // make any more: /likes/now answers with the elapsed time off the frame
    // being played. An empty field when the station has not answered yet,
    // because a blank is honest and a zero is a claim.
    const into  = trackAt === null
      ? ''
      : mmss(trackElapsed + (Date.now() - trackAt) / 1000);

    const md =
      '---\n' +
      'at: ' + now.toISOString() + '\n' +
      'name: ' + name + '\n' +
      'track: ' + clean(lastTitle || '') + '\n' +
      'at_track: ' + into + '\n' +
      'file: ' + file + '\n' +
      'upvotes: 0\n' +
      (replyTo ? 'reply_to: ' + replyTo + String.fromCharCode(10) : '') +
      '---\n\n' + text + '\n';

    try {
      const r = await fetch('/messages/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) {
        $('text').value = ''; $('hint').textContent = 'thanks!';
        replyTo = null; $('replying').hidden = true;
        await loadMessages();
      }
      else { $('hint').textContent = 'could not send (' + r.status + ')'; }
    } catch { $('hint').textContent = 'could not send'; }
    setTimeout(() => { $('hint').textContent = 'stamped with whatever is playing'; }, 4000);
    $('send').disabled = false;
  });

  $('share').addEventListener('click', async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: document.title, url });
      else { await navigator.clipboard.writeText(url); $('share').textContent = 'copied';
             setTimeout(() => $('share').textContent = 'copy link', 1600); }
    } catch {}
  });

  // --- chat -----------------------------------------------------------
  // Same storage trick as the guestbook: one small file per line. Polling
  // only fetches files it has not seen, so steady state is one request.
  const chatSeen = new Set();
  let chatLines = [];

  $('nick').value = localStorage.getItem('radio.nick') || '';

  function renderChat() {
    const log = $('chatlog');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.textContent = '';
    if (!chatLines.length) {
      const q = document.createElement('div');
      q.className = 'line quiet'; q.textContent = 'quiet in here';
      log.appendChild(q);
      return;
    }
    for (const c of chatLines) {
      const d = document.createElement('div'); d.className = 'line';
      const n = document.createElement('span'); n.className = 'nick';
      n.textContent = c.name + ':';
      const b = document.createTextNode(' ' + c.text);
      const t = document.createElement('span'); t.className = 't'; t.textContent = when(c.at);
      d.append(n, b, t);
      log.appendChild(d);
    }
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  async function pollChat() {
    try {
      const res = await fetch('/chat/', { headers: { accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const files = (await res.json())
        .filter(f => !f.is_dir && f.name.endsWith('.md'))
        .sort((a, b) => a.name.localeCompare(b.name))
        .slice(-60);
      const fresh = files.filter(f => !chatSeen.has(f.name));
      if (fresh.length) {
        const got = await Promise.all(fresh.map(f =>
          fetch('/chat/' + encodeURIComponent(f.name), { cache: 'no-store' })
            .then(r => r.ok ? r.text() : null).catch(() => null)));
        got.forEach((t, i) => {
          chatSeen.add(fresh[i].name);
          if (t) chatLines.push(parseMd(t));
        });
        chatLines.sort((a, b) => new Date(a.at || 0) - new Date(b.at || 0));
        chatLines = chatLines.slice(-60);
        renderChat();
      } else if (!chatLines.length) renderChat();
    } catch { /* leave it */ }
  }

  $('chatform').addEventListener('submit', async e => {
    e.preventDefault();
    const nick = clean($('nick').value).slice(0, 20);
    const say  = $('say').value.trim().slice(0, 200);
    if (!nick) { $('nick').focus(); return; }
    if (!say) return;
    localStorage.setItem('radio.nick', nick);
    $('chatsend').disabled = true;
    const now = new Date();
    const file = now.toISOString().replace(/[:.]/g, '') + '-' +
                 Math.random().toString(36).slice(2, 6) + '.md';
    const md = '---' + String.fromCharCode(10) +
               'at: ' + now.toISOString() + String.fromCharCode(10) +
               'name: ' + nick + String.fromCharCode(10) +
               '---' + String.fromCharCode(10) + String.fromCharCode(10) +
               say + String.fromCharCode(10);
    try {
      const r = await fetch('/chat/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) { $('say').value = ''; await pollChat(); }
    } catch { /* ignore */ }
    $('chatsend').disabled = false;
  });


  // --- recently played -------------------------------------------------
  // The list is the STATION's, fetched from /earlier. It used to be this
  // browser's, kept in localStorage, and that is the fault being fixed: a list
  // a browser remembers begins empty for everybody who arrives, so a listener
  // tuning in now was told the station had played nothing - the opposite of
  // what "earlier" means. The station has kept the real record all along.
  //
  // What this page still keeps is the one thing the station cannot: the like
  // readings. /earlier carries no counts and cannot cheaply, because the count
  // for a track goes on moving after the event is written. So the station says
  // WHAT was on and this page decorates only the entries it personally watched
  // go by. A listener who has just opened the page sees history with no
  // figures; one who has been here sees figures on the songs they heard. No
  // count is invented for an entry there is no reading for.
  //
  // localStorage keeps the key `radio.recent` and keeps the entry shape it
  // already holds in every listener's browser - { t, l, u } - because that
  // shape IS a list of like readings; only its job changed. Nothing about the
  // ORDER of the evening is cached any more: a local copy that disagrees with
  // the station is worse than no copy, and if /earlier will not answer the
  // panel keeps the last list it was given rather than inventing one.
  //
  // The count is stamped on the entry as the song rolls OFF, which is the only
  // moment it can be. /likes/now describes what is playing and nothing else, and
  // the ledger behind it is keyed by file path, so there is no way to ask what
  // an old track ended on and no endpoint is being built for one.
  //
  // The number is the LIFETIME total for that file and is meant to be. A song
  // the station has played fifty times carries fifty plays' worth of hearts,
  // which is what the ledger holds and what the heart on the button has always
  // been showing. Nothing is subtracted and no second reading is needed to print
  // it.
  //
  // The arrow beside it is the second fact and it is free. This page sees the
  // count on every poll while a song plays, so it knows what the figure stood at
  // when it first saw the song and what it stood at when the song ended, and
  // whether it moved between the two. What that honestly means is "it gained
  // hearts while I WAS LISTENING", not "it gained hearts this play": a listener
  // who joins two minutes into a song never witnessed the first two minutes of
  // it, and nothing on this page can. It is the only version of the fact a page
  // can hold, it is true of the person reading it, and it must not be repeated
  // anywhere as a claim about the broadcast.
  const RECENT_KEY = 'radio.recent';
  // Readings only. An entry with no count is dropped on the way in: it used to
  // be how the list remembered a song it had no figure for, and the station
  // supplies the song now, so all it would be is a title taking up room.
  let heard = [];
  try {
    heard = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]')
              .filter(e => e && typeof e.t === 'string' && e.l > 0);
  } catch { heard = []; }
  // The station's list exactly as served, newest LAST.
  let earlier = [];
  // The title this page last saw on the panel, so the reading caught while it
  // was playing can be filed under it when it is replaced. It used to be read
  // back off the head of the list; the head of the list is the station's now.
  let prevTitle = '';
  // What the song that has just been replaced stood at, and whether it moved
  // while this page was watching. null rather than zero when there is nothing to
  // stamp: the first title of a session is not a track change, and stamping a
  // zero on it would erase a real count left in localStorage by the session
  // before.
  let rollLikes = null, rollUp = false;

  // The station's four kinds, folded into rows. Two of them are not rows:
  //
  //   track  a row. The title.
  //   voted  NOT a row of its own. A vote-off is how a track ENDED, not a
  //          separate thing that happened, and a line saying a song was taken
  //          off with no song beside it says nothing. It lands on the track row
  //          it names, as the skip glyph off the tug - which is what this page
  //          already did for the vote-offs it saw itself. The station writes it
  //          between that track and its replacement, so the nearest PRECEDING
  //          track of the same title is the one it belongs to.
  //   live   a row. A host on the microphone is emphatically something that was
  //          on, and leaving it out would make Earlier a list of the music only.
  //          It reads as a different sort of event because it carries the on-air
  //          dot instead of a figure, and no word of ours is spent on it.
  //   show   NOT a row of its own. A host presses Go on air first and names the
  //          show afterwards - the station says so where it writes the two - so
  //          the name belongs to the live row above rather than being a second
  //          appearance. A host who renames mid-show ends up with the name they
  //          settled on, which is the one they meant.
  function foldEarlier(ev) {
    const rows = [];
    const lastRow = p => {
      for (let i = rows.length - 1; i >= 0; i--) if (p(rows[i])) return rows[i];
      return null;
    };
    for (const e of ev) {
      // The artist is carried for one reason and it is not display: it is half
      // of the key this page's own like readings are filed under. See renderRecent.
      if (e.kind === 'track') rows.push({ k: 'track', t: e.title || '', a: e.artist || '' });
      else if (e.kind === 'live') rows.push({ k: 'live', t: e.name || '' });
      else if (e.kind === 'voted') {
        const r = lastRow(x => x.k === 'track' && x.t === e.title);
        // A vote-off whose track has already fallen off the front of the
        // station's sixty is dropped rather than drawn on its own.
        if (r) r.s = true;
      } else if (e.kind === 'show') {
        const r = lastRow(x => x.k === 'live');
        // A show whose `live` has fallen off the front is still something that
        // was on, so here the name becomes the row.
        if (r) r.t = e.name || ''; else rows.push({ k: 'live', t: e.name || '' });
      }
    }
    // The last track row is what is on air NOW - the station writes it off the
    // delayed source, at the instant a listener hears it begin - and the panel
    // above this list already names it. Dropped only while it is still last:
    // once a host has gone live after it, that track really did finish and it
    // belongs here. Read off the list rather than compared with the panel's
    // title, which comes from icecast and can lag it.
    if (rows.length && rows[rows.length - 1].k === 'track') rows.pop();
    return rows;
  }

  function renderRecent() {
    const ol = document.getElementById('recent');
    const wrap = document.getElementById('recentWrap');
    if (!ol || !wrap) return;
    ol.textContent = '';
    const past = foldEarlier(earlier).slice(-5).reverse();   // newest first
    // MATCHING. The station deliberately publishes no file path, so the name is
    // the only key /earlier and this page's own readings share - and the two do
    // NOT hold the same string. /earlier carries title and artist apart;
    // /status-json.xsl, which is where a reading is filed from, carries what
    // icecast made of them, and icecast joins an artist to a title with " - ".
    // Measured against the live station over three consecutive tracks, and it
    // held on all three: earlier said title "Subtle Energy", artist "Rik
    // Wright's Fundamental Forces", and the panel at that instant read "Rik
    // Wright's Fundamental Forces - Subtle Energy". Joining here
    // rather than splitting there, because a title may contain " - " of its own
    // - "Remembering John Lee Hooker - Red House" is in the library - and
    // splitting would cut that one in the wrong place.
    //
    // Where the two do not agree the row simply carries no figure, which is the
    // right way for this to fail: a missing count says only that this listener
    // was not here for that song, and a count landed on the wrong song would be
    // a claim about the broadcast that is not true.
    //
    // Keys already given a figure on this pass. A song played twice in the hour
    // is two rows this page cannot tell apart - it has one reading, from the
    // play it watched end - so the reading goes on the NEWEST of them and on no
    // other. The lifetime total would be near enough right on both, but the
    // arrow beside it would not: "it gained hearts while I was here" is a claim
    // about one play, and printing it against an earlier one is not this page's
    // to make.
    const done = [];
    past.forEach(e => {
      const li = document.createElement('li');
      // The dot before the name, so a live row is recognisable before it is
      // read - and a host who typed nothing is the dot alone, which is the
      // honest reading of somebody who went on and said nothing about it.
      if (e.k === 'live') li.appendChild(document.createElement('span')).className = 'dot';
      const t = li.appendChild(document.createElement('span'));
      t.className = 't';
      // textContent, not innerHTML. On a live row this is a show name one
      // person typed and everybody else is being shown.
      t.textContent = e.t;
      // Nothing at all at nought, rather than a nought. A song nobody has ever
      // liked has nothing to report, and a column of zeroes is a column of noise
      // that says the same thing an absence says in less room. Upheld where the
      // reading is FILED rather than tested again here, so there is one rule
      // about noughts and not two that can drift apart.
      //
      // Two readings, one line. The number is always the lifetime total. The
      // arrow and the heart in front of it say the number MOVED while this
      // listener was here, which is the difference between a song with a history
      // and a song that has just been given something. Where it did not move the
      // number stands alone: the column is one column, and a row that is a bare
      // figure among rows that carry a heart is read as the same figure without
      // the heart's news, which is exactly what it is.
      const key = e.a ? e.a + ' - ' + e.t : e.t;
      const h = e.k === 'track' && done.indexOf(key) < 0 &&
                heard.find(r => r.t === key);
      if (h) {
        done.push(key);
        const l = li.appendChild(document.createElement('span'));
        l.className = 'l';
        l.textContent = (h.u ? '↑♥ ' : '') + h.l;
      }
      // The skip glyph the tug row itself is drawn with, so a song the room
      // took off is marked with the button that took it off. A word would
      // have had to be translated; this one is already the page's vocabulary.
      if (e.s) {
        const k = li.appendChild(document.createElement('span'));
        k.className = 'k';
        k.textContent = '\u23ED\uFE0E';
        k.title = 'voted off';
      }
      ol.appendChild(li);
    });
    wrap.hidden = past.length === 0;
  }

  // No poller of its own, which is the same rule the skip counter is under and
  // for the same measured reason: one open tab made 691 requests in ten minutes
  // before PULSE at the foot of this file existed. /earlier changes when a track
  // changes and when a host goes live, and this page already learns about the
  // first from poll(), so it is asked on waking and on each change of title -
  // never on a clock.
  //
  // The guard is not politeness. Waking and a change of title land together at
  // load, and this is the one fetch both would fire.
  let earlierBusy = false;
  async function pollEarlier() {
    if (earlierBusy) return;
    earlierBusy = true;
    try {
      const j = await (await fetch('/earlier', { cache: 'no-store' })).json();
      if (Array.isArray(j)) { earlier = j; renderRecent(); }
    } catch {
      // The last list the station gave stays up. There is nothing truer to put
      // in its place and no word of ours may go there.
    } finally { earlierBusy = false; }
  }

  // Two jobs, in this order. File what the song that has just ended was liked
  // to, under its own title, because in a moment /likes/now will be describing
  // its replacement and this reading will be gone. Then ask the station what it
  // has: the event for the new track is written off the delayed source at the
  // instant its title reaches the stream, so by the time this runs it is there.
  function noteTrack(t) {
    if (!t || t === prevTitle) return;
    // A nought is not a reading. A song nobody has ever liked has nothing to
    // report, the row is drawn bare either way, and filing it would put an
    // entry in every listener's browser that can only ever render as nothing.
    // This is also what lets the drawing below trust that a reading it finds
    // has a figure in it - measured the other way round first: "Subtle Energy"
    // came off the air at nought and the list printed "Subtle Energy 0".
