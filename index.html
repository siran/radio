<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild n Loyal Radio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<style>
  :root {
    --bg: #0b0b0e; --panel: #131318; --line: #24242c;
    --fg: #ecebe8; --dim: #8b8b96; --accent: #4ade80;
    /* The diameter of the record, and through it the height of the volume row
       and the width of the column under the button. This number is no longer the
       one chosen first. The play triangle is chosen first, at fourteen pixels
       tall, which is the height of the triangle in a standard twenty-four pixel
       play icon and so the size a play button is on anything else; the label is
       then made only wide enough to hold that triangle hanging below the
       spindle hole; and the vinyl is finally made only as wide as it has to be
       for the grooves outside the label to still read as grooves, which takes
       about five of them. Deciding in that order lands on eighty-four pixels, twelve less than
       the ninety-six this used to be, while the triangle goes from six pixels
       tall to fourteen. Shrinking it is not free: the counter below the button
       is pinned to this width and does not scale with it, and 10:00 / 100:00
       measures 71.7px, so there are twelve pixels in hand and no more to give. */
    --lp: 84px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f6f4; --panel:#fff; --line:#e2e2dd; --fg:#17171a; --dim:#6b6b73; --accent:#16a34a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px 20px; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 900px; }

  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 5px; }
  .desc { color: var(--dim); font-size: .9rem; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: .72rem;
          letter-spacing: .14em; color: var(--dim); margin-bottom: 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; }
  .on .dot { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  .on .lbl { color: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(74,222,128,.5)} 50%{opacity:.75; box-shadow:0 0 0 6px rgba(74,222,128,0)} }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  .chatlog { height: 170px; overflow-y: auto; font-size: .84rem; margin-bottom: 11px;
             display: flex; flex-direction: column; gap: 3px; }
  .chatlog .line { overflow-wrap: anywhere; }
  .chatlog .nick { color: var(--accent); font-weight: 600; }
  .chatlog .t { color: var(--dim); font-size: .68rem; margin-left: 5px; }
  .chatlog .quiet { color: var(--dim); }
  .chatrow { display: flex; gap: 7px; }
  .chatrow input { margin-bottom: 0; }
  .chatrow #nick { width: 82px; flex: none; }
  .chatrow #say { flex: 1; min-width: 0; }
  .chatrow button { flex: none; padding: 9px 13px; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; }

  .np-label, .panel h2 { font-size: .68rem; letter-spacing: .16em; color: var(--dim);
                         text-align: center; font-weight: 500; margin: 0; }
  .panel h2 { text-align: left; margin-bottom: 12px; }
  .np { text-align: center; font-size: 1.02rem; font-weight: 550; margin: 6px 0 22px;
        min-height: 1.6em; overflow-wrap: anywhere; }

  .controls { display: flex; align-items: center; gap: 16px; }
  button.play { flex: none; width: var(--lp); height: var(--lp); border-radius: 50%; cursor: pointer;
    border: none; background: #0d0d11; padding: 0;
    display: grid; place-items: center; transition: transform .12s ease; }
  button.play:hover:not(:disabled) { transform: scale(1.05); }
  button.play:disabled { opacity: .28; cursor: not-allowed; }
  /* The stream takes a moment to arrive however fast the server is - TLS, then
     the first audio, then whatever the browser wants buffered before it makes a
     sound. Pressing a button that sits there looking unpressed is the worst part
     of that wait, so the ring starts turning on the press itself and stops when
     sound actually begins. It is not a progress bar and does not pretend to be:
     it says heard you, and still coming. */
  button.play { position: relative; }
  button.play.loading { cursor: progress; }
  button.play.loading::after {
    content: ''; position: absolute; inset: calc(var(--lp) * .113); border-radius: 50%;
    border: calc(var(--lp) / 31) solid #edece9; border-top-color: transparent;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The button is the record, and the record is built the way one looks: black
     vinyl carrying fine concentric grooves, a smooth run-out ring where the
     grooves stop, a red paper label, and a spindle hole punched dead centre. The
     label takes a little over half the face here rather than the third a twelve
     inch LP gives it, which is nearer the proportion of a seven inch single, and
     it is that way round because the label has to carry a full sized play
     triangle hanging below the spindle hole. The record is built outward from
     that rather than the label being handed whatever the disc had left over, which
     is how it ended up with a six pixel triangle on a ninety-six pixel button.
     Every measurement here is a fraction of --lp, so changing the diameter changes
     the whole pressing rather than leaving the label the wrong size for the disc
     it is glued to.

     The background layers are listed in the order the background property wants
     them, topmost first, which is the reverse of the order anyone would describe
     them in. The glint used to be the first of them and is not here any more; it
     is an element of its own now, below, because light from a lamp in the room
     does not turn with the turntable. What makes the turning legible without it
     is the label, which carries a symbol and is unmistakably going round; grooves
     in motion do look exactly like grooves at rest, but they were never the only
     evidence.

     So the first layer is the run-out, the smooth dark band every pressing has
     between the last groove and the paper. Its inner edge is written as fifty-seven
     and a half per cent, which is the same number as the label's share of the
     diameter, and that is not a coincidence to be tidied away: a percentage in
     this gradient is a fraction of the disc's radius, and the label's edge lies
     at exactly the label's fraction of it. Move one number without the other and
     the smooth band stops meeting the paper. Its outer edge is a different kind
     of number, measured from the inner one and from nothing else: the band is
     four and a half points of the radius wide, which is the 1.89px it was cut to
     when the rings were last counted, so the outer edge is sixty-two per cent. It
     moved in by exactly what the paper moved in by, because a run-out that does
     not follow the paper is a run-out that no longer starts at it.

     Then the grooves, and they are a ramp rather than a step. A step edge carries
     a great deal of energy above its own pitch, and once the pitch is down near
     the width of a pixel that energy folds back and the ring field breaks into a
     speckled hatch, which was rendered at true size and is not a subtle failure:
     it is worse than having no grooves. Written as a ramp instead, from near-black
     up to the light of the groove at the halfway point and back down, the field
     survives at pitches a step cannot reach, because a ramp has almost nothing
     above its own pitch left to fold.

     Ten rings is what is drawn now, and the pitch that draws them has not moved by
     so much as a hundredth of a pixel. Contrast lives in the pitch and the pitch
     lives on the raster: these rings are a gradient sampled on a grid whose pixels
     are one, and measured off the rendered button over a fixed annulus a pitch of
     1.45px draws its rings at 9.3 levels out of 255 where 1.61px draws them at 13.5,
     and the angular scatter that tells a ring field from a hash goes up by half
     again at the finer pitch. A pitch chosen to make a ring count come out is
     therefore a pitch that throws the rings away, and the count has to follow the
     band instead. Taking the word off the label let the paper come in from sixty-one
     per cent of the radius to fifty-seven and a half, the run-out came in with it
     keeping its 1.89px, and the playing surface went from 14.49px to 15.96px without
     a number in the groove gradient being touched. A repeating radial gradient is
     phased from the centre, so a light ring falls at 1.61px, 3.22px, 4.83px and so
     on outward whatever happens to be covering it; the ring at 26.54px was under the
     old run-out and is now simply uncovered. Nine rings become ten, and measured off
     the rendered button over the band each one actually occupies, the ten come out
     at 13.7 levels of contrast against the nine's 13.5, with the angular scatter at
     5.72 against 5.69 - uncovering a ring costs nothing, because nothing about the
     ring itself changed. The innermost of the ten sits at 26.54px and clears the
     run-out by half a pixel, which is the same order as the two thirds of a pixel
     the innermost of the nine had, and the outermost clears the rim by a whole
     one. Eleven would need the paper in another pixel and a half, which is more
     than the symbol has to give, or a pitch of 1.45px, which is the one already
     measured and already rejected.

     The white is left at the weight it was already carrying, because the band's
     average brightness follows that weight and hardly notices the pitch, so leaving
     it alone keeps the margin reading as black vinyl rather than as grey card
     without anything else having to be arranged: each measured over the band it
     actually occupies, the ten ring field reads 24.4 levels of mean luminance
     where the nine ring one read 24.0. This pitch is in
     pixels and not a fraction of --lp on purpose, unlike everything else here: it
     was chosen against the raster the browser draws it on, and a pitch that scaled
     with the record would land somewhere else on that raster at every size and
     alias differently at each.

     Underneath is the vinyl, a shade lighter at the centre than at the rim so
     the face reads as a moulded object rather than a hole cut in the page.

     It comes round in four and a half seconds, far slower than a real record and
     deliberately so: at this size anything near thirty-three revolutions a minute
     stops reading as a record and starts reading as the loading ring above,
     which means something else entirely and can follow it within the same press.

     The animation is declared on the disc unconditionally and left paused, and
     playing only flips animation-play-state to running. Toggling the animation
     itself on and off would throw the angle away and snap the label back to
     upright every time the stream stopped, which is the opposite of what a
     record does; pausing the play state leaves the transform exactly where it
     had got to, so the label freezes mid-turn and the next press carries on from
     the same angle. */
  .lp-disc {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle closest-side, transparent 0 57.5%, #0f0f14 57.5% 62%, transparent 62%),
      repeating-radial-gradient(circle closest-side, rgba(0,0,0,.86) 0,
                                rgba(255,255,255,.12) .805px, rgba(0,0,0,.86) 1.61px),
      radial-gradient(circle closest-side, #26262f 0 26%, #16161c 60%, #08080b 100%);
    animation: spin 4.5s linear infinite;
    animation-play-state: paused;
  }
  button.play.spinning .lp-disc { animation-play-state: running; }
  /* The highlight is light landing on the record, not something printed on it. A
     specular reflection comes from a lamp somewhere in the room and a lamp does
     not go round with the turntable, so the streak has to stay where it is while
     the vinyl passes underneath. That is the whole of this element's job, and it
     is why the glint is no longer one of the disc's own background layers, where
     the same transform that turned the grooves turned the light as well and made
     the spin read as a texture rotating rather than as a record catching the
     light. Nothing here animates, so there is nothing here to freeze: the
     highlight is in the same place at every angle, in every state, and while the
     record is stopped, which is what a lamp that is not moving does.

     It is a span rather than a pseudo-element because both of the button's are
     effectively spoken for. ::after carries the loading ring. ::before is painted
     before the element's children rather than after them, so a glint put there
     would sit underneath the disc instead of on it and would need a z-index to
     climb out, which would then have to be answered by a second z-index on the
     ring to keep the ring on top of the light. One element written after the disc
     lands above the disc and below the ring by tree order alone and needs
     neither. It takes no pointer events, because the control is the whole button
     and not any part of it, and it is hidden from the accessibility tree for the
     same reason the disc is.

     The mask keeps the light off the paper. A label is matte and takes no
     specular sheen, and the shape of this particular highlight settles the
     argument on its own: it is a conic wedge, so it narrows as it approaches the
     middle, and any of it allowed over the label reads as a beam aimed at the
     spindle hole rather than as a sheen across paper. A version at a third of the
     strength was rendered and it still draws that line. Fifty-six and a half per
     cent is the label's share of the diameter once more, so the light stops exactly
     where the paper starts. The mask is declared twice because Safari wanted the prefix
     until 15.4 and this page is public; a browser that honours neither gets the
     highlight across the label, which is wrong but is not broken. */
  .lp-glint {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 250deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.34) 15deg,
                               rgba(255,255,255,.08) 29deg, rgba(255,255,255,0) 44deg,
                               rgba(255,255,255,0) 360deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 0 57.5%, #000 58.5%);
    mask-image: radial-gradient(circle closest-side, transparent 0 57.5%, #000 58.5%);
  }
  /* The lip. A pressed record is not flat at its edge: there is a raised smooth
     rim outside the last groove, and being smooth it is the one part of the black
     face that returns a specular reflection rather than scattering it, which is
     why the edge of a record catches the light in a way the playing surface never
     does. That is the thing being drawn here, and it decides where it belongs.
     Light that comes from a lamp in the room does not turn with the turntable, so
     the lip's highlight has to sit still while the vinyl passes under it, exactly
     as the glint above does, and it lives on the glint for that reason rather than
     on the disc. It is brightest at 265 degrees because that is where the glint is
     brightest: the glint's conic starts at 250 and reaches its peak fifteen degrees
     later, and this one starts at 85 and reaches its own peak half a turn later, so
     the same number is arrived at from the other side of the circle rather than
     being copied. Two lights on one record pointing in two directions is the single
     thing that would give the whole illusion away.

     The texture is in the shape of the arc rather than in a pattern laid over it.
     A repeating conic gradient was tried first, which is the obvious way to write
     texture that turns with the surface, and it was measured rather than admired:
     at forty-eight and at ninety-six cells around the circumference the phase of
     the ripple did not move with the disc at all through a whole revolution,
     because a cell is then two to five pixels wide on a band two pixels tall and
     what survives the raster is its own beat against the pixel grid and not
     anything that was drawn. At twenty-four cells it does genuinely turn, and it
     turns as a ring of visible dashes, which is a worse thing to have than a plain
     rim. So the variation is written into the conic itself as a main lobe with
     several lesser ones around it, which is what an edge that is not polished under
     a room that is not one point light actually looks like, and it varies over tens
     of degrees rather than over three, which is a rate two pixels can hold.

     The mask is what makes this a lip rather than a wash over the whole face: it
     opens at ninety-five and a half per cent of the radius, is fully open across
     the crest, and closes again at the rim so the outermost half pixel, which is
     already being shared with the button's antialiased edge, is not asked to carry
     a hard bright line. It is declared prefixed and unprefixed for the same reason
     the glint's own mask is. Nothing here animates, so there is nothing here to
     freeze, and the lip is in the same place at every angle and in every state. */
  .lp-glint::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 85deg, rgba(255,255,255,.03) 0deg, rgba(255,255,255,.055) 38deg,
                               rgba(255,255,255,.03) 72deg, rgba(255,255,255,.10) 104deg,
                               rgba(255,255,255,.07) 131deg, rgba(255,255,255,.34) 180deg,
                               rgba(255,255,255,.17) 203deg, rgba(255,255,255,.24) 222deg,
                               rgba(255,255,255,.08) 258deg, rgba(255,255,255,.115) 292deg,
                               rgba(255,255,255,.04) 325deg, rgba(255,255,255,.03) 360deg);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 0 95.5%, #000 97% 99.3%, transparent 100%);
    mask-image: radial-gradient(circle closest-side, transparent 0 95.5%, #000 97% 99.3%, transparent 100%);
  }
  /* The paper label. There is no word on it any more, and losing the word is the
     point of this pressing rather than a consequence of shrinking it. PLAY and
     PAUSE were the only English anywhere in this interface. A triangle pointing
     right and two upright bars are read the same way by someone who has never met
     an English word, the station is on the open internet, and this button is the
     one control it has, so the word was costing a reader in another language the
     whole of the control and buying a reader in this one nothing the symbol was
     not already saying. What it cost is easy to state and what it bought is not,
     which is the shape of an argument that ends in a deletion.

     Losing it does not shrink the paper by anything like the width of a word. The
     label is a circle centred on the spindle hole and the symbol hangs below that
     hole, so what sets the radius is how far the lowest and outermost corner of the
     symbol reaches from the centre, and that corner belongs to the pause bars at
     22.10px. The word sat in the row above and never reached as far out as that, so
     it was never what the radius was paying for. The paper comes in from sixty-one
     per cent of the radius to fifty-seven and a half, which is the symbol's reach
     plus 2.05px of red, and not to anything remotely like the size of the symbol
     itself. Closing the gap under the hole to buy more of that margin was tried and
     put back: at 0.84px instead of 1.512px the symbol's box does move up by the
     0.672px the arithmetic promises, and not one pixel of its ink moves with it,
     because the line box is painted at a whole pixel and both positions round to
     the same one.

     Three rows rather than a stacked column, and the spindle hole is still the
     reason. A column would centre the hole and the symbol together as one block,
     which leaves the hole above the middle of a disc that turns by half the height
     of whatever is under it, and a spindle hole that orbits the centre is the one
     thing on a record nobody can look past. A row of its own between two rows of
     equal share fixes the hole at the centre whatever size the symbol is set to.
     The top row is empty now and it is not dead weight: being empty and being the
     same height as the bottom row is the whole of how the hole stays centred. What
     it does cost is that the two remaining children have to be told which rows they
     are in, because an item with an automatic position is placed in the first free
     cell, and left to itself the hole would take row one and the symbol row two and
     the hole would leave the centre.

     The two outer rows are written minmax(0, 1fr) rather than 1fr, and at the old
     size it would not have mattered. A track written 1fr may not be smaller than
     its own contents, and on the smaller paper the pause symbol's line box is
     19.98px where half of what is left after the hole and the gaps is 19.91px, so
     the bottom row quietly takes the 0.07px it wants from the top one and carries
     the hole off centre with it, which is the exact failure these three rows exist
     to prevent arriving through the back door the moment the label got small
     enough. With minmax(0, 1fr) the row has no such floor, the two stay equal, and
     the 0.07px of line box that does not fit hangs down into empty red where there
     is nothing to disturb. Measured on the rendered button the hole is within a
     hundredth of a pixel of centre in every state.

     The hairline round the paper is --lp divided by the diameter --lp is set to,
     so it is one pixel at the size this is drawn at and thickens with the record
     rather than staying a hair on a much larger pressing. */
  .lp-label {
    width: calc(var(--lp) * .575); height: calc(var(--lp) * .575); border-radius: 50%;
    display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    justify-items: center; align-items: center;
    gap: calc(var(--lp) * .018); line-height: 1; color: #fff4ef;
    background: radial-gradient(circle closest-side, #e02a3e 0 58%, #c4142a 100%);
    box-shadow: 0 0 0 calc(var(--lp) / 84) rgba(0,0,0,.5);
  }
  /* A hole, not a dot: it takes the colour of the panel behind the button rather
     than a dark grey of its own, so it reads as the page showing through. */
  .lp-hole { grid-row: 2; width: calc(var(--lp) * .065); height: calc(var(--lp) * .065);
             border-radius: 50%; background: var(--panel);
             box-shadow: inset 0 0 0 1px rgba(0,0,0,.45); }
  /* The symbol is the one thing on this button that was not free to be whatever
     the disc had left. A play triangle fourteen pixels tall is what a play
     button looks like everywhere else, and every other measurement on the record
     was worked back from it. It takes two font sizes to get one symbol size:
     U+25B6 inks 0.783 of its em and the pair of U+275A bars inks 0.700 of
     theirs, so set at a single size the bars come out a pixel and a half shorter
     than the triangle and the pause reads as the smaller of the two controls.
     Set at these two, the ink of both measures fourteen pixels tall, which is
     the thing being compared. They stay fractions of --lp rather than becoming
     fixed pixels so that the symbol still travels if the record is ever resized,
     even though here it was the symbol that decided the record's size. */
  .lp-sym { grid-row: 3; font-size: calc(var(--lp) * .213); align-self: start; }
  button.play.spinning .lp-sym { font-size: calc(var(--lp) * .238); }
  /* The ring is a thin arc and can afford to merely slow down. The record is the
     whole face of the button turning with a symbol printed on it, which is a great
     deal more motion, so it stops outright and is named here rather than being
     left to the universal animation kill at the foot of this sheet - that rule
     does now reach the disc, because the disc became a real element, but relying
     on it would mean relying on a rule written for something else. The loading
     ring is still a pseudo-element and * has never matched it. */
  @media (prefers-reduced-motion: reduce) {
    button.play.loading::after { animation-duration: 2.4s; }
    .lp-disc { animation: none; }
  }
  /* The counter goes under the button rather than beside it so the row keeps its
     shape on a phone. It used to appear when playback started and vanish when it
     stopped, and the track line inside it used to wait for a title, so the block
     changed both width and height as you played and paused and the whole row
     jumped. Now it is always rendered and always exactly as wide as the button
     above it, which is what makes it steady: the column is given the diameter of
     the record explicitly, so no string this line can hold is able to widen it,
     and the line is centred inside that fixed box. Tabular figures keep the
     digits from shuffling sideways as the seconds turn over, and the placeholder
     occupies the same shape as a real reading so there is no empty box waiting
     to be filled. */
  .deck { flex: none; width: var(--lp);
          display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .clocks { width: 100%; text-align: center; white-space: nowrap;
            font-size: .72rem; color: var(--dim);
            font-variant-numeric: tabular-nums; }
  /* Pinned to the height of the button rather than centred in the row, so
     that the slider stays level with the record whether or not the counter
     underneath it is there. Centring would drop it half the height of the
     counter every time playback started. */
  .vol { flex: 1; align-self: flex-start; height: var(--lp);
         display: flex; align-items: center; gap: 9px; color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .narrator { margin-top: 8px; font-size: .8rem; color: var(--dim); line-height: 1.45; }

  .meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px;
          padding-top: 16px; border-top: 1px solid var(--line); font-size: .76rem; color: var(--dim); }
  .meta b { display: block; color: var(--fg); font-weight: 550; font-size: .88rem; }

  /* guestbook */
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 11px; font: inherit; font-size: .88rem; margin-bottom: 9px;
  }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  /* browsers style autofilled fields themselves - override it */
  input:-webkit-autofill, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    box-shadow: 0 0 0 1000px var(--bg) inset;
  }
  .row { display: flex; gap: 9px; align-items: center; }
  button.send {
    background: var(--accent); color: #06210f; border: 0; border-radius: 9px;
    padding: 9px 18px; font: inherit; font-weight: 600; font-size: .85rem; cursor: pointer;
  }
  button.send:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: .74rem; color: var(--dim); }
  .hp { position: absolute; left: -9999px; }

  .msgs { margin-top: 18px; max-height: 320px; overflow-y: auto; }
  .msg { padding: 10px 0; border-top: 1px solid var(--line); }
  .msg .who { font-size: .82rem; font-weight: 600; }
  .msg .when { font-size: .7rem; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .msg .body { font-size: .88rem; margin: 3px 0 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg .track { font-size: .7rem; color: var(--dim); font-style: italic; overflow-wrap: anywhere; }
  .findrow { display: flex; gap: 16px; justify-content: center; margin: -10px 0 18px; }
  .findrow a, .findrow button { color: var(--dim); background: none; border: 0; padding: 4px;
    cursor: pointer; border-radius: 6px; font: inherit; font-size: .76rem; display: flex;
    align-items: center; text-decoration: none; }
  .findrow a:hover, .findrow button:hover { color: var(--accent); background: rgba(127,127,127,.12); }
  .findrow .done { color: var(--accent); }
  .findrow[hidden] { display: none; }
  /* the like pill reuses button.vote below; this only centres it */
  .likerow { display: flex; justify-content: center; margin: -6px 0 18px; }
  .likerow[hidden] { display: none; }
  .recent { margin-top: 20px; }
  .recent h3 { font-size: .66rem; letter-spacing: .16em; color: var(--dim);
               font-weight: 500; margin: 0 0 7px; }
  .recent ol { list-style: none; margin: 0; padding: 0; }
  .recent li { font-size: .82rem; color: var(--dim); padding: 4px 0; overflow-wrap: anywhere;
               border-bottom: 1px solid var(--line); }
  .recent li:last-child { border-bottom: 0; }
  .empty { font-size: .84rem; color: var(--dim); padding: 12px 0; }
  .privacy { font-size: .7rem; color: var(--dim); margin-top: 9px; line-height: 1.45; }
  .replying { font-size: .78rem; color: var(--dim); margin-bottom: 9px;
              display: flex; gap: 8px; align-items: baseline; }
  .replying b { color: var(--fg); font-weight: 600; }
  .msg.reply { padding-left: 11px; border-left: 2px solid var(--line); border-top: 0; }
  button.link { color: var(--dim); background: none; border: 0; padding: 0;
                font: inherit; font-size: .74rem; cursor: pointer; text-decoration: underline; }
  button.link:hover { color: var(--fg); }
  .msg .foot { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  button.vote { background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 20px; padding: 1px 9px; font: inherit; font-size: .72rem;
    cursor: pointer; line-height: 1.5; }
  button.vote:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.vote:disabled { opacity: .5; cursor: default; }

  footer { margin-top: 16px; display: flex; justify-content: center; align-items: center;
           gap: 8px; font-size: .72rem; }
  footer a, footer .flink { color: var(--dim); text-decoration: none; background: none;
    border: 0; padding: 0; font: inherit; font-size: .72rem; cursor: pointer; }
  footer a:hover, footer .flink:hover { color: var(--fg); }
  footer .sep { color: var(--line); }
  /* the bitrate: plumbing, so it sits down here with the rest of the plumbing */
  footer .quality { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="live" id="live"><span class="dot"></span><span class="lbl" id="lbl">connecting</span></div>
    <h1 id="name">&nbsp;</h1>
    <div class="desc" id="desc">&nbsp;</div>
  </header>

  <div class="cols">

   <div class="col">
    <!-- player -->
    <div class="panel">
      <div class="np-label">NOW PLAYING</div>
      <div class="np" id="np">—</div>
      <div class="findrow" id="findrow" hidden>
        <a id="findLink" target="_blank" rel="noopener" title="find this song in the library">♫ find this song</a>
        <button type="button" id="copySong" title="copy a link to this song" aria-label="copy song link">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
      </div>
      <div class="likerow" id="likerow" hidden>
        <button type="button" class="vote" id="likeBtn" title="like this song" aria-label="like this song"><span id="likeHeart">&#9825;</span> <span id="likeCount">0</span></button>
      </div>
      <div class="controls">
        <div class="deck">
          <button class="play" id="btn" disabled aria-label="Play or pause"><span class="lp-disc" aria-hidden="true"><span class="lp-label"><span class="lp-hole"></span><span class="lp-sym" id="btnsym">▶</span></span></span><span class="lp-glint" aria-hidden="true"></span></button>
          <div class="clocks" id="intotrack">--:-- / --:--</div>
        </div>
        <div class="vol">
          <span aria-hidden="true">🔉</span>
          <input type="range" id="vol" min="0" max="100" value="85" aria-label="Volume">
        </div>
      </div>
      <div class="narrator" id="narrator" hidden></div>
      <div class="meta">
        <div>listeners <b id="listeners">–</b></div>
        <div>on air <b id="uptime">–</b></div>
      </div>
    </div>

    <!-- chat -->
    <div class="panel">
      <h2>CHAT</h2>
      <div class="chatlog" id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <div class="chatrow">
          <input type="text" id="nick" maxlength="20" placeholder="nick" required>
          <input type="text" id="say" maxlength="200" placeholder="say something…" required>
          <button type="submit" class="send" id="chatsend">&rarr;</button>
        </div>
      </form>
    </div>
   </div>

    <!-- guestbook -->
    <div class="panel">
      <h2>LEAVE A MESSAGE</h2>
      <div class="replying" id="replying" hidden>
        replying to <b id="replyWho"></b>
        <button type="button" class="link" id="cancelReply">cancel</button>
      </div>
      <form id="form" autocomplete="off">
        <input type="text" id="who" maxlength="40" placeholder="who you claim to be" required>
        <textarea id="text" maxlength="500" placeholder="say something…" required></textarea>
        <input type="text" id="website" class="hp" tabindex="-1" aria-hidden="true">
        <div class="row">
          <button type="submit" class="send" id="send">Send</button>
          <span class="hint" id="hint">stamped with whatever is playing</span>
        </div>
      </form>
      <div class="msgs" id="msgs"><div class="empty">no messages yet</div></div>
    </div>

  </div>

  <div class="recent panel" id="recentWrap" hidden>
    <h3>EARLIER</h3>
    <ol id="recent"></ol>
  </div>

  <footer>
    <a href="/stream" title="open the raw stream in VLC or any audio player">stream</a>
    <span class="sep">&middot;</span>
    <span class="quality" id="bitrate" title="stream quality">&ndash;</span>
    <span class="sep">·</span>
    <button class="flink" id="share">copy link</button>
    <span class="sep">·</span>
    <a href="/host/">i'm a radio host</a>
    <span class="sep">·</span>
    <a href="/next/">try the newest version &rarr;</a>
  </footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio'), btn = $('btn'), vol = $('vol');
  const sym = $('btnsym');
  let lastTitle = null, titleSince = Date.now();
  let replyTo = null;   // filename of the message being replied to

  vol.addEventListener('input', () => { audio.volume = vol.value / 100; });
  audio.volume = vol.value / 100;

  function start() {
    audio.src = '/stream?t=' + Date.now();   // always join live, never a stale buffer
    audio.load();
    return audio.play();
  }
  // One line, always on screen, and only ever about the track. There used to be
  // two counters here and the other one was how long this browser had been
  // listening, which is a private stopwatch nobody asked to see; it was also the
  // wider of the two by a long way, and the row on a phone cannot afford it next
  // to a volume slider. The position and the duration are what a player shows and
  // what the operator sketched, they come from the station rather than from a
  // guess made here, and they are therefore right for someone who arrived in the
  // middle of a song, which a count started at page load never could be.
  //
  // The line is never hidden and never empty. When the station has not said where
  // it is, or has stopped answering, the line says so in the shape of a reading
  // rather than going blank, because a box that empties and refills is exactly
  // the jumping this replaces. A duration of zero is a live input saying it does
  // not know the length, and the honest answer to that is the same placeholder in
  // the second half only - inventing a total would be worse than admitting there
  // is none.
  const NOTIME = '--:--';
  // What the station last said about the track, and when it said it.
  let trackElapsed = 0, trackTotal = 0, trackAt = null;
  function tick() {
    // /likes/now answers with elapsed and duration off the frame being played.
    // Carried forward between polls by the wall clock so the seconds move every
    // second rather than in jumps every five.
    $('intotrack').textContent = trackAt === null
      ? NOTIME + ' / ' + NOTIME
      : mmss(trackElapsed + (Date.now() - trackAt) / 1000) + ' / ' +
        (trackTotal > 0 ? mmss(trackTotal) : NOTIME);
  }

  // Three states, one place, and the place is still here. 'loading' is set by the
  // press itself and cleared only by sound actually arriving, or by giving up -
  // never on a timer, because a timer would lie in whichever direction the
  // network did not go. What changed is where the state gets written: the label
  // has to turn with the record, so it lives inside the disc, and a
  // pseudo-element could never have held text that this function sets. The symbol
  // is therefore a span addressed by id. While the stream is still coming it is
  // cleared rather than the disc being taken away - a blank pressing with a ring
  // turning over it is the record on the platter and not yet playing, which is
  // exactly what is true at that moment. The aria-label was always the whole
  // accessible name of this button and it is now the only text naming the control
  // anywhere, because the word that used to sit above the symbol has gone; the
  // disc is hidden from assistive technology precisely so that the name never
  // becomes a decoration that happens to be upside down half the time.
  const GLYPH_PLAY = '▶', GLYPH_PAUSE = '❚❚';
  function setBtn(state) {
    btn.classList.toggle('loading', state === 'loading');
    btn.classList.toggle('spinning', state === 'pause');   // the record turns only while sound is coming out
    sym.textContent = state === 'loading' ? '' :
                      state === 'pause'   ? GLYPH_PAUSE : GLYPH_PLAY;
    btn.setAttribute('aria-label', state === 'loading' ? 'Connecting to the stream' :
                                   state === 'pause'   ? 'Pause' : 'Play');
  }
  btn.addEventListener('click', () => {
    if (audio.paused) {
      setBtn('loading');          // before anything else, on the press itself
      start().catch(() => { setBtn('play'); setLive(false, 'could not start'); });
    } else {
      audio.pause(); audio.removeAttribute('src'); audio.load(); setBtn('play');
    }
  });
  audio.addEventListener('playing', () => setBtn('pause'));
  audio.addEventListener('pause',   () => setBtn('play'));
  audio.addEventListener('error',   () => { if (audio.paused) setBtn('play'); });

  function setLive(on, label) {
    $('live').className = 'live' + (on ? ' on' : '');
    $('lbl').textContent = label || (on ? 'ON AIR' : 'OFF AIR');
    btn.disabled = !on;
    if (!on) $('np').textContent = '—';
  }

  function fmtUptime(s) {
    if (!s) return '–';
    const secs = Math.max(0, (Date.now() - new Date(s).getTime()) / 1000);
    const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }

  async function poll() {
    try {
      const j = await (await fetch('/status-json.xsl', { cache: 'no-store' })).json();
      let s = j.icestats && j.icestats.source;
      if (!s) return setLive(false);
      if (!Array.isArray(s)) s = [s];
      const src = s.find(x => (x.listenurl || '').endsWith('/stream')) || s[0];
      if (!src) return setLive(false);

      if (src.server_name) { $('name').textContent = src.server_name; document.title = src.server_name; }
      $('desc').textContent = src.server_description || '';
      const title = cleanTitle(src.title || '');
      $('np').textContent = title || 'live';
      if (title !== lastTitle) { lastTitle = title; titleSince = Date.now(); noteTrack(title); }
      updateFind(title);

      $('listeners').textContent = src.listeners ?? '–';
      $('uptime').textContent = fmtUptime(src.stream_start_iso8601 || src.stream_start);
      const br = (src.audio_info || '').match(/bitrate=(\d+)/);
      $('bitrate').textContent = br ? br[1] + ' kbps' : '–';
      setLive(true);

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || 'Live', artist: src.server_name || '', album: src.server_description || ''
        });
      }
    } catch { setLive(false, 'unreachable'); }
  }

  // --- guestbook ------------------------------------------------------
  // No application server. The browser PUTs one markdown file per comment
  // and Caddy's webdav module writes it to disk. Reading is a directory
  // listing plus a fetch per file.

  function when(iso) {
    const d = new Date(iso), diff = (Date.now() - d) / 1000;
    if (isNaN(d)) return '';
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return d.toLocaleDateString();
  }

  // minimal front-matter parser: --- key: value --- then the body
  function parseMd(text) {
    const m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) return { name: 'anonymous', at: '', playing: '', text: text.trim() };
    const meta = {};
    for (const line of m[1].split('\n')) {
      const i = line.indexOf(':');
      if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
    return { name: meta.name || 'anonymous', at: meta.at || '',
             playing: meta.track || meta.playing || '',
             atTrack: meta.at_track || '',
             upvotes: parseInt(meta.upvotes || '0', 10) || 0,
             replyTo: meta.reply_to || '',
             file: meta.file || '', raw: text, text: (m[2] || '').trim() };
  }

  async function loadMessages() {
    try {
      const res = await fetch('/messages/', { headers: { accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const files = (await res.json())
        .filter(f => !f.is_dir && f.name.endsWith('.md'))
        .sort((a, b) => b.name.localeCompare(a.name))
        .slice(0, 25);
      const texts = await Promise.all(files.map(f =>
        fetch('/messages/' + encodeURIComponent(f.name), { cache: 'no-store' })
          .then(r => r.ok ? r.text().then(t => ({ t, name: f.name })) : null)
          .catch(() => null)));
      // newest first, on the parsed timestamp rather than the filename
      const msgs = texts.filter(Boolean)
        .map(o => Object.assign(parseMd(o.t), { file: o.name }))
        .sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
      render(msgs);
    } catch { /* leave whatever is shown */ }
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  function msgEl(m, depth) {
    const d = document.createElement('div');
    d.className = 'msg' + (depth ? ' reply' : '');
    if (depth) d.style.marginLeft = (depth * 16) + 'px';

    const who = document.createElement('div'); who.className = 'who';
    who.textContent = m.name;                        // textContent, never innerHTML
    const t = document.createElement('span'); t.className = 'when'; t.textContent = when(m.at);
    who.appendChild(t);

    const body = document.createElement('div'); body.className = 'body'; body.textContent = m.text;
    d.append(who, body);

    if (m.playing) {
      const tr = document.createElement('div'); tr.className = 'track';
      tr.textContent = '\u266a ' + m.playing + (m.atTrack ? '  @ ' + m.atTrack : '');
      d.appendChild(tr);
    }

    const foot = document.createElement('div'); foot.className = 'foot';
    const up = document.createElement('button');
    up.className = 'vote'; up.type = 'button';
    up.textContent = '\u25b2 ' + m.upvotes;
    up.addEventListener('click', () => upvote(m, up));
    const rep = document.createElement('button');
    rep.className = 'link'; rep.type = 'button'; rep.textContent = 'reply';
    rep.addEventListener('click', () => setReply(m));
    foot.append(up, rep);
    d.appendChild(foot);
    return d;
  }

  function render(list) {
    const box = $('msgs');
    box.textContent = '';
    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'no messages yet';
      box.appendChild(e); return;
    }
    // a real tree: a reply can itself be replied to
    const byFile = new Map(list.map(m => [m.file, m]));
    const kids = new Map();
    const roots = [];
    for (const m of list) {
      if (m.replyTo && byFile.has(m.replyTo)) {
        if (!kids.has(m.replyTo)) kids.set(m.replyTo, []);
        kids.get(m.replyTo).push(m);
      } else roots.push(m);
    }
    const MAXDEPTH = 4;
    const seen = new Set();
    function walk(nodes, depth) {
      // children oldest-first; roots stay newest-first
      if (depth > 0) nodes.sort((x, y) => new Date(x.at || 0) - new Date(y.at || 0));
      for (const m of nodes) {
        if (seen.has(m.file)) continue;      // guards against reply cycles
        seen.add(m.file);
        box.appendChild(msgEl(m, Math.min(depth, MAXDEPTH)));
        const ch = kids.get(m.file);
        if (ch && ch.length) walk(ch, depth + 1);
      }
    }
    roots.sort((x, y) => new Date(y.at || 0) - new Date(x.at || 0));
    walk(roots, 0);
  }

  function setReply(m) {
    replyTo = m.file;
    $('replyWho').textContent = m.name || 'anonymous';
    $('replying').hidden = false;
    $('text').focus();
  }
  $('cancelReply').addEventListener('click', () => {
    replyTo = null;
    $('replyWho').textContent = '';
    $('replying').hidden = true;
  });

  // Upvoting is read-modify-write on the file itself. Two people voting at the
  // same second can lose one vote - acceptable for a guestbook, and the only
  // option without server-side code.
  async function upvote(m, btn) {
    if (!m.file) return;
    btn.disabled = true;
    try {
      const cur = await (await fetch('/messages/' + encodeURIComponent(m.file), { cache: 'no-store' })).text();
      let next;
      if (/^upvotes:\s*\d+\s*$/m.test(cur)) {
        next = cur.replace(/^upvotes:\s*(\d+)\s*$/m, (_, n) => 'upvotes: ' + (parseInt(n, 10) + 1));
      } else {
        next = cur.replace(/^---\n/, '---\nupvotes: 1\n');   // older files had no field
      }
      const r = await fetch('/messages/' + encodeURIComponent(m.file), {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: next
      });
      if (r.ok) await loadMessages(); else btn.disabled = false;
    } catch { btn.disabled = false; }
  }

  // strip anything that would break the front matter
  const clean = s => String(s).replace(/[\r\n]+/g, ' ').replace(/^-{3,}$/gm, '').trim();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('text').value.trim().slice(0, 500);
    const name = clean($('who').value).slice(0, 40);
    if (!name) { $('hint').textContent = 'who are you?'; $('who').focus(); return; }
    if (!text) return;
    if ($('website').value) return;                   // honeypot
    $('send').disabled = true;

    const now = new Date();
    const stamp = now.toISOString().replace(/[:.]/g, '');
    const rand  = Math.random().toString(36).slice(2, 8);
    const file  = stamp + '-' + rand + '.md';
    // The station's own position, the same number the clock under the button
    // shows. This used to be measured from when THIS browser first saw the
    // title change, which is the moment the reader arrived rather than the
    // moment the track began - so every note left by someone who tuned in
    // mid-song recorded a position earlier than the one they were actually
    // hearing, and recorded it into a file that is kept. There is no guess to
    // make any more: /likes/now answers with the elapsed time off the frame
    // being played. An empty field when the station has not answered yet,
    // because a blank is honest and a zero is a claim.
    const into  = trackAt === null
      ? ''
      : mmss(trackElapsed + (Date.now() - trackAt) / 1000);

    const md =
      '---\n' +
      'at: ' + now.toISOString() + '\n' +
      'name: ' + name + '\n' +
      'track: ' + clean(lastTitle || '') + '\n' +
      'at_track: ' + into + '\n' +
      'file: ' + file + '\n' +
      'upvotes: 0\n' +
      (replyTo ? 'reply_to: ' + replyTo + String.fromCharCode(10) : '') +
      '---\n\n' + text + '\n';

    try {
      const r = await fetch('/messages/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) {
        $('text').value = ''; $('hint').textContent = 'thanks!';
        replyTo = null; $('replying').hidden = true;
        await loadMessages();
      }
      else { $('hint').textContent = 'could not send (' + r.status + ')'; }
    } catch { $('hint').textContent = 'could not send'; }
    setTimeout(() => { $('hint').textContent = 'stamped with whatever is playing'; }, 4000);
    $('send').disabled = false;
  });

  $('share').addEventListener('click', async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: document.title, url });
      else { await navigator.clipboard.writeText(url); $('share').textContent = 'copied';
             setTimeout(() => $('share').textContent = 'copy link', 1600); }
    } catch {}
  });

  // --- chat -----------------------------------------------------------
  // Same storage trick as the guestbook: one small file per line. Polling
  // only fetches files it has not seen, so steady state is one request.
  const chatSeen = new Set();
  let chatLines = [];

  $('nick').value = localStorage.getItem('radio.nick') || '';

  function renderChat() {
    const log = $('chatlog');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.textContent = '';
    if (!chatLines.length) {
      const q = document.createElement('div');
      q.className = 'line quiet'; q.textContent = 'quiet in here';
      log.appendChild(q);
      return;
    }
    for (const c of chatLines) {
      const d = document.createElement('div'); d.className = 'line';
      const n = document.createElement('span'); n.className = 'nick';
      n.textContent = c.name + ':';
      const b = document.createTextNode(' ' + c.text);
      const t = document.createElement('span'); t.className = 't'; t.textContent = when(c.at);
      d.append(n, b, t);
      log.appendChild(d);
    }
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  async function pollChat() {
    try {
      const res = await fetch('/chat/', { headers: { accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const files = (await res.json())
        .filter(f => !f.is_dir && f.name.endsWith('.md'))
        .sort((a, b) => a.name.localeCompare(b.name))
        .slice(-60);
      const fresh = files.filter(f => !chatSeen.has(f.name));
      if (fresh.length) {
        const got = await Promise.all(fresh.map(f =>
          fetch('/chat/' + encodeURIComponent(f.name), { cache: 'no-store' })
            .then(r => r.ok ? r.text() : null).catch(() => null)));
        got.forEach((t, i) => {
          chatSeen.add(fresh[i].name);
          if (t) chatLines.push(parseMd(t));
        });
        chatLines.sort((a, b) => new Date(a.at || 0) - new Date(b.at || 0));
        chatLines = chatLines.slice(-60);
        renderChat();
      } else if (!chatLines.length) renderChat();
    } catch { /* leave it */ }
  }

  $('chatform').addEventListener('submit', async e => {
    e.preventDefault();
    const nick = clean($('nick').value).slice(0, 20);
    const say  = $('say').value.trim().slice(0, 200);
    if (!nick) { $('nick').focus(); return; }
    if (!say) return;
    localStorage.setItem('radio.nick', nick);
    $('chatsend').disabled = true;
    const now = new Date();
    const file = now.toISOString().replace(/[:.]/g, '') + '-' +
                 Math.random().toString(36).slice(2, 6) + '.md';
    const md = '---' + String.fromCharCode(10) +
               'at: ' + now.toISOString() + String.fromCharCode(10) +
               'name: ' + nick + String.fromCharCode(10) +
               '---' + String.fromCharCode(10) + String.fromCharCode(10) +
               say + String.fromCharCode(10);
    try {
      const r = await fetch('/chat/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) { $('say').value = ''; await pollChat(); }
    } catch { /* ignore */ }
    $('chatsend').disabled = false;
  });


  // --- recently played -------------------------------------------------
  // Kept in localStorage so it survives a refresh, which the previous
  // version did not.
  const RECENT_KEY = 'radio.recent';
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch { recent = []; }

  function renderRecent() {
    const ol = document.getElementById('recent');
    const wrap = document.getElementById('recentWrap');
    if (!ol || !wrap) return;
    ol.textContent = '';
    const past = recent.slice(1, 6);          // skip the one currently playing
    past.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t;
      ol.appendChild(li);
    });
    wrap.hidden = past.length === 0;
  }

  function noteTrack(t) {
    if (!t || recent[0] === t) return;
    recent.unshift(t);
    recent = recent.slice(0, 8);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch {}
    renderRecent();
  }
  renderRecent();


  // --- share the current song --------------------------------------------
  // Points at a Jellyfin search rather than a file: nothing is hotlinkable,
  // the recipient still authenticates, and it survives files being renamed.
  const JF = 'https://music.wildnloyal.org:1111/web/#/search.html?query=';

  // Titles are mostly "Artist - Album - Track" (filename-derived), so the
  // last segment is the actual song name and searches far better.
  // Mixxx substitutes $artist blindly, so an untagged track arrives as
  // "- Album - Track". Strip the orphaned separator rather than show it.
  function cleanTitle(t) {
    if (!t) return '';
    let s = String(t).trim();
    while (s.length && (s[0] === '-' || s[0] === '\u2013' || s[0] === '\u2014')) {
      s = s.slice(1).trim();
    }
    return s;
  }

  function songQuery(title) {
    if (!title) return '';
    const parts = title.split(' - ').map(s => s.trim()).filter(Boolean);
    return parts.length > 1 ? parts[parts.length - 1] : title;
  }

  function songLink(title) {
    const q = songQuery(title);
    return q ? JF + encodeURIComponent(q) : '';
  }

  function updateFind(title) {
    const row = document.getElementById('findrow');
    const a = document.getElementById('findLink');
    if (!row || !a) return;
    const url = songLink(title);
    if (url) { a.href = url; row.hidden = false; } else { row.hidden = true; }
  }

  const copyBtn = document.getElementById('copySong');
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    const url = songLink(lastTitle);
    if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.classList.add('done');
      setTimeout(() => copyBtn.classList.remove('done'), 1400);
    } catch {}
  });

  // What the narrator is saying. Liquidsoap writes the line to a static file
  // at the web root - this page is public and cannot use the /control
  // endpoints, which sit behind the speaker credential. It carries its own
  // timestamp so a line ages out here rather than needing anything to come
  // back and clear it: a stale "that was" parked under the volume slider all
  // evening would be worse than showing nothing.
  const NARRATOR_TTL = 45000;
  async function pollNarrator() {
    const el = $('narrator');
    try {
      const res = await fetch('/live/narrator.json', { cache: 'no-store' });
      if (!res.ok) return;
      const n = await res.json();
      const age = Date.now() - Date.parse(n.at);
      if (n.words && age >= 0 && age < NARRATOR_TTL) {
        el.textContent = '\uD83D\uDCE2 ' + n.words;
        el.hidden = false;
      } else {
        el.hidden = true;
      }
    } catch (e) { el.hidden = true; }
  }

  // --- likes -------------------------------------------------------------
  // Anyone listening can like. No login, no account, no identity: the count
  // is one number against one song. Liquidsoap keeps it against the FILE
  // PATH, because an untagged track has no title to key on, and hands back an
  // opaque id for that path instead of the path itself - which is all this
  // page needs to remember what it has already liked, and keeps the layout of
  // the library off the public internet.
  //
  // One like per browser per track, remembered in localStorage. It is
  // defeatable by anyone who cares to clear it, and that is fine - it is a
  // song, not a ballot.
  const LIKED_KEY = 'radio.liked';
  let liked = [];
  try { liked = JSON.parse(localStorage.getItem(LIKED_KEY) || '[]'); } catch { liked = []; }
  let likeId = '';

  // The count belongs to the song on the air, not to the station: it is the
  // number a listener can move, and it changes when the track does. The two
  // places that carry it, the heart there is to press and the figure in the
  // meta row, are written here from the same response, so a vote and a track
  // change move both at once and neither can be caught telling a different
  // story than the other. The response also carries a station-wide total of
  // every like ever given to anything, which this page no longer shows: beside
  // a number about this song it only muddied which of the two was which.
  //
  // One counter, and it is the heart. It was briefly written in two places at
  // once, which cannot disagree - both are set here from the same response -
  // but two copies of one number a hundred pixels apart is not reassurance,
  // it is a question about whether they might ever differ. The count belongs
  // on the thing you press to change it; the row below stays about the
  // station, which is a different subject.
  function showLikes(j) {
    likeId = (j && j.id) || '';
    if (!likeId) { $('likerow').hidden = true; return; }
    const mine = liked.includes(likeId);
    $('likeCount').textContent = j.likes;
    $('likeHeart').textContent = mine ? '\u2665' : '\u2661';
    $('likeBtn').disabled = mine;
    $('likerow').hidden = false;
    // Same response, same track: the position rides along with the likes
    // because this is the one endpoint a page with no password may ask.
    if (typeof j.elapsed === 'number') {
      trackElapsed = j.elapsed;
      trackTotal = typeof j.duration === 'number' ? j.duration : 0;
      trackAt = Date.now();
    }
  }

  async function pollLikes() {
    try { showLikes(await (await fetch('/likes/now', { cache: 'no-store' })).json()); }
    catch {
      $('likerow').hidden = true;
      // Stop rather than keep counting from the last thing it was told. A
      // position that goes on climbing after the station stopped answering is
      // a number this page has no right to.
      trackAt = null;
    }
  }

  $('likeBtn').addEventListener('click', async () => {
    if (!likeId || liked.includes(likeId)) return;
    liked.push(likeId);
    liked = liked.slice(-50);
    try { localStorage.setItem(LIKED_KEY, JSON.stringify(liked)); } catch {}
    try { showLikes(await (await fetch('/likes/add', { method: 'POST' })).json()); }
    catch { pollLikes(); }
  });

  poll(); loadMessages(); pollChat(); pollNarrator(); pollLikes();
  setInterval(poll, 8000);
  setInterval(loadMessages, 30000);
  setInterval(pollChat, 4000);
  setInterval(pollNarrator, 4000);
  setInterval(pollLikes, 5000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
