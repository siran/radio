        .sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
      render(msgs);
    } catch { /* leave whatever is shown */ }
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  function msgEl(m, depth) {
    const d = document.createElement('div');
    d.className = 'msg' + (depth ? ' reply' : '');
    if (depth) d.style.marginLeft = (depth * 16) + 'px';

    const who = document.createElement('div'); who.className = 'who';
    who.textContent = m.name;                        // textContent, never innerHTML
    const t = document.createElement('span'); t.className = 'when'; t.textContent = when(m.at);
    who.appendChild(t);

    const body = document.createElement('div'); body.className = 'body'; body.textContent = m.text;
    d.append(who, body);

    if (m.playing) {
      const tr = document.createElement('div'); tr.className = 'track';
      tr.textContent = '\u266a ' + m.playing + (m.atTrack ? '  @ ' + m.atTrack : '');
      d.appendChild(tr);
    }

    const foot = document.createElement('div'); foot.className = 'foot';
    const up = document.createElement('button');
    up.className = 'vote'; up.type = 'button';
    up.textContent = '\u25b2 ' + m.upvotes;
    up.addEventListener('click', () => upvote(m, up));
    const rep = document.createElement('button');
    rep.className = 'link'; rep.type = 'button'; rep.textContent = 'reply';
    rep.addEventListener('click', () => setReply(m));
    foot.append(up, rep);
    d.appendChild(foot);
    return d;
  }

  function render(list) {
    const box = $('msgs');
    box.textContent = '';
    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = 'no messages yet';
      box.appendChild(e); return;
    }
    // a real tree: a reply can itself be replied to
    const byFile = new Map(list.map(m => [m.file, m]));
    const kids = new Map();
    const roots = [];
    for (const m of list) {
      if (m.replyTo && byFile.has(m.replyTo)) {
        if (!kids.has(m.replyTo)) kids.set(m.replyTo, []);
        kids.get(m.replyTo).push(m);
      } else roots.push(m);
    }
    const MAXDEPTH = 4;
    const seen = new Set();
    function walk(nodes, depth) {
      // children oldest-first; roots stay newest-first
      if (depth > 0) nodes.sort((x, y) => new Date(x.at || 0) - new Date(y.at || 0));
      for (const m of nodes) {
        if (seen.has(m.file)) continue;      // guards against reply cycles
        seen.add(m.file);
        box.appendChild(msgEl(m, Math.min(depth, MAXDEPTH)));
        const ch = kids.get(m.file);
        if (ch && ch.length) walk(ch, depth + 1);
      }
    }
    roots.sort((x, y) => new Date(y.at || 0) - new Date(x.at || 0));
    walk(roots, 0);
  }

  function setReply(m) {
    replyTo = m.file;
    $('replyWho').textContent = m.name || 'anonymous';
    $('replying').hidden = false;
    $('text').focus();
  }
  $('cancelReply').addEventListener('click', () => {
    replyTo = null;
    $('replyWho').textContent = '';
    $('replying').hidden = true;
  });

  // Upvoting is read-modify-write on the file itself. Two people voting at the
  // same second can lose one vote - acceptable for a guestbook, and the only
  // option without server-side code.
  async function upvote(m, btn) {
    if (!m.file) return;
    btn.disabled = true;
    try {
      const cur = await (await fetch('/messages/' + encodeURIComponent(m.file), { cache: 'no-store' })).text();
      let next;
      if (/^upvotes:\s*\d+\s*$/m.test(cur)) {
        next = cur.replace(/^upvotes:\s*(\d+)\s*$/m, (_, n) => 'upvotes: ' + (parseInt(n, 10) + 1));
      } else {
        next = cur.replace(/^---\n/, '---\nupvotes: 1\n');   // older files had no field
      }
      const r = await fetch('/messages/' + encodeURIComponent(m.file), {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: next
      });
      if (r.ok) await loadMessages(); else btn.disabled = false;
    } catch { btn.disabled = false; }
  }

  // strip anything that would break the front matter
  const clean = s => String(s).replace(/[\r\n]+/g, ' ').replace(/^-{3,}$/gm, '').trim();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('text').value.trim().slice(0, 500);
    const name = clean($('who').value).slice(0, 40);
    if (!name) { $('hint').textContent = 'who are you?'; $('who').focus(); return; }
    if (!text) return;
    if ($('website').value) return;                   // honeypot
    $('send').disabled = true;

    const now = new Date();
    const stamp = now.toISOString().replace(/[:.]/g, '');
    const rand  = Math.random().toString(36).slice(2, 8);
    const file  = stamp + '-' + rand + '.md';
    // The station's own position, the same number the clock under the button
    // shows. This used to be measured from when THIS browser first saw the
    // title change, which is the moment the reader arrived rather than the
    // moment the track began - so every note left by someone who tuned in
    // mid-song recorded a position earlier than the one they were actually
    // hearing, and recorded it into a file that is kept. There is no guess to
    // make any more: /likes/now answers with the elapsed time off the frame
    // being played. An empty field when the station has not answered yet,
    // because a blank is honest and a zero is a claim.
    const into  = trackAt === null
      ? ''
      : mmss(trackElapsed + (Date.now() - trackAt) / 1000);

    const md =
      '---\n' +
      'at: ' + now.toISOString() + '\n' +
      'name: ' + name + '\n' +
      'track: ' + clean(lastTitle || '') + '\n' +
      'at_track: ' + into + '\n' +
      'file: ' + file + '\n' +
      'upvotes: 0\n' +
      (replyTo ? 'reply_to: ' + replyTo + String.fromCharCode(10) : '') +
      '---\n\n' + text + '\n';

    try {
      const r = await fetch('/messages/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) {
        $('text').value = ''; $('hint').textContent = 'thanks!';
        replyTo = null; $('replying').hidden = true;
        await loadMessages();
      }
      else { $('hint').textContent = 'could not send (' + r.status + ')'; }
    } catch { $('hint').textContent = 'could not send'; }
    setTimeout(() => { $('hint').textContent = 'stamped with whatever is playing'; }, 4000);
    $('send').disabled = false;
  });

  $('share').addEventListener('click', async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: document.title, url });
      else { await navigator.clipboard.writeText(url); $('share').textContent = 'copied';
             setTimeout(() => $('share').textContent = 'copy link', 1600); }
    } catch {}
  });

  // --- chat -----------------------------------------------------------
  // Same storage trick as the guestbook: one small file per line. Polling
  // only fetches files it has not seen, so steady state is one request.
  const chatSeen = new Set();
  let chatLines = [];

  $('nick').value = localStorage.getItem('radio.nick') || '';

  function renderChat() {
    const log = $('chatlog');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.textContent = '';
    if (!chatLines.length) {
      const q = document.createElement('div');
      q.className = 'line quiet'; q.textContent = 'quiet in here';
      log.appendChild(q);
      return;
    }
    for (const c of chatLines) {
      const d = document.createElement('div'); d.className = 'line';
      const n = document.createElement('span'); n.className = 'nick';
      n.textContent = c.name + ':';
      const b = document.createTextNode(' ' + c.text);
      const t = document.createElement('span'); t.className = 't'; t.textContent = when(c.at);
      d.append(n, b, t);
      log.appendChild(d);
    }
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  async function pollChat() {
    try {
      const res = await fetch('/chat/', { headers: { accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const files = (await res.json())
        .filter(f => !f.is_dir && f.name.endsWith('.md'))
        .sort((a, b) => a.name.localeCompare(b.name))
        .slice(-60);
      const fresh = files.filter(f => !chatSeen.has(f.name));
      if (fresh.length) {
        const got = await Promise.all(fresh.map(f =>
          fetch('/chat/' + encodeURIComponent(f.name), { cache: 'no-store' })
            .then(r => r.ok ? r.text() : null).catch(() => null)));
        got.forEach((t, i) => {
          chatSeen.add(fresh[i].name);
          if (t) chatLines.push(parseMd(t));
        });
        chatLines.sort((a, b) => new Date(a.at || 0) - new Date(b.at || 0));
        chatLines = chatLines.slice(-60);
        renderChat();
      } else if (!chatLines.length) renderChat();
    } catch { /* leave it */ }
  }

  $('chatform').addEventListener('submit', async e => {
    e.preventDefault();
    const nick = clean($('nick').value).slice(0, 20);
    const say  = $('say').value.trim().slice(0, 200);
    if (!nick) { $('nick').focus(); return; }
    if (!say) return;
    localStorage.setItem('radio.nick', nick);
    $('chatsend').disabled = true;
    const now = new Date();
    const file = now.toISOString().replace(/[:.]/g, '') + '-' +
                 Math.random().toString(36).slice(2, 6) + '.md';
    const md = '---' + String.fromCharCode(10) +
               'at: ' + now.toISOString() + String.fromCharCode(10) +
               'name: ' + nick + String.fromCharCode(10) +
               '---' + String.fromCharCode(10) + String.fromCharCode(10) +
               say + String.fromCharCode(10);
    try {
      const r = await fetch('/chat/' + file, {
        method: 'PUT', headers: { 'content-type': 'text/markdown' }, body: md
      });
      if (r.ok) { $('say').value = ''; await pollChat(); }
    } catch { /* ignore */ }
    $('chatsend').disabled = false;
  });


  // --- recently played -------------------------------------------------
  // Kept in localStorage so it survives a refresh, which the previous
  // version did not.
  const RECENT_KEY = 'radio.recent';
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch { recent = []; }

  function renderRecent() {
    const ol = document.getElementById('recent');
    const wrap = document.getElementById('recentWrap');
    if (!ol || !wrap) return;
    ol.textContent = '';
    const past = recent.slice(1, 6);          // skip the one currently playing
    past.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t;
      ol.appendChild(li);
    });
    wrap.hidden = past.length === 0;
  }

  function noteTrack(t) {
    if (!t || recent[0] === t) return;
    recent.unshift(t);
    recent = recent.slice(0, 8);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch {}
    renderRecent();
  }
  renderRecent();


  // --- share the current song --------------------------------------------
  // Points at a Jellyfin search rather than a file: nothing is hotlinkable,
  // the recipient still authenticates, and it survives files being renamed.
  const JF = 'https://music.wildnloyal.org:1111/web/#/search.html?query=';

  // Titles are mostly "Artist - Album - Track" (filename-derived), so the
  // last segment is the actual song name and searches far better.
  // Mixxx substitutes $artist blindly, so an untagged track arrives as
  // "- Album - Track". Strip the orphaned separator rather than show it.
  function cleanTitle(t) {
    if (!t) return '';
    let s = String(t).trim();
    while (s.length && (s[0] === '-' || s[0] === '\u2013' || s[0] === '\u2014')) {
      s = s.slice(1).trim();
    }
    return s;
  }

  function songQuery(title) {
    if (!title) return '';
    const parts = title.split(' - ').map(s => s.trim()).filter(Boolean);
    return parts.length > 1 ? parts[parts.length - 1] : title;
  }

  function songLink(title) {
    const q = songQuery(title);
    return q ? JF + encodeURIComponent(q) : '';
  }

  function updateFind(title) {
    const row = document.getElementById('findrow');
    const a = document.getElementById('findLink');
    if (!row || !a) return;
    const url = songLink(title);
    if (url) { a.href = url; row.hidden = false; } else { row.hidden = true; }
  }

  const copyBtn = document.getElementById('copySong');
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    const url = songLink(lastTitle);
    if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.classList.add('done');
      setTimeout(() => copyBtn.classList.remove('done'), 1400);
    } catch {}
  });

  // What the narrator is saying. Liquidsoap writes the line to a static file
  // at the web root - this page is public and cannot use the /control
  // endpoints, which sit behind the speaker credential. It carries its own
  // timestamp so a line ages out here rather than needing anything to come
  // back and clear it: a stale "that was" parked under the volume slider all
  // evening would be worse than showing nothing.
  const NARRATOR_TTL = 45000;
  async function pollNarrator() {
    const el = $('narrator');
    try {
      const res = await fetch('/live/narrator.json', { cache: 'no-store' });
      if (!res.ok) return;
      const n = await res.json();
      const age = Date.now() - Date.parse(n.at);
      if (n.words && age >= 0 && age < NARRATOR_TTL) {
        el.textContent = '\uD83D\uDCE2 ' + n.words;
        el.hidden = false;
      } else {
        el.hidden = true;
      }
    } catch (e) { el.hidden = true; }
  }

  // --- likes -------------------------------------------------------------
  // Anyone listening can like. No login, no account, no identity: the count
  // is one number against one song. Liquidsoap keeps it against the FILE
  // PATH, because an untagged track has no title to key on, and hands back an
  // opaque id for that path instead of the path itself - which is all this
  // page needs to remember what it has already liked, and keeps the layout of
  // the library off the public internet.
  //
  // One like per browser per track, remembered in localStorage. It is
  // defeatable by anyone who cares to clear it, and that is fine - it is a
  // song, not a ballot.
  const LIKED_KEY = 'radio.liked';
  let liked = [];
  try { liked = JSON.parse(localStorage.getItem(LIKED_KEY) || '[]'); } catch { liked = []; }
  let likeId = '';

  // The count belongs to the song on the air, not to the station: it is the
  // number a listener can move, and it changes when the track does. The two
  // places that carry it, the heart there is to press and the figure in the
  // meta row, are written here from the same response, so a vote and a track
  // change move both at once and neither can be caught telling a different
  // story than the other. The response also carries a station-wide total of
  // every like ever given to anything, which this page no longer shows: beside
  // a number about this song it only muddied which of the two was which.
  //
  // One counter, and it is the heart. It was briefly written in two places at
  // once, which cannot disagree - both are set here from the same response -
  // but two copies of one number a hundred pixels apart is not reassurance,
  // it is a question about whether they might ever differ. The count belongs
  // on the thing you press to change it; the row below stays about the
  // station, which is a different subject.

  // Whoever is on the microphone, from the same response as everything else
  // here and for the reason the station gives for putting it there: a poll of
  // its own would disagree with this one for as long as a poll takes at the
  // one moment that matters, which is a host leaving the air.
  //
  // textContent, never innerHTML, and here that is not a habit - these three
  // strings were typed by one person and are being shown to everybody else.
  // It is the rule the guestbook and the chat already follow, and the station
  // caps the three lengths on its own side as well.
  //
  // A host who has typed nothing still gets the dot. That is the honest
  // reading of what the station said - somebody is live, and they chose to
  // say nothing about it - and it is the half of this that survives a
  // listener who reads no English at all.
  function showShow(sh) {
    const on = !!(sh && sh.live);
    $('showname').textContent  = on ? (sh.name  || '') : '';
    $('showtitle').textContent = on ? (sh.title || '') : '';
    $('shownote').textContent  = on ? (sh.note  || '') : '';
    $('showtitle').hidden = !$('showtitle').textContent;
    $('shownote').hidden  = !$('shownote').textContent;
    $('showwrap').hidden  = !on;
  }

  // A paused station is not playing the track it is showing, and for the
  // length of a bucket set that is every listener seeing a name for something
  // they cannot hear. The operator caught this one on the live page.
  //
  // The label loses its words rather than gaining different ones. Every
  // control on this page is wordless on purpose - the tug is two glyphs and a
  // row of dots - because it has to work for somebody who reads no English,
  // and swapping one English phrase for another English phrase would have
  // made this the one piece of state that only reads in one language. The
  // pause glyph is the same character the tug row uses for skip, from the
  // same block, and it needs no translation.
  //
  // The title itself is deliberately kept. It is still the track the station
  // is standing on and will resume, and showing nothing would lose that.
  // What this panel says is on, in one place, because it has exactly one
  // subject and used to have two.
  //
  // Three states, and the middle one is the one worth spelling out:
  //
  //   no show          the track, as it always was
  //   show, music on   the show, with the track beneath it in the weight the
  //                    page uses for context - a host talking over the
  //                    station is genuinely hearing both, so both are named
  //   show, paused     the show alone. The track is not audible, and a track
  //                    that cannot be heard has no place on a panel that says
  //                    what is on. That is the lie the pause glyph was added
  //                    to stop telling and it would be told again here.
  //
  // No word of ours appears in the live state. The dot carries it, as it did
  // in the header, and the words are the host's own.
  function showHold(j) {
    const held = !!(j && j.paused);
    const live = !!(j && j.show && j.show.live);
    $('npLabel').hidden = live;
    $('npLabel').textContent = held ? '\u23F8\uFE0F' : 'NOW PLAYING';
    $('np').classList.toggle('hold', held && !live);
    $('np').classList.toggle('under', live);
    // Hidden rather than emptied, so the panel closes up instead of leaving a
    // gap where a track used to be named.
    $('np').hidden = live && held;
  }

  function showLikes(j) {
    // Before the early return below, because the two are about different
    // things: that one is "is a track on", and a host can be live over a
    // station playing nothing at all - which is exactly what the music being
    // paused for a bucket set looks like from here.
    showShow(j && j.show);
    showHold(j);
    likeId = (j && j.id) || '';
    if (!likeId) { $('likerow').hidden = true; $('tugrow').hidden = true; return; }
    const mine = liked.includes(likeId);
    $('likeCount').textContent = j.likes;
    $('likeHeart').textContent = mine ? '\u2665' : '\u2661';
    $('likeBtn').disabled = mine;
    $('likerow').hidden = false;
    // Same response, same track: the position rides along with the likes
    // because this is the one endpoint a page with no password may ask.
    if (typeof j.elapsed === 'number') {
      trackElapsed = j.elapsed;
      trackTotal = typeof j.duration === 'number' ? j.duration : 0;
      trackAt = Date.now();
    }
    showTug(j);
    if (j && j.show && j.show.live && j.paused) {
      $('likerow').hidden = true;
      $('tugrow').hidden = true;
      $('findrow').hidden = true;
    }
  }

  async function pollLikes() {
    try { showLikes(await (await fetch('/likes/now', { cache: 'no-store' })).json()); }
    catch {
      $('likerow').hidden = true;
      $('tugrow').hidden = true;
      // The same rule as the clock below: a show this page was told about
      // before the station stopped answering is not a show it may keep
      // drawing.
      showShow(null);
      showHold(null);
      // Stop rather than keep counting from the last thing it was told. A
      // position that goes on climbing after the station stopped answering is
      // a number this page has no right to.
      trackAt = null;
    }
  }

  $('likeBtn').addEventListener('click', async () => {
    if (!likeId || liked.includes(likeId)) return;
    liked.push(likeId);
    liked = liked.slice(-50);
    try { localStorage.setItem(LIKED_KEY, JSON.stringify(liked)); } catch {}
    try { showLikes(await (await fetch('/likes/add', { method: 'POST' })).json()); }
    catch { pollLikes(); }
  });

  // --- the skip tug of war -----------------------------------------------
  // Same standard as the likes above: no login, no account, no identity. One
  // counter per track, from 0 to 12, shared by everybody listening - the skip
  // glyph adds one, the anchor takes one away, and at 12 the station skips.
  //
  // There is no per-browser budget here and that is not an oversight. A
  // listener who is alone can click twelve times and skip the song; that has to
  // be possible, or "somebody who does not want the skip has to keep the
  // counter down" is about nothing. Keeping a song is not a veto, it is effort,
  // and the effort is the feature: you cannot object once and be done, so a
  // brief loud opinion does not win and nobody holds the track.
  //
  // Nothing is stored. There is no localStorage key, because there is nothing
  // per-browser worth remembering - the counter belongs to the room, not to
  // this browser, and it arrives fresh in every response.
  //
  // GAP is the one piece of per-browser bookkeeping, and it is metering rather
  // than a budget: it bounds how fast this page can click, never how many times
  // it may. Without it a held Enter key, whose auto-repeat runs at about thirty
  // a second, walks the counter to twelve from one press nobody meant as twelve.
  //
  // 400 WAS WRONG AND WAS WRONG IN THE DIRECTION THAT HURTS. It is slower than
  // anybody taps a button they want something to happen on - deliberate tapping
  // sits near 300ms - so roughly every second click was swallowed here and
  // never sent. Reported as "it is taking me two clicks to do one click", which
  // is precisely what a 400ms floor does to a 300ms hand. The old comment
  // claimed twelve clicks took under five seconds; that was arithmetic at
  // exactly 400ms apart, and no hand is a metronome.
  //
  // 120 bounds this page to about eight clicks a second: still far under a key
  // repeat, and now comfortably above a hand. The cost of getting it wrong this
  // way is one dropped click out of an accident; the cost of the other way was
  // half of every honest click.
  //
  // No poller of its own. The counter arrives on /likes/now, which pollLikes
  // already asks for and which only runs while sound is coming out. A second
  // timer here would be the exact bug that block was written to fix.
  const GAP = 120;
  let rope = 0, pullNow = 0, lastPull = 0, coolUntil = 0;

  // One pip per click, and the same count in digits beside them. The page is
  // told how many there are rather than knowing, so twelve lives in exactly one
  // place and that place is the station - which is also why the reading is
  // built out of j.rope and why "/12" is written nowhere in this file.
  function showTug(j) {
    if (typeof j.pull !== 'number' || typeof j.rope !== 'number' || j.rope <= 0) {
      $('tugrow').hidden = true; return;
    }
    const el = $('rope');
    if (rope !== j.rope) {
      rope = j.rope;
      el.textContent = '';
      for (let i = 0; i < rope; i++) el.appendChild(document.createElement('i')).className = 'pip';
    }
    pullNow = j.pull;
    // The cool-off after a track change, during which the station refuses every
    // click, because the audio a listener is hearing is several seconds behind
    // what this page has already been told is playing - so a click now is a
    // vote on a song they have not reached yet.
    //
    // A deadline of our own, in two parts. The station hands over the LENGTH of
    // the window and its own position in the track, so what is left is the one
    // minus the other, worked out from the same two numbers the station uses.
    //
    // And then the part that is not arithmetic: the answer to the click that
    // takes the counter to the top is the answer to a skip that has just been
    // ordered but has not landed yet, so it still reports the OLD track's
    // position and truthfully says the window has not started. Believing it
    // leaves the buttons live until the next poll - measured at 3672 ms of a
    // 5000 ms window spent looking live while every click was refused. Nothing
    // but a click can take the counter to the top, so seeing it there IS proof
    // that a change has this moment happened, and the window is armed whole
    // from here rather than waiting to be told about it.
    const cool = typeof j.cool === 'number' ? j.cool : 0;
    const into = typeof j.elapsed === 'number' ? j.elapsed : 0;
    const left = pullNow >= rope ? cool
               : (into >= 0 && into < cool) ? cool - into
               : 0;
    coolUntil = Date.now() + left * 1000;
    [...el.children].forEach((p, i) => p.classList.toggle('on', i < pullNow));
    // The digits, off the same two variables as the line above and in the same
    // breath as it, so no redraw can leave the reading and the picture holding
    // different numbers. drawTug does not touch this and nothing else writes
    // it: the only other thing that happens to the figure is the fade, and the
    // fade is CSS hanging off the class drawTug already puts on the rope.
    $('tugNum').textContent = pullNow + '/' + rope;
    drawTug();
    $('tugrow').hidden = false;
  }

  // Split out of showTug because the cool-off ends between polls. tick() calls
  // this every second - the timer that already runs, and only while sound is
  // coming out - so the buttons come back when the wait is actually over
  // instead of at the next poll. Nothing new is on a timer.
  function drawTug() {
    const cool = Date.now() < coolUntil;
    $('rope').classList.toggle('cool', cool);
    $('tugSkip').disabled = cool;
    // Nought is the floor and nothing else - no saved state, no veto, just a
    // click with nowhere to go. Saying so with the button is kinder than taking
    // the click and doing nothing with it.
    $('tugKeep').disabled = cool || pullNow === 0;
  }

  // The answer is the whole public state, so one response redraws the counter,
  // the heart and the clock together and none of them can be caught disagreeing
  // with the others.
  //
  // The cool-off is checked here as well as drawn, because a click can arrive
  // between the button disabling and the eye noticing - and because the station
  // refuses it anyway. This only saves the round trip; it is not the rule.
  async function tugPull(path) {
    const now = Date.now();
    if (!likeId || now < coolUntil || now - lastPull < GAP) return;
    lastPull = now;
    try { showLikes(await (await fetch(path, { method: 'POST' })).json()); }
    catch { pollLikes(); }
  }

  $('tugSkip').addEventListener('click', () => tugPull('/tug/skip'));
  $('tugKeep').addEventListener('click', () => tugPull('/tug/keep'));

  // Everything on a timer, in one place, because "is sound coming out" is now
  // the only question that decides whether this page talks to the station at
  // all. Measured before this existed: one open tab made 691 requests in ten
  // minutes - 69 a minute, forever, whether or not anybody was listening. A tab
  // left open overnight was a tab downloading the guestbook two thousand times.
  //
  // The audio element is the switch rather than the button, so a pause from the
  // keyboard, the lock screen, a headset button or the stream dropping all stop
  // it too - the button is one way in and it was never the only one.
  const PULSE = [
    [poll,          8000],
    [loadMessages, 30000],
    [pollChat,      4000],
    [pollNarrator,  4000],
    [pollLikes,     5000],
    [tick,          1000],
  ];
  let timers = [];

  function wake() {
    if (timers.length) return;
    quiet = false;
    for (const [fn] of PULSE) fn();   // catch up now, do not wait out a cycle
    timers = PULSE.map(([fn, ms]) => setInterval(fn, ms));
  }

  function sleep() {
    if (!timers.length) return;
    timers.forEach(clearInterval);
    timers = [];
    // The clock stops rather than counting on from the last reading it was
    // given. A position that keeps climbing while nothing is being fetched is
    // a number this page has no right to - the same rule pollLikes already
    // follows when the station stops answering.
    trackAt = null;
    quiet = true;
    tick();
  }

  audio.addEventListener('playing', wake);
  audio.addEventListener('pause',   sleep);
  audio.addEventListener('ended',   sleep);
  audio.addEventListener('error',   () => { if (audio.paused) sleep(); });

  // One round at load and then silence until someone presses play. Without it
  // the page would open blank - no track, no guestbook, no chat - and asking a
  // visitor to press play to find out what is playing is the wrong way round.
  // One round is not traffic; sixty-nine a minute was.
  poll(); loadMessages(); pollChat(); pollNarrator(); pollLikes();
  quiet = true;
  tick();
})();
</script>
</body>
</html>
